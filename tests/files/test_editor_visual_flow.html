<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Editor Visual → Generador Flow</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Test de Flujo: Editor Visual → Generador</h1>
    
    <div class="test-section">
        <h2>1. Simular Datos del Editor Visual</h2>
        <button onclick="simulateEditorData()">📝 Crear Datos de Prueba</button>
        <button onclick="clearLocalStorage()">🗑️ Limpiar localStorage</button>
        <div id="editor-status"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Verificar localStorage</h2>
        <button onclick="checkLocalStorage()">🔍 Verificar datos</button>
        <div id="storage-status"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Simular Navegación</h2>
        <button onclick="goToGenerator()">🚀 Ir al Generador (simular desde editor-visual)</button>
    </div>

    <script>
        function simulateEditorData() {
            const testConfig = {
                service_name: "test_editor_visual",
                description: "Configuración de prueba desde Editor Visual",
                editor_version: "2.1.0",
                generated_timestamp: new Date().toISOString(),
                tables: [
                    {
                        name: "usuarios",
                        description: "Tabla de usuarios de prueba",
                        fields: [
                            {
                                name: "id",
                                field_type: "integer",
                                primary_key: true,
                                auto_increment: true,
                                nullable: false
                            },
                            {
                                name: "nombre",
                                field_type: "string",
                                primary_key: false,
                                auto_increment: false,
                                nullable: false
                            },
                            {
                                name: "email",
                                field_type: "email",
                                primary_key: false,
                                auto_increment: false,
                                nullable: false
                            }
                        ]
                    },
                    {
                        name: "pedidos",
                        description: "Tabla de pedidos de prueba",
                        fields: [
                            {
                                name: "id",
                                field_type: "integer",
                                primary_key: true,
                                auto_increment: true,
                                nullable: false
                            },
                            {
                                name: "total",
                                field_type: "integer",
                                primary_key: false,
                                auto_increment: false,
                                nullable: false
                            },
                            {
                                name: "id_usuario",
                                field_type: "integer",
                                primary_key: false,
                                auto_increment: false,
                                foreign_key: "usuarios.id",
                                nullable: false
                            }
                        ]
                    }
                ],
                relationships: [
                    {
                        from_table: "usuarios",
                        to_table: "pedidos",
                        relationship_type: "one_to_many",
                        from_field: "id",
                        to_field: "id_usuario",
                        relationship_name: "usuarios_to_pedidos",
                        back_populates: null,
                        cascade_delete: false,
                        lazy_loading: "select"
                    }
                ],
                generate_crud_for_all: true,
                generate_relationship_endpoints: true
            };
            
            try {
                localStorage.setItem('generator_config', JSON.stringify(testConfig));
                document.getElementById('editor-status').innerHTML = 
                    '<div class="success">✅ Datos de prueba guardados en localStorage</div>';
                console.log('✅ Configuración de prueba guardada:', testConfig);
            } catch (error) {
                document.getElementById('editor-status').innerHTML = 
                    '<div class="error">❌ Error al guardar: ' + error.message + '</div>';
                console.error('❌ Error:', error);
            }
        }
        
        function clearLocalStorage() {
            localStorage.removeItem('generator_config');
            document.getElementById('editor-status').innerHTML = 
                '<div>🗑️ localStorage limpiado</div>';
            document.getElementById('storage-status').innerHTML = '';
        }
        
        function checkLocalStorage() {
            const config = localStorage.getItem('generator_config');
            const statusDiv = document.getElementById('storage-status');
            
            if (config) {
                try {
                    const parsed = JSON.parse(config);
                    statusDiv.innerHTML = `
                        <div class="success">
                            ✅ <strong>Configuración encontrada:</strong><br>
                            📋 Servicio: ${parsed.service_name || 'Sin nombre'}<br>
                            🏗️ Tablas: ${parsed.tables ? parsed.tables.length : 0}<br>
                            🔗 Relaciones: ${parsed.relationships ? parsed.relationships.length : 0}<br>
                            ⏰ Generado: ${parsed.generated_timestamp || 'No especificado'}
                        </div>
                        <details>
                            <summary>Ver JSON completo</summary>
                            <pre style="background: #f5f5f5; padding: 10px; overflow: auto; max-height: 200px;">${JSON.stringify(parsed, null, 2)}</pre>
                        </details>
                    `;
                } catch (error) {
                    statusDiv.innerHTML = 
                        '<div class="error">❌ JSON inválido en localStorage: ' + error.message + '</div>';
                }
            } else {
                statusDiv.innerHTML = 
                    '<div class="error">❌ No hay configuración en localStorage</div>';
            }
        }
        
        function goToGenerator() {
            // Simular que venimos del editor visual estableciendo el referrer
            // (En un caso real, esto se haría con window.location.href desde editor-visual)
            
            const config = localStorage.getItem('generator_config');
            if (!config) {
                alert('❌ Primero crea datos de prueba');
                return;
            }
            
            // Abrir el generador en una nueva pestaña con parámetro especial
            const generatorURL = '/generar/?from=editor-visual';
            window.open(generatorURL, '_blank');
        }
        
        // Auto-verificar al cargar la página
        window.addEventListener('load', function() {
            checkLocalStorage();
        });
    </script>
</body>
</html>
