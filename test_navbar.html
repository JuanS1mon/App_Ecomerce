<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div id="navbar-placeholder">
        <!-- El navbar se cargará aquí -->
    </div>
    
    <div class="container mx-auto mt-8 p-4">
        <h1 class="text-2xl font-bold mb-4">Test de Navegación</h1>
        <div class="space-y-4">
            <button onclick="testRoute('/admin')" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Ir a /admin
            </button>
            <button onclick="testRoute('/admin/usuarios')" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                Ir a /admin/usuarios
            </button>
            <button onclick="testRoute('/admin/usuarios/perfil')" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                Ir a /admin/usuarios/perfil
            </button>
            <button onclick="testRoute('/admin/configuracion')" class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">
                Ir a /admin/configuracion
            </button>
        </div>
        
        <div class="mt-8 p-4 bg-white rounded shadow">
            <h2 class="text-lg font-semibold mb-2">Console Output:</h2>
            <div id="console-output" class="text-sm font-mono bg-gray-100 p-2 rounded max-h-96 overflow-y-auto">
                <!-- Los logs aparecerán aquí -->
            </div>
        </div>
    </div>

    <script>
        // Override console.log para mostrar en la página
        const originalLog = console.log;
        const originalError = console.error;
        const consoleOutput = document.getElementById('console-output');
        
        function addToConsole(message, type = 'log') {
            const div = document.createElement('div');
            div.className = type === 'error' ? 'text-red-600' : 'text-gray-800';
            div.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole(args.join(' '));
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole(args.join(' '), 'error');
        };
        
        // Función para cambiar rutas simuladas
        function testRoute(path) {
            console.log('=== Cambiando a ruta:', path, ' ===');
            
            // Simular cambio de URL
            window.history.pushState({}, '', path);
            
            // Actualizar navegación si existe la función
            if (window.updateNavigation) {
                window.updateNavigation();
            } else {
                console.error('updateNavigation no está disponible');
            }
        }
        
        // Cargar navbar
        async function loadNavbar() {
            try {
                console.log('Cargando navbar...');
                const response = await fetch('http://localhost:8000/static/components/navbar.html');
                if (!response.ok) {
                    throw new Error('Error al cargar navbar: ' + response.status);
                }
                const html = await response.text();
                document.getElementById('navbar-placeholder').innerHTML = html;
                
                // Ejecutar scripts del navbar
                const scripts = document.getElementById('navbar-placeholder').getElementsByTagName('script');
                for (let script of scripts) {
                    try {
                        const func = new Function(script.innerHTML);
                        func();
                        console.log('Script del navbar ejecutado correctamente');
                    } catch (e) {
                        console.error('Error ejecutando script del navbar:', e);
                    }
                }
                
                console.log('Navbar cargado exitosamente');
            } catch (error) {
                console.error('Error cargando navbar:', error);
            }
        }
        
        // Cargar cuando la página esté lista
        document.addEventListener('DOMContentLoaded', loadNavbar);
    </script>
</body>
</html>
