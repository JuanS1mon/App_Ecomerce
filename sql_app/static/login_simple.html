<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .form-input-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            z-index: 10;
        }
        
        .input-with-icon {
            padding-left: 35px;
        }
        
        .form-field {
            transition: all 0.3s ease;
        }
        
        .form-field:focus-within {
            transform: translateY(-2px);
        }
        
        .form-field:focus-within label {
            color: #4f46e5;
        }
        
        .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white p-8 rounded-xl shadow-md card-hover border border-gray-100">
            <div class="text-center mb-8">
                <div class="icon-circle bg-indigo-100 text-indigo-600 mx-auto mb-4">
                    <i class="fas fa-lock text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Iniciar sesión</h1>
                <p class="text-gray-500 mt-2">Ingresa tus credenciales para continuar</p>
            </div>
            
            <!-- FORMULARIO SIMPLE SIN INTERFERENCIAS JS -->
            <form id="login_form" action="/auth/login" method="POST" class="space-y-5">
                <!-- Campo hidden para el parámetro next -->
                <input type="hidden" id="next" name="next" value="">
                
                <div class="form-field relative">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nombre de usuario</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" id="username" name="username" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                </div>
                
                <div class="form-field relative">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="password" name="password" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <button type="button" id="toggle-password" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember_me" name="remember_me" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                        <label for="remember_me" class="ml-2 block text-sm text-gray-700">
                            Recordarme
                        </label>
                    </div>
                    <div class="text-sm">
                        <a href="/reset-password" class="font-medium text-indigo-600 hover:text-indigo-500">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                </div>
                
                <div>
                    <button type="submit" class="w-full flex justify-center items-center gradient-bg text-white py-2 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-300 font-medium text-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Iniciar sesión
                    </button>
                </div>
                
                <!-- Mensaje de error -->
                <div id="message" class="text-center text-red-500 font-medium"></div>
            </form>
        </div>
        
        <!-- Información adicional -->
        <div class="mt-6 bg-white rounded-xl shadow-sm border border-gray-100 p-4">
            <div class="flex items-center text-sm text-gray-600">
                <div class="flex-shrink-0 bg-blue-100 rounded-full p-2 mr-3">
                    <i class="fas fa-info-circle text-blue-500"></i>
                </div>
                <p>Si tienes problemas para iniciar sesión, contacta con el equipo de soporte.</p>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Login simplificado cargado');
            
            // Establecer parámetro next desde URL
            const urlParams = new URLSearchParams(window.location.search);
            const nextParam = urlParams.get('next') || urlParams.get('redirect') || '/admin';
            document.getElementById('next').value = nextParam;
            console.log('📍 Parámetro next establecido:', nextParam);
            
            // Toggle password visibility
            document.getElementById('toggle-password').addEventListener('click', function() {
                const passwordInput = document.getElementById('password');
                const icon = this.querySelector('i');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
            
            // Manejo simple del formulario - Solo logs, sin interferencia
            document.getElementById('login_form').addEventListener('submit', function(event) {
                console.log('📤 Enviando formulario de login...');
                console.log('🎯 Action:', this.action);
                console.log('📋 Method:', this.method);
                console.log('📍 Next:', this.next.value);
                
                // NO interferir - dejar que el formulario se envíe normalmente al backend
            });
        });
    </script>
</body>
</html>
