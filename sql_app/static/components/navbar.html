                    <div class="bg-gray-50 px-4 py-3 border-b border-gray-100">

<script>
(function() {
    'use strict';
    
    // Configuración de rutas para el breadcrumb
    var routeConfig = {
        '/': { title: 'Inicio', icon: 'fa-home', isRoot: true },
        '/index': { title: 'Inicio', icon: 'fa-home', isRoot: true },
        '/admin': { title: 'Administración', parent: '/', icon: 'fa-cog' },
        '/admin/usuarios': { title: 'Usuarios', parent: '/admin', icon: 'fa-users' },
        '/admin/usuarios/perfil': { title: 'Perfil', parent: '/admin/usuarios', icon: 'fa-user-circle' },
        '/admin/usuarios/nuevo': { title: 'Nuevo Usuario', parent: '/admin/usuarios', icon: 'fa-user-plus' },
        '/admin/usuarios/editar': { title: 'Editar Usuario', parent: '/admin/usuarios', icon: 'fa-user-edit' },
        '/admin/perfil': { title: 'Mi Perfil', parent: '/admin', icon: 'fa-user-circle' },
        '/admin/configuracion': { title: 'Configuración', parent: '/admin', icon: 'fa-cogs' },
        '/configdb': { title: 'Configuración DB', parent: '/admin', icon: 'fa-database' },
        '/migraciones': { title: 'Migraciones', parent: '/admin', icon: 'fa-exchange-alt' },
        '/generar': { title: 'Generar API', parent: '/admin', icon: 'fa-code' },
        '/app_stock': { title: 'Inventario', parent: '/', icon: 'fa-boxes' },
        '/articulos': { title: 'Artículos', parent: '/app_stock', icon: 'fa-box' },
        '/articulos/dashboard': { title: 'Dashboard', parent: '/articulos', icon: 'fa-tachometer-alt' },
        '/categorias': { title: 'Categorías', parent: '/app_stock', icon: 'fa-tags' },
        '/proveedores': { title: 'Proveedores', parent: '/app_stock', icon: 'fa-truck' },
        '/facturacion': { title: 'Facturación', parent: '/', icon: 'fa-file-invoice' },
        '/facturas': { title: 'Facturas', parent: '/facturacion', icon: 'fa-file-invoice-dollar' },
        '/presupuestos': { title: 'Presupuestos', parent: '/facturacion', icon: 'fa-file-alt' }
    };

    // Función para normalizar rutas
    function normalizePath(path) {
        var normalizedPath = path.split('?')[0];
        if (normalizedPath.length > 1 && normalizedPath.endsWith('/')) {
            normalizedPath = normalizedPath.slice(0, -1);
        }
        if (normalizedPath === '' || normalizedPath === '/') {
            normalizedPath = '/';
        }
        return normalizedPath;
    }

    // Función para generar ruta dinámicamente si no está configurada
    function generateDynamicRoute(path) {
        var segments = path.split('/').filter(function(s) { return s; });
        if (segments.length === 0) {
            return { title: 'Inicio', parent: null, icon: 'fa-home' };
        }
        
        var lastSegment = segments[segments.length - 1];
        var parentPath = '/' + segments.slice(0, -1).join('/');
        var normalizedParent = parentPath === '/' ? '/' : parentPath;
        
        if (/^\d+$/.test(lastSegment)) {
            return {
                title: 'ID: ' + lastSegment,
                parent: normalizedParent || '/',
                icon: 'fa-hashtag'
            };
        }
        
        var actionIcons = {
            'nuevo': 'fa-plus',
            'nueva': 'fa-plus',
            'editar': 'fa-edit',
            'ver': 'fa-eye',
            'eliminar': 'fa-trash',
            'configurar': 'fa-cog',
            'configuracion': 'fa-cogs',
            'perfil': 'fa-user-circle',
            'dashboard': 'fa-tachometer-alt'
        };
        
        var icon = actionIcons[lastSegment.toLowerCase()] || 'fa-folder';
        var title = lastSegment.charAt(0).toUpperCase() + lastSegment.slice(1).replace(/_/g, ' ');
        
        return {
            title: title,
            parent: normalizedParent || '/',
            icon: icon
        };
    }

    // Función para construir la cadena de breadcrumb
    function buildBreadcrumbChain(targetPath) {
        var breadcrumbChain = [];
        
        function buildChain(path) {
            if (!routeConfig[path]) {
                var dynamicConfig = generateDynamicRoute(path);
                if (dynamicConfig) {
                    breadcrumbChain.unshift({
                        title: dynamicConfig.title,
                        path: path,
                        icon: dynamicConfig.icon,
                        active: path === targetPath
                    });
                    
                    if (dynamicConfig.parent && dynamicConfig.parent !== path) {
                        buildChain(dynamicConfig.parent);
                    }
                }
                return;
            }
            
            var config = routeConfig[path];
            breadcrumbChain.unshift({
                title: config.title,
                path: path,
                icon: config.icon || '',
                active: path === targetPath
            });
            
            if (config.parent && config.parent !== path && !config.isRoot) {
                buildChain(config.parent);
            }
        }
        
        buildChain(targetPath);
        
        if (breadcrumbChain.length === 0 || breadcrumbChain[0].path !== '/') {
            breadcrumbChain.unshift({
                title: 'Inicio',
                path: '/',
                icon: 'fa-home',
                active: targetPath === '/' || targetPath === '/index'
            });
        }
        
        return breadcrumbChain;
    }

    // Función para generar el breadcrumb HTML
    function generateBreadcrumb() {
        var currentPath = window.location.pathname;
        var normalizedPath = normalizePath(currentPath);
        var breadcrumbChain = buildBreadcrumbChain(normalizedPath);
        return breadcrumbChain;
    }

    // Función para actualizar la navegación
    function updateNavigation() {
        var breadcrumbContainer = document.getElementById('breadcrumb-container');
        if (!breadcrumbContainer) {
            return;
        }
        
        var breadcrumbElements = generateBreadcrumb();
        breadcrumbContainer.innerHTML = '';
        
        for (var i = 0; i < breadcrumbElements.length; i++) {
            var item = breadcrumbElements[i];
            var itemContainer = document.createElement('div');
            itemContainer.className = 'flex items-center';
            
            var element = document.createElement(item.active ? 'span' : 'a');
            
            if (item.icon) {
                var icon = document.createElement('i');
                icon.className = 'fas ' + item.icon + ' text-xs';
                element.appendChild(icon);
                
                var space = document.createTextNode(' ');
                element.appendChild(space);
            }
            
            var textNode = document.createTextNode(item.title);
            element.appendChild(textNode);
            
            if (item.active) {
                element.className = 'text-gray-700 font-semibold flex items-center px-3 py-1.5 bg-gray-100 rounded-lg text-sm';
                element.style.fontFamily = "'Inter', -apple-system, BlinkMacSystemFont, sans-serif";
            } else {
                element.href = item.path;
                element.className = 'text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-200 flex items-center px-3 py-1.5 rounded-lg text-sm font-medium';
                element.style.fontFamily = "'Inter', -apple-system, BlinkMacSystemFont, sans-serif";
            }
            
            itemContainer.appendChild(element);
            breadcrumbContainer.appendChild(itemContainer);
            
            if (i < breadcrumbElements.length - 1) {
                var separator = document.createElement('span');
                separator.className = 'text-gray-400 mx-2 text-xs';
                separator.innerHTML = '<i class="fas fa-chevron-right"></i>';
                breadcrumbContainer.appendChild(separator);
            }
        }
        
        var activeElement = breadcrumbElements[breadcrumbElements.length - 1];
        if (activeElement) {
            document.title = activeElement.title + ' - SQL App Studio';
        }

        fetchCurrentUser();
    }

    // Función para obtener datos del usuario actual
    function fetchCurrentUser() {
        var userInitial = document.getElementById('user-initial');
        var userName = document.getElementById('user-name');
        var userEmail = document.getElementById('user-email');
        
        console.log('🔍 Iniciando carga del perfil de usuario...');
        
        // Intentar múltiples endpoints
        async function tryEndpoint(url) {
            try {
                const response = await fetch(url, {
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('access_token') || ''}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log(`✅ Datos obtenidos de ${url}:`, data);
                    return data;
                }
                return null;
            } catch (error) {
                console.log(`❌ Error en ${url}:`, error);
                return null;
            }
        }
        
        async function loadUserData() {
            const endpoints = ['/auth/test-user', '/api/public/auth/me', '/auth/current-user'];
            
            for (const endpoint of endpoints) {
                const data = await tryEndpoint(endpoint);
                if (data) {
                    updateUserElements(userInitial, userName, userEmail, data);
                    return;
                }
            }
            
            // Si no se obtuvieron datos, usar valores por defecto
            console.log('ℹ️ Usando datos por defecto');
            useDefaultUserData();
        }
        
        function useDefaultUserData() {
            if (userInitial) userInitial.textContent = 'U';
            if (userName) userName.textContent = 'Usuario Invitado';
            if (userEmail) userEmail.textContent = 'Sin autenticar';
        }
        
        loadUserData();
    }

    // Función para actualizar elementos de usuario en la UI
    function updateUserElements(userInitial, userName, userEmail, data) {
        console.log('🔄 Actualizando elementos del usuario:', data);
        
        if (!data) {
            console.warn('⚠️ No hay datos de usuario para actualizar');
            return;
        }
        
        // Actualizar nombre
        var displayName = data.nombre || data.name || data.usuario || 'Usuario';
        if (userName) {
            userName.textContent = displayName;
        }
        
        // Actualizar email
        var displayEmail = data.email || data.correo || 'Sin email';
        if (userEmail) {
            userEmail.textContent = displayEmail;
        }
        
        // Actualizar inicial y posible imagen
        if (userInitial) {
            // Si hay imagen SVG, usarla
            if (data.imagen && data.imagen.startsWith('data:image/svg+xml')) {
                console.log('🖼️ Configurando imagen SVG para el avatar');
                
                // Encontrar el contenedor del avatar
                var avatarContainer = userInitial.closest('.w-8.h-8, .w-10.h-10, [class*="w-"], [class*="h-"]') || userInitial.parentElement;
                
                if (avatarContainer) {
                    // Crear elemento img para la imagen SVG
                    var imgElement = document.createElement('img');
                    imgElement.src = data.imagen;
                    imgElement.alt = 'Avatar de ' + displayName;
                    imgElement.className = 'w-full h-full rounded-full object-cover';
                    imgElement.style.width = '100%';
                    imgElement.style.height = '100%';
                    
                    // Reemplazar el contenido del contenedor
                    avatarContainer.innerHTML = '';
                    avatarContainer.appendChild(imgElement);
                    
                    console.log('✅ Imagen SVG aplicada correctamente');
                } else {
                    // Fallback: usar inicial
                    var inicial = displayName.charAt(0).toUpperCase();
                    userInitial.textContent = inicial;
                    console.log('📝 Usando inicial como fallback:', inicial);
                }
            } else {
                // Sin imagen: usar inicial
                var inicial = displayName.charAt(0).toUpperCase();
                userInitial.textContent = inicial;
                console.log('📝 Usando inicial del nombre:', inicial);
            }
        }
        
        console.log('✅ Actualización de elementos completada');
    }

    // Función para configurar el manejador de logout
    function setupLogoutHandler() {
        var logoutForm = document.getElementById('logout-form');
        if (logoutForm) {
            logoutForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                fetch('/logout', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                })
                .then(function(response) {
                    if (response.ok || response.redirected) {
                        window.location.href = '/loginpage';
                    } else {
                        throw new Error('Error al cerrar sesión');
                    }
                })
                .catch(function(error) {
                    console.error('Error en logout:', error);
                    alert('Error al cerrar sesión. Por favor, inténtelo de nuevo.');
                });
            });
        }
    }

    // Función principal de inicialización
    function initializeNavbar() {
        // Configurar fecha actual
        var fechaActual = new Date();
        var opciones = { day: 'numeric', month: 'short', year: 'numeric' };
        var currentDateElement = document.getElementById('current-date');
        if (currentDateElement) {
            currentDateElement.textContent = fechaActual.toLocaleDateString('es-ES', opciones);
        }

        // Configurar menú de perfil
        var perfilBtn = document.getElementById('perfil');
        var perfilMenu = document.getElementById('menu-perfil');
        
        if (perfilBtn && perfilMenu) {
            perfilBtn.addEventListener('click', function(event) {
                event.preventDefault();
                perfilMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', function(event) {
                if (!perfilBtn.contains(event.target) && !perfilMenu.contains(event.target)) {
                    perfilMenu.classList.add('hidden');
                }
            });
        }

        // Actualizar navegación
        updateNavigation();
    }

    // Exponer funciones globalmente
    window.addEventListener('popstate', updateNavigation);
    window.updateNavigation = updateNavigation;
    window.generateBreadcrumb = generateBreadcrumb;
    
    window.refreshNavigation = function() {
        updateNavigation();
    };
    
    window.addRoute = function(path, config) {
        routeConfig[path] = config;
    };

    // Inicializar cuando el DOM esté listo
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeNavbar);
    } else {
        setTimeout(initializeNavbar, 10);
    }

})();
</script>
