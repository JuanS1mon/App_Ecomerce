<script>
(function() {

    // Configuración de rutas para el breadcrumb
    var routeConfig = {
        '/': { title: 'Inicio', icon: 'fa-home', isRoot: true },
        '/index': { title: 'Inicio', icon: 'fa-home', isRoot: true },
        '/admin': { title: 'Administración', parent: '/', icon: 'fa-cog' },

        '/admin/usuarios/editar': { title: 'Editar Usuario', parent: '/admin/usuarios', icon: 'fa-user-edit' },

        '/admin/configuracion': { title: 'Configuración', parent: '/admin', icon: 'fa-cogs' },
        '/configdb': { title: 'Configuración DB', parent: '/admin', icon: 'fa-database' },
        '/migraciones': { title: 'Migraciones', parent: '/admin', icon: 'fa-exchange-alt' },
        '/generar': { title: 'Generar API', parent: '/admin', icon: 'fa-code' },
        '/app_stock': { title: 'Inventario', parent: '/', icon: 'fa-boxes' },
        '/articulos': { title: 'Artículos', parent: '/app_stock', icon: 'fa-box' },
        '/articulos/dashboard': { title: 'Dashboard', parent: '/articulos', icon: 'fa-tachometer-alt' },
        '/categorias': { title: 'Categorías', parent: '/app_stock', icon: 'fa-tags' },
        '/proveedores': { title: 'Proveedores', parent: '/app_stock', icon: 'fa-truck' },
        '/facturacion': { title: 'Facturación', parent: '/', icon: 'fa-file-invoice' },
        '/facturas': { title: 'Facturas', parent: '/facturacion', icon: 'fa-file-invoice-dollar' },
        '/presupuestos': { title: 'Presupuestos', parent: '/facturacion', icon: 'fa-file-alt' }
    };

    // Función para normalizar rutas
    function normalizePath(path) {
        var normalizedPath = path.split('?')[0];
        if (normalizedPath.length > 1 && normalizedPath.endsWith('/')) {
            normalizedPath = normalizedPath.slice(0, -1);
        }
        if (normalizedPath === '' || normalizedPath === '/') {
            normalizedPath = '/';
        }
        return normalizedPath;
    }

    // Función para generar ruta dinámicamente si no está configurada
    function generateDynamicRoute(path) {
        var segments = path.split('/').filter(function(s) { return s; });
        if (segments.length === 0) {
            return { title: 'Inicio', parent: null, icon: 'fa-home' };
        }
        
        var lastSegment = segments[segments.length - 1];
        var parentPath = '/' + segments.slice(0, -1).join('/');
        var normalizedParent = parentPath === '/' ? '/' : parentPath;
        
        if (/^\d+$/.test(lastSegment)) {
            return {
                title: 'ID: ' + lastSegment,
                parent: normalizedParent || '/',
                icon: 'fa-hashtag'
            };
        }
        
        var actionIcons = {
            'nuevo': 'fa-plus',
            'nueva': 'fa-plus',
            'editar': 'fa-edit',
            'ver': 'fa-eye',
            'eliminar': 'fa-trash',
            'configurar': 'fa-cog',
            'configuracion': 'fa-cogs',
            'perfil': 'fa-user-circle',
            'dashboard': 'fa-tachometer-alt'
        };
        
        var icon = actionIcons[lastSegment.toLowerCase()] || 'fa-folder';
        var title = lastSegment.charAt(0).toUpperCase() + lastSegment.slice(1).replace(/_/g, ' ');
        
        return {
            title: title,
            parent: normalizedParent || '/',
            icon: icon
        };
    }

    // Función para construir la cadena de breadcrumb
    function buildBreadcrumbChain(targetPath) {
        var breadcrumbChain = [];
        
        function buildChain(path) {
            if (!routeConfig[path]) {
                var dynamicConfig = generateDynamicRoute(path);
                if (dynamicConfig) {
                    breadcrumbChain.unshift({
                        title: dynamicConfig.title,
                        path: path,
                        icon: dynamicConfig.icon,
                        active: path === targetPath
                    });
                    
                    if (dynamicConfig.parent && dynamicConfig.parent !== path) {
                        buildChain(dynamicConfig.parent);
                    }
                }
                return;
            }
            
            var config = routeConfig[path];
            breadcrumbChain.unshift({
                title: config.title,
                path: path,
                icon: config.icon || '',
                active: path === targetPath
            });
            
            if (config.parent && config.parent !== path && !config.isRoot) {
                buildChain(config.parent);
            }
        }
        
        buildChain(targetPath);
        
        if (breadcrumbChain.length === 0 || breadcrumbChain[0].path !== '/') {
            breadcrumbChain.unshift({
                title: 'Inicio',
                path: '/',
                icon: 'fa-home',
                active: targetPath === '/' || targetPath === '/index'
            });
        }
        
        return breadcrumbChain;
    }

    // Función para generar el breadcrumb HTML
    function generateBreadcrumb() {
        var currentPath = window.location.pathname;
        var normalizedPath = normalizePath(currentPath);
        var breadcrumbChain = buildBreadcrumbChain(normalizedPath);
        return breadcrumbChain;
    }

    // Función para actualizar la navegación
    function updateNavigation() {
        var breadcrumbContainer = document.getElementById('breadcrumb-container');
        if (!breadcrumbContainer) {
            return;
        }
        
        var breadcrumbElements = generateBreadcrumb();
        breadcrumbContainer.innerHTML = '';
        
        for (var i = 0; i < breadcrumbElements.length; i++) {
            var item = breadcrumbElements[i];
            var itemContainer = document.createElement('div');
            itemContainer.className = 'flex items-center';
            
            var element = document.createElement(item.active ? 'span' : 'a');
            
            if (item.icon) {
                var icon = document.createElement('i');
                icon.className = 'fas ' + item.icon + ' text-xs';
                element.appendChild(icon);
                
                var space = document.createTextNode(' ');
                element.appendChild(space);
            }
            
            var textNode = document.createTextNode(item.title);
            element.appendChild(textNode);
            
            if (item.active) {
                element.className = 'text-gray-700 font-semibold flex items-center px-3 py-1.5 bg-gray-100 rounded-lg text-sm';
                element.style.fontFamily = "'Inter', -apple-system, BlinkMacSystemFont, sans-serif";
            } else {
                element.href = item.path;
                element.className = 'text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all duration-200 flex items-center px-3 py-1.5 rounded-lg text-sm font-medium';
                element.style.fontFamily = "'Inter', -apple-system, BlinkMacSystemFont, sans-serif";
            }
            
            itemContainer.appendChild(element);
            breadcrumbContainer.appendChild(itemContainer);
            
            if (i < breadcrumbElements.length - 1) {
                var separator = document.createElement('span');
                separator.className = 'text-gray-400 mx-2 text-xs';
                separator.innerHTML = '<i class="fas fa-chevron-right"></i>';
                breadcrumbContainer.appendChild(separator);
            }
        }
        
        var activeElement = breadcrumbElements[breadcrumbElements.length - 1];
        if (activeElement) {
            document.title = activeElement.title + ' - SQL App Studio';
        }

        fetchCurrentUser();
    }

    // Función para obtener datos del usuario actual
    function fetchCurrentUser() {
        var userInitial = document.getElementById('user-initial');
        var userName = document.getElementById('user-name');
        var userEmail = document.getElementById('user-email');
        
        if (window.currentUser && window.currentUser.nombre) {
            updateUserElements(userInitial, userName, userEmail, window.currentUser);
            return;
        }
        
        if (typeof window.loadCurrentUser === 'function') {
            window.loadCurrentUser().then(function(data) {
                updateUserElements(userInitial, userName, userEmail, data);
            }).catch(function(error) {
                console.warn('Error al cargar usuario:', error);
            });
        } else {
            fetch('/auth/me', {
                credentials: 'include',
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(function(response) {
                if (response.ok) {
                    return response.json();
                }
                throw new Error('No autenticado');
            })
            .then(function(data) {
                updateUserElements(userInitial, userName, userEmail, data);
                setupLogoutHandler();
            })
            .catch(function(error) {
                console.log('Usuario no autenticado:', error);
            });
        }
    }

    // Función para actualizar elementos de usuario en la UI
    function updateUserElements(userInitial, userName, userEmail, data) {
        if (userInitial && data.nombre) {
            userInitial.textContent = data.nombre.charAt(0).toUpperCase();
        }
        if (userName && data.nombre) {
            userName.textContent = data.nombre;
        }
        if (userEmail && data.email) {
            userEmail.textContent = data.email;
        }
    }

    // Función para configurar el manejador de logout
    function setupLogoutHandler() {
        var logoutForm = document.getElementById('logout-form');
        if (logoutForm) {
            logoutForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                fetch('/logout', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                })
                .then(function(response) {
                    if (response.ok || response.redirected) {
                        window.location.href = '/loginpage';
                    } else {
                        throw new Error('Error al cerrar sesión');
                    }
                })
                .catch(function(error) {
                    console.error('Error en logout:', error);
                    alert('Error al cerrar sesión. Por favor, inténtelo de nuevo.');
                });
            });
        }
    }

    // Sistema de Mensajes/Notificaciones
    function initializeMensajesSystem() {
        console.log('🔔 Inicializando sistema de mensajes desde navbar...');
        var mensajesBtn = document.getElementById('mensajes-btn');
        var mensajesDropdown = document.getElementById('mensajes-dropdown');
        var mensajesBadge = document.getElementById('mensajes-badge');
        var mensajesLista = document.getElementById('mensajes-lista');
        var marcarTodosBtn = document.getElementById('marcar-todos-leidos');
        
        if (!mensajesBtn || !mensajesDropdown) {
            console.log('❌ Elementos del sistema de mensajes no encontrados');
            return;
        }
        
        console.log('✅ Elementos encontrados, configurando eventos...');
        
        // Toggle dropdown
        mensajesBtn.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            console.log('🔔 Click en botón mensajes');
            mensajesDropdown.classList.toggle('hidden');
            
            // Si se abre el dropdown, cargar mensajes
            if (!mensajesDropdown.classList.contains('hidden')) {
                console.log('📂 Dropdown abierto, cargando mensajes...');
                cargarMensajes();
            }
        });
        
        // Cerrar dropdown al hacer clic fuera
        document.addEventListener('click', function(event) {
            if (!mensajesBtn.contains(event.target) && !mensajesDropdown.contains(event.target)) {
                mensajesDropdown.classList.add('hidden');
            }
        });
        
        // Marcar todos como leídos
        if (marcarTodosBtn) {
            marcarTodosBtn.addEventListener('click', function() {
                console.log('✅ Marcando todos como leídos...');
                marcarTodosComoLeidos();
            });
        }
        
        // Cargar contador inicial
        console.log('📊 Cargando contador inicial...');
        actualizarContadorMensajes();
        
        // Actualizar cada 30 segundos
        setInterval(actualizarContadorMensajes, 30000);
        console.log('✅ Sistema de mensajes inicializado');
    }
    
    function actualizarContadorMensajes() {
        console.log('📊 Actualizando contador de mensajes...');
        fetch('/api/mensajes/no-leidos/count', {
            credentials: 'include',
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(function(response) {
            console.log('📊 Respuesta contador:', response.status);
            if (response.ok) {
                return response.json();
            }
            throw new Error('Error al obtener contador: ' + response.status);
        })
        .then(function(data) {
            console.log('📊 Datos contador:', data);
            var badge = document.getElementById('mensajes-badge');
            if (badge) {
                if (data.count > 0) {
                    badge.textContent = data.count > 99 ? '99+' : data.count;
                    badge.classList.remove('hidden');
                    console.log('📊 Badge visible con', data.count, 'mensajes');
                } else {
                    badge.classList.add('hidden');
                    console.log('📊 Badge oculto (sin mensajes)');
                }
            }
        })
        .catch(function(error) {
            console.warn('❌ Error al actualizar contador de mensajes:', error);
        });
    }
    
    function cargarMensajes() {
        var mensajesLista = document.getElementById('mensajes-lista');
        if (!mensajesLista) return;
        
        // Mostrar loading
        mensajesLista.innerHTML = '<div class="flex items-center justify-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i><span class="text-sm text-gray-500">Cargando...</span></div>';
        
        fetch('/api/mensajes/navbar', {
            credentials: 'include',
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(function(response) {
            if (response.ok) {
                return response.json();
            }
            throw new Error('Error al cargar mensajes');
        })
        .then(function(mensajes) {
            mostrarMensajes(mensajes);
        })
        .catch(function(error) {
            console.error('Error al cargar mensajes:', error);
            mensajesLista.innerHTML = '<div class="flex items-center justify-center py-4 text-red-500"><i class="fas fa-exclamation-triangle mr-2"></i><span class="text-sm">Error al cargar mensajes</span></div>';
        });
    }
    
    function mostrarMensajes(mensajes) {
        var mensajesLista = document.getElementById('mensajes-lista');
        if (!mensajesLista) return;
        
        if (mensajes.length === 0) {
            mensajesLista.innerHTML = '<div class="flex items-center justify-center py-8 text-gray-500"><i class="fas fa-inbox mr-2"></i><span class="text-sm">No hay mensajes</span></div>';
            return;
        }
        
        var html = '';
        mensajes.forEach(function(mensaje) {
            var fechaRelativa = formatearFechaRelativa(mensaje.fecha_creacion);
            var iconoTipo = getIconoTipoMensaje(mensaje.tipo);
            var colorPrioridad = getColorPrioridad(mensaje.prioridad);
            var fondoClase = mensaje.leido ? 'bg-white' : 'bg-blue-50 border-l-4 border-blue-400';
            
            html += '<div class="' + fondoClase + ' p-4 hover:bg-gray-50 cursor-pointer transition-colors border-b border-gray-100" onclick="abrirMensaje(' + mensaje.id + ')">';
            html += '<div class="flex items-start space-x-3">';
            html += '<div class="flex-shrink-0">';
            html += '<i class="' + iconoTipo + ' ' + colorPrioridad + ' text-sm"></i>';
            html += '</div>';
            html += '<div class="flex-1 min-w-0">';
            html += '<div class="flex items-center justify-between">';
            html += '<p class="text-sm font-medium text-gray-900 truncate" style="font-family: \'Inter\', -apple-system, BlinkMacSystemFont, sans-serif;">' + (mensaje.titulo || 'Sin título') + '</p>';
            if (!mensaje.leido) {
                html += '<span class="ml-2 inline-block w-2 h-2 bg-blue-500 rounded-full"></span>';
            }
            html += '</div>';
            html += '<p class="text-xs text-gray-500 mt-1" style="font-family: \'Inter\', -apple-system, BlinkMacSystemFont, sans-serif;">';
            html += (mensaje.nombre_emisor || 'Sistema') + ' • ' + fechaRelativa;
            html += '</p>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
        });
        
        mensajesLista.innerHTML = html;
    }
    
    function getIconoTipoMensaje(tipo) {
        switch(tipo) {
            case 'sistema': return 'fas fa-cog';
            case 'alerta': return 'fas fa-exclamation-triangle';
            case 'notificacion': return 'fas fa-info-circle';
            default: return 'fas fa-envelope';
        }
    }
    
    function getColorPrioridad(prioridad) {
        switch(prioridad) {
            case 'urgente': return 'text-red-600';
            case 'alta': return 'text-orange-600';
            case 'normal': return 'text-blue-600';
            case 'baja': return 'text-gray-600';
            default: return 'text-blue-600';
        }
    }
    
    function formatearFechaRelativa(fechaStr) {
        var fecha = new Date(fechaStr);
        var ahora = new Date();
        var diff = Math.floor((ahora - fecha) / 1000);
        
        if (diff < 60) return 'ahora';
        if (diff < 3600) return Math.floor(diff / 60) + 'm';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h';
        if (diff < 2592000) return Math.floor(diff / 86400) + 'd';
        return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
    }
    
    function abrirMensaje(mensajeId) {
        // Marcar como leído al abrir
        fetch('/api/mensajes/' + mensajeId + '/leido', {
            method: 'PATCH',
            credentials: 'include',
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(function(response) {
            if (response.ok) {
                // Actualizar contador
                actualizarContadorMensajes();
                // Recargar mensajes
                cargarMensajes();
            }
        })
        .catch(function(error) {
            console.warn('Error al marcar mensaje como leído:', error);
        });
        
        // Redirigir a la página de mensajes (implementar más tarde)
        // window.location.href = '/admin/mensajes/' + mensajeId;
    }
    
    function marcarTodosComoLeidos() {
        fetch('/api/mensajes/todos/leido', {
            method: 'PATCH',
            credentials: 'include',
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(function(response) {
            if (response.ok) {
                actualizarContadorMensajes();
                cargarMensajes();
            }
        })
        .catch(function(error) {
            console.error('Error al marcar todos como leídos:', error);
        });
    }

    // Función principal de inicialización
    function initializeNavbar() {
        // Configurar fecha actual
        var fechaActual = new Date();
        var opciones = { day: 'numeric', month: 'short', year: 'numeric' };
        var currentDateElement = document.getElementById('current-date');
        if (currentDateElement) {
            currentDateElement.textContent = fechaActual.toLocaleDateString('es-ES', opciones);
        }

        // Configurar menú de perfil
        var perfilBtn = document.getElementById('perfil');
        var perfilMenu = document.getElementById('menu-perfil');
        
        if (perfilBtn && perfilMenu) {
            perfilBtn.addEventListener('click', function(event) {
                event.preventDefault();
                perfilMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', function(event) {
                if (!perfilBtn.contains(event.target) && !perfilMenu.contains(event.target)) {
                    perfilMenu.classList.add('hidden');
                }
            });
        }

        // Actualizar navegación
        updateNavigation();
        
        // Inicializar sistema de mensajes solo si no está ya inicializado
        if (!window.mensajeSystemInitialized) {
            initializeMensajesSystem();
            window.mensajeSystemInitialized = true;
        }
    }

    // Exponer funciones globalmente
    window.addEventListener('popstate', updateNavigation);
    window.updateNavigation = updateNavigation;
    window.generateBreadcrumb = generateBreadcrumb;
    
    window.refreshNavigation = function() {
        updateNavigation();
    };
    
    window.addRoute = function(path, config) {
        routeConfig[path] = config;
    };

    // Inicializar cuando el DOM esté listo
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeNavbar);
    } else {
        setTimeout(initializeNavbar, 10);
    }

})();
</script>
