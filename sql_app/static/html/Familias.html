<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <title>
   Gestión de Familias
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
  <script>
   window.onload = function() {
    fetchData();
};

async function fetchData() {
    const response = await fetch('/Familias/');
    const data = await response.json();
    if (!Array.isArray(data)) {
        console.error("La respuesta no es un array:", data);
        return;
    }
    const tableBody = document.getElementById('data-table-body');
    tableBody.innerHTML = '';
    data.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class='border px-4 py-2'>${item.codigo}</td><td class='border px-4 py-2'>${item.descrip}</td>
            <td class='border px-4 py-2'>
                <button class='bg-blue-500 text-white px-2 py-1' onclick='editItem(${item.codigo})'>Editar</button>
                <button class='bg-red-500 text-white px-2 py-1' onclick='deleteItem(${item.codigo})'>Eliminar</button>
            </td>
        `;
        tableBody.appendChild(row);
    });
}

async function addItem(event) {
    event.preventDefault();
    const formData = {
        codigo: parseInt(document.getElementById('codigo').value), descrip: document.getElementById('descrip').value
    };
    try {
        const respuesta = await fetch('/Familias/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
        if (!respuesta.ok) {
            throw new Error("Error al crear Familias");
        }
        console.log("Registro creado:", await respuesta.json());
        document.getElementById('data-form').reset();
        fetchData();
    } catch (error) {
        console.error(error);
    }
}

function editItem(id) {
    fetch(`/Familias/id/${id}`)
      .then(response => response.json())
      .then(data => {
          document.getElementById('edit-codigo').value = data.codigo;
          document.getElementById('edit-descrip').value = data.descrip;
          document.getElementById('edit-modal').classList.remove('hidden');
      });
}

function closeEditModal() {
    document.getElementById('edit-modal').classList.add('hidden');
}

async function updateItem(event) {
    event.preventDefault();
    const id = document.getElementById('edit-codigo').value;
    const updatedData = {
        descrip: document.getElementById('edit-descrip').value
    };
    await fetch(`/Familias/id/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updatedData)
    });
    closeEditModal();
    fetchData();
}

async function deleteItem(id) {
    await fetch(`/Familias/id/${id}`, { method: 'DELETE' });
    fetchData();
};
  </script>
 </head>
 <body class="bg-gray-100 min-h-screen">
  <nav class="bg-gray-800 p-4 relative z-30">
   <div class="container mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-4">
     <a href="">
      <img alt="Logo" class="h-8 w-auto" src="../static/img/logo_mapache.gif"/>
     </a>
     <a class="text-white text-lg font-semibold hover:text-gray-300" href="/index">
      Inicio
     </a>
     <span class="text-gray-400">
      /
     </span>
     <span class="text-white text-lg font-semibold">
      Familias
     </span>
    </div>
    <div class="flex items-center space-x-4 relative">
     <a class="text-white hover:text-gray-300" href="/docs">
      Documentación
     </a>
     <a class="text-white hover:text-gray-300" href="/generar">
      Generar API
     </a>
     <a class="text-white hover:text-gray-300" href="/migraciones/admin_migraciones">
      Migraciones
     </a>
    </div>
   </div>
  </nav>
  <div class="p-4">
   <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl">
     Gestión de Familias
    </h1>
   </div>
   <form class="mb-4" id="data-form" onsubmit="addItem(event)">
    <div class="flex flex-wrap -mx-2">
     <div class="w-full md:w-1/4 px-2 mb-4">
      <label class="block">
       codigo:
      </label>
      <input class="w-full border px-2 py-1 bg-white-800" id="codigo" required="required" type="number"/>
     </div>
     <div class="w-full md:w-1/4 px-2 mb-4">
      <label class="block">
       descrip:
      </label>
      <input class="w-full border px-2 py-1 bg-white-800" id="descrip" type="text"/>
     </div>
    </div>
    <button class="bg-green-500 text-white px-4 py-2" type="submit">
     Agregar
    </button>
   </form>
   <table class="table-auto w-full border-collapse">
    <thead>
     <tr>
      <th class="border px-4 py-2">
       codigo
      </th>
      <th class="border px-4 py-2">
       descrip
      </th>
      <th class="border px-4 py-2">
       Acciones
      </th>
     </tr>
    </thead>
    <tbody id="data-table-body">
     <div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden" id="edit-modal">
      <div class="bg-gray-800 p-4 rounded w-96">
       <h2 class="text-xl mb-4" color="white">
        Editar Familias
       </h2>
       <form id="edit-form" onsubmit="updateItem(event)">
        <input id="edit-codigo" type="hidden"/>
        <div class="mb-2">
         <label>
          descrip:
         </label>
         <input class="border px-2 py-1 w-full bg-white-800" id="edit-descrip" type="text"/>
        </div>
        <div class="flex justify-end">
         <button class="mr-2 px-4 py-2" onclick="closeEditModal()" type="button">
          Cancelar
         </button>
         <button class="bg-blue-500 text-white px-4 py-2" type="submit">
          Guardar
         </button>
        </div>
       </form>
      </div>
     </div>
    </tbody>
   </table>
  </div>
 </body>
</html>
