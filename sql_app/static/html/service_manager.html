<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Servicios Simplificado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-active {
            color: #198754;
            font-weight: bold;
        }
        .status-inactive {
            color: #dc3545;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container mt-4 mb-5">
        <h1 class="mb-4">Gestor de Servicios</h1>
        
        <div id="message" class="message"></div>
        
        <!-- Panel de control -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Panel de Control</h5>
                <button id="refresh-btn" class="btn btn-primary">
                    <i class="bi bi-arrow-clockwise"></i> Actualizar Lista
                </button>
            </div>
            <div class="card-body">
                <div class="d-flex gap-2">
                    <button id="scan-services-btn" class="btn btn-secondary">
                        Buscar Nuevos Servicios
                    </button>
                    <button id="activate-all-btn" class="btn btn-success">
                        Activar Todos
                    </button>
                    <button id="deactivate-all-btn" class="btn btn-danger">
                        Desactivar Todos
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Lista de servicios -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Servicios Disponibles</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="services-table">
                            <tr>
                                <td colspan="3" class="text-center">Cargando servicios...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Activar servicio específico -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Activar Servicio por ID</h5>
            </div>
            <div class="card-body">
                <form id="activate-form" class="d-flex gap-2">
                    <input type="text" id="service-id" class="form-control" placeholder="Ej: prueba2.route_prueba2" value="prueba2.route_prueba2">
                    <button type="submit" class="btn btn-primary">Activar</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Variables globales
        const servicesTable = document.getElementById('services-table');
        const messageBox = document.getElementById('message');
        
        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            loadServices();
            
            // Configurar eventos
            document.getElementById('refresh-btn').addEventListener('click', loadServices);
            document.getElementById('scan-services-btn').addEventListener('click', scanServices);
            document.getElementById('activate-all-btn').addEventListener('click', activateAllServices);
            document.getElementById('deactivate-all-btn').addEventListener('click', deactivateAllServices);
            document.getElementById('activate-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const serviceId = document.getElementById('service-id').value.trim();
                if (serviceId) {
                    activateService(serviceId);
                }
            });
        });
        
        // Mostrar mensajes
        function showMessage(text, type = 'success') {
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
            messageBox.style.display = 'block';
            
            // Auto-ocultar después de 5 segundos
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 5000);
        }
        
        // Cargar lista de servicios
        async function loadServices() {
            try {
                const response = await fetch('/servicios/listar');
                if (!response.ok) throw new Error('Error al cargar servicios');
                
                const data = await response.json();
                renderServicesTable(data);
            } catch (error) {
                console.error(error);
                showMessage(`Error: ${error.message}`, 'error');
            }
        }
        
        // Renderizar tabla de servicios
        function renderServicesTable(data) {
            // Servicios activos
            const activeServices = data.servicios || [];
            // Todos los servicios disponibles
            const allServices = data.nuevos_servicios || [];
            
            // Crear un mapa de servicios activos para fácil referencia
            const activeServicesMap = {};
            activeServices.forEach(service => {
                activeServicesMap[service.path] = true;
            });
            
            // Limpiar tabla
            servicesTable.innerHTML = '';
            
            // Si no hay servicios
            if (allServices.length === 0) {
                servicesTable.innerHTML = '<tr><td colspan="3" class="text-center">No hay servicios disponibles</td></tr>';
                return;
            }
            
            // Añadir cada servicio a la tabla
            allServices.forEach(serviceId => {
                const isActive = activeServicesMap[`Services.${serviceId}`] || false;
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${serviceId}</td>
                    <td><span class="${isActive ? 'status-active' : 'status-inactive'}">${isActive ? 'Activo' : 'Inactivo'}</span></td>
                    <td>
                        ${isActive ? 
                            `<button class="btn btn-sm btn-danger deactivate-btn" data-id="${serviceId}">Desactivar</button>
                             <a href="/${serviceId.split('.')[0]}/pagina" target="_blank" class="btn btn-sm btn-info ms-1">Ver Página</a>` : 
                            `<button class="btn btn-sm btn-success activate-btn" data-id="${serviceId}">Activar</button>`
                        }
                        <button class="btn btn-sm btn-secondary ms-1 refresh-btn" data-id="${serviceId}">Refrescar</button>
                    </td>
                `;
                
                servicesTable.appendChild(row);
            });
            
            // Añadir eventos a los botones
            document.querySelectorAll('.activate-btn').forEach(btn => {
                btn.addEventListener('click', () => activateService(btn.dataset.id));
            });
            
            document.querySelectorAll('.deactivate-btn').forEach(btn => {
                btn.addEventListener('click', () => deactivateService(btn.dataset.id));
            });
            
            document.querySelectorAll('.refresh-btn').forEach(btn => {
                btn.addEventListener('click', () => refreshService(btn.dataset.id));
            });
        }
        
        // Activar un servicio
        async function activateService(serviceId) {
            try {
                const response = await fetch(`/servicios/${serviceId}/activar`, {
                    method: 'POST'
                });
                
                if (!response.ok) throw new Error('Error al activar servicio');
                
                const data = await response.json();
                showMessage(`Servicio ${serviceId} activado correctamente`);
                
                // Recargar la lista después de un segundo
                setTimeout(loadServices, 1000);
            } catch (error) {
                console.error(error);
                showMessage(`Error al activar servicio: ${error.message}`, 'error');
            }
        }
        
        // Desactivar un servicio
        async function deactivateService(serviceId) {
            try {
                const response = await fetch(`/servicios/${serviceId}/desactivar`, {
                    method: 'POST'
                });
                
                if (!response.ok) throw new Error('Error al desactivar servicio');
                
                const data = await response.json();
                showMessage(`Servicio ${serviceId} desactivado correctamente`);
                
                // Recargar la lista después de un segundo
                setTimeout(loadServices, 1000);
            } catch (error) {
                console.error(error);
                showMessage(`Error al desactivar servicio: ${error.message}`, 'error');
            }
        }
        
        // Refrescar un servicio
        async function refreshService(serviceId) {
            try {
                const response = await fetch(`/servicios/${serviceId}/refrescar`, {
                    method: 'POST'
                });
                
                if (!response.ok) throw new Error('Error al refrescar servicio');
                
                const data = await response.json();
                showMessage(`Servicio ${serviceId} refrescado correctamente`);
                
                // Recargar la lista después de un segundo
                setTimeout(loadServices, 1000);
            } catch (error) {
                console.error(error);
                showMessage(`Error al refrescar servicio: ${error.message}`, 'error');
            }
        }
        
        // Buscar nuevos servicios
        async function scanServices() {
            showMessage('Buscando nuevos servicios...');
            
            try {
                const response = await fetch('/servicios/escanear', {
                    method: 'POST'
                });
                
                if (!response.ok) throw new Error('Error al escanear servicios');
                
                showMessage('Servicios escaneados correctamente');
                loadServices();
            } catch (error) {
                console.error(error);
                showMessage(`Error al escanear servicios: ${error.message}`, 'error');
            }
        }
        
        // Activar todos los servicios
        async function activateAllServices() {
            if (!confirm('¿Está seguro de activar todos los servicios?')) return;
            
            showMessage('Activando todos los servicios...');
            
            try {
                const response = await fetch('/servicios/activar-todos', {
                    method: 'POST'
                });
                
                if (!response.ok) throw new Error('Error al activar todos los servicios');
                
                showMessage('Todos los servicios activados correctamente');
                loadServices();
            } catch (error) {
                console.error(error);
                showMessage(`Error al activar servicios: ${error.message}`, 'error');
            }
        }
        
        // Desactivar todos los servicios
        async function deactivateAllServices() {
            if (!confirm('¿Está seguro de desactivar todos los servicios?')) return;
            
            showMessage('Desactivando todos los servicios...');
            
            try {
                const response = await fetch('/servicios/desactivar-todos', {
                    method: 'POST'
                });
                
                if (!response.ok) throw new Error('Error al desactivar todos los servicios');
                
                showMessage('Todos los servicios desactivados correctamente');
                loadServices();
            } catch (error) {
                console.error(error);
                showMessage(`Error al desactivar servicios: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
