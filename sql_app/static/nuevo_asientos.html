<!DOCTYPE html>
<html>
<head>
    <title>Nuevo Asiento</title>
    <link rel="stylesheet" type="text/css" href="/static/styles.css">
</head>
<body>
    <h1>Nuevo Asiento</h1>
    <form id="form_common" action="/nuevoasiento" method="post">
        <h2>Asiento</h2>
        <label for="fecha">Fecha:</label><br>
        <input type="date" id="fecha" name="fecha"><br>
        <label for="detalle">Detalle:</label><br>
        <input type="text" id="detalle" name="detalle"><br>
        <label for="tipomovimiento">Tipo de Movimiento:</label><br>
        <input type="number" id="tipomovimiento" name="tipomovimiento"><br>

        <h2>Detalle de Asiento</h2>
        <div id="asientoDetalleContainer">
            <div class="asientoDetalle">
                <label for="cuenta">Cuenta:</label><br>
                <input type="text" id="cuenta" name="cuenta[]"><br>
                <label for="signo">Signo:</label><br>
                <input type="text" id="signo" name="signo[]"><br>
                <label for="importe">Importe:</label><br>
                <input type="number" id="importe" name="importe[]"><br>
                <label for="detalle_asiento">Detalle:</label><br>
                <input type="text" id="detalle_asiento" name="detalle_asiento[]"><br>
                <label for="centro_costo">Centro de Costo:</label><br>
                <input type="text" id="centro_costo" name="centro_costo[]"><br>
            </div>
        </div>
        <button type="button" id="addDetalle">Agregar Detalle</button>

        <input type="submit" value="Submit">
    </form>

    <script>
        document.getElementById('addDetalle').addEventListener('click', function() {
            var container = document.getElementById('asientoDetalleContainer');
            var clone = container.firstElementChild.cloneNode(true);
            container.appendChild(clone);
        });
    </script>
</body>
</html>
