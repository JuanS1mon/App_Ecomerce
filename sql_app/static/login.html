    <!-- INTERCEPTOR DE AUTENTICACIÓN PARA NAVEGACIÓN CON TOKEN -->
    <script>
        if (!window.AUTH_INTERCEPTOR_LOADED) {
            console.log('🔐 Cargando interceptor de autenticación...');
            const AUTH_CONFIG = {
                TOKEN_KEY: 'access_token',
                EXCLUDED_PATHS: ['/login', '/logout', '/loginpage', '/registerpage', '/static']
            };
            
            // Función para navegar con autenticación
            window.navigateWithAuth = function(url) {
                const token = localStorage.getItem(AUTH_CONFIG.TOKEN_KEY);
                if (token) {
                    // Agregar token como parámetro temporal para la primera petición
                    const separator = url.includes('?') ? '&' : '?';
                    const urlWithToken = `${url}${separator}temp_token=${encodeURIComponent(token)}`;
                    
                    // Hacer petición con token en header
                    fetch(url, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
                        }
                    }).then(response => {
                        if (response.ok) {
                            // Si la petición es exitosa, navegar normalmente
                            window.location.href = url;
                        } else {
                            console.log('Error en petición autenticada, navegando sin token');
                            window.location.href = url;
                        }
                    }).catch(error => {
                        console.log('Error de red, navegando directamente:', error);
                        window.location.href = url;
                    });
                } else {
                    window.location.href = url;
                }
            };
            
            // Interceptar fetch para agregar token automáticamente
            const originalFetch = window.fetch;
            window.fetch = function(url, options = {}) {
                const token = localStorage.getItem(AUTH_CONFIG.TOKEN_KEY);
                const shouldIncludeToken = token && 
                    !AUTH_CONFIG.EXCLUDED_PATHS.some(path => url.includes(path));
                
                if (shouldIncludeToken) {
                    options.headers = options.headers || {};
                    const hasAuthHeader = Object.keys(options.headers).some(
                        key => key.toLowerCase() === 'authorization'
                    );
                    
                    if (!hasAuthHeader) {
                        options.headers['Authorization'] = `Bearer ${token}`;
                        console.log('🔐 Token agregado a petición:', url);
                    }
                }
                
                return originalFetch.call(this, url, options)
                    .then(response => {
                        if (response.status === 401 && shouldIncludeToken) {
                            console.log('🚨 Token rechazado, redirigiendo a login');
                            localStorage.removeItem(AUTH_CONFIG.TOKEN_KEY);
                            if (!window.location.pathname.includes('login')) {
                                window.location.href = '/loginpage';
                            }
                        }
                        return response;
                    });
            };
            
            window.AUTH_INTERCEPTOR_LOADED = true;
            console.log('✅ Interceptor de autenticación cargado');
        }
    </script>

    <!-- INTERCEPTOR DE AUTENTICACIÓN EMBEBIDO - SOLUCIÓN DEFINITIVA -->
    <script>
        console.log('🔐 Cargando interceptor de autenticación embebido...');
        console.log('🌐 URL actual:', window.location.href);
        console.log('📅 Timestamp:', new Date().toISOString());
        
        // Marcar que el interceptor se cargó
        window.AUTH_INTERCEPTOR_LOADED = true;
        window.AUTH_INTERCEPTOR_VERSION = '3.0.0-embedded';
        console.log('✅ Interceptor de autenticación embebido cargado - Versión:', window.AUTH_INTERCEPTOR_VERSION);
        
        // =================================================================
        // CONFIGURACIÓN Y CONSTANTES - CORREGIDO
        // =================================================================
        const AUTH_CONFIG = {            TOKEN_KEY: 'access_token',
            LOGIN_ENDPOINT: '/auth/login',
            LOGOUT_ENDPOINT: '/logout',
            LOGIN_PAGE: '/loginpage',
            DEBUG_ENDPOINT: '/admin-debug',
            EXCLUDED_PATHS: ['/auth/login', '/logout', '/loginpage', '/registerpage', '/static', '/usuarios/current']
        };
        
        console.log('✅ AUTH_CONFIG configurado correctamente:', AUTH_CONFIG);
        
        // =================================================================
        // INTERCEPTOR DE FETCH EMBEBIDO
        // =================================================================
        (function setupEmbeddedFetchInterceptor() {
            // Guardar referencia al fetch original
            const originalFetch = window.fetch;
            
            // Sobrescribir fetch global
            window.fetch = function(url, options = {}) {
                // Obtener token de localStorage
                const token = localStorage.getItem(AUTH_CONFIG.TOKEN_KEY);
                
                // Verificar si debe incluir token
                const shouldIncludeToken = token && 
                    !AUTH_CONFIG.EXCLUDED_PATHS.some(path => url.includes(path)) &&
                    url !== AUTH_CONFIG.DEBUG_ENDPOINT;
                
                if (shouldIncludeToken) {
                    // Asegurar que existe el objeto headers
                    options.headers = options.headers || {};
                    
                    // Solo agregar si no hay Authorization header ya presente
                    const hasAuthHeader = Object.keys(options.headers).some(
                        key => key.toLowerCase() === 'authorization'
                    );
                    
                    if (!hasAuthHeader) {
                        options.headers['Authorization'] = `Bearer ${token}`;
                        console.log('🔐✅ Token agregado automáticamente (embebido) a:', url);
                        console.log('🎫 Token (primeros 20 chars):', token.substring(0, 20) + '...');
                    } else {
                        console.log('🔐⚠️ Header Authorization ya presente en:', url);
                    }
                } else if (token) {
                    console.log('🔐⏭️ Token disponible pero excluido para:', url);
                } else {
                    console.log('🔐❌ No hay token disponible para:', url);
                }
                
                // Llamar al fetch original
                return originalFetch.call(this, url, options)
                    .then(response => {
                        // Manejar respuestas 401 (no autorizado)
                        if (response.status === 401 && shouldIncludeToken) {
                            console.log('🚨 Token rechazado por el servidor, limpiando localStorage');
                            localStorage.removeItem(AUTH_CONFIG.TOKEN_KEY);
                            
                            // Solo redirigir si no estamos ya en login
                            if (!window.location.pathname.includes('login')) {
                                window.location.href = AUTH_CONFIG.LOGIN_PAGE;
                            }
                        }
                        
                        return response;
                    })
                    .catch(error => {
                        console.error('❌ Error en petición interceptada (embebido):', error);
                        throw error;
                    });
            };
            
            console.log('✅ Interceptor de fetch embebido configurado');
        })();
        
        // =================================================================
        // NAVEGACIÓN CON AUTENTICACIÓN EMBEBIDA
        // =================================================================
        window.navigateWithAuth = function(url) {
            console.log('🚀 navigateWithAuth embebido llamado para:', url);
            const token = localStorage.getItem(AUTH_CONFIG.TOKEN_KEY);
            console.log('🎫 Token disponible:', !!token);
            
            if (!token) {
                console.log('🚪 Navegando sin token a:', url);
                window.location.href = url;
                return;
            }
            
            console.log('🔐 Navegando con verificación de token a:', url);
            console.log('🎫 Token (primeros 20 chars):', token.substring(0, 20) + '...');
            
            // Hacer petición de verificación antes de navegar
            fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
                }
            })
            .then(response => {
                if (response.ok) {
                    console.log('✅ Token válido, navegando a:', url);
                    window.location.href = url;
                } else if (response.status === 401) {
                    console.log('🚨 Token inválido, redirigiendo a login');
                    localStorage.removeItem(AUTH_CONFIG.TOKEN_KEY);
                    window.location.href = AUTH_CONFIG.LOGIN_PAGE;
                } else {
                    console.log(`⚠️ Error ${response.status}, navegando normalmente`);
                    window.location.href = url;
                }
            })
            .catch(error => {
                console.error('❌ Error en verificación de navegación:', error);
                window.location.href = url;
            });
        };
        
        console.log('✅ Interceptor de autenticación embebido completamente cargado');
        console.log('🔧 Para debug, verifica window.AUTH_INTERCEPTOR_LOADED');
    </script>
    
    <script>
        // Evitar ejecución múltiple del script
        if (window.loginScriptLoaded) {
            console.log('Script de login ya cargado, evitando duplicación');
        } else {
            window.loginScriptLoaded = true;
            
            document.addEventListener('DOMContentLoaded', function() {
                // Cargar navbar
                loadNavbar();
                
                // Limpiar flags de redirección al cargar la página de login
                if (window.location.pathname.includes('login')) {
                    // Limpiar solo si no venimos de una redirección reciente
                    const loginRedirectAttempted = sessionStorage.getItem('login_redirect_attempted');
                    if (!loginRedirectAttempted) {
                        sessionStorage.removeItem('just_logged_in');
                        console.log('Limpiando flags de sesión al cargar página de login');
                    }
                }
                
                // Verificar si el usuario ya está autenticado
                checkIfAlreadyAuthenticated();
                
                // Limpiar flags si el usuario navega manualmente a login
                window.addEventListener('pageshow', function(event) {
                    if (event.persisted) {
                        // Página cargada desde caché
                        console.log('Página cargada desde caché, limpiando flags');
                        sessionStorage.removeItem('login_redirect_attempted');
                        window.isCheckingAuth = false;
                        window.lastAuthCheck = 0;
                    }
                });
                
                // Toggle password visibility
                const togglePassword = document.getElementById('toggle-password');
                const passwordInput = document.getElementById('password');
                
                if (togglePassword && passwordInput) {
                    togglePassword.addEventListener('click', function() {
                        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                        passwordInput.setAttribute('type', type);
                        
                        // Toggle icon
                        const iconClass = type === 'password' ? 'fa-eye' : 'fa-eye-slash';
                        this.querySelector('i').className = `fas ${iconClass}`;
                    });
                }
                
                // Función para verificar autenticación existente
                async function checkIfAlreadyAuthenticated() {
                    // EVITAR BUCLE: Verificar si ya estamos procesando una verificación
                    if (window.isCheckingAuth) {
                        console.log('Ya hay una verificación de autenticación en curso, saltando...');
                        return;
                    }
                    
                    // EVITAR BUCLE: Throttling - no verificar más de una vez cada 5 segundos
                    const lastCheck = window.lastAuthCheck || 0;
                    const now = Date.now();
                    if (now - lastCheck < 5000) {
                        console.log('Verificación de autenticación muy reciente, saltando...');
                        return;
                    }
                    window.lastAuthCheck = now;
                    
                    // EVITAR BUCLE: Solo verificar autenticación si estamos en una página de login
                    const currentPath = window.location.pathname;
                    if (!currentPath.includes('login') && !currentPath.includes('register')) {
                        console.log('No estamos en página de login, saltando verificación de autenticación');
                        return;
                    }
                    
                    // EVITAR BUCLE: No verificar si acabamos de hacer login
                    if (sessionStorage.getItem('just_logged_in') === 'true') {
                        console.log('Acabamos de hacer login, saltando verificación para evitar bucle');
                        sessionStorage.removeItem('just_logged_in');
                        return;
                    }
                    
                    // EVITAR BUCLE: Verificar si ya hemos redirigido en esta sesión
                    if (sessionStorage.getItem('login_redirect_attempted') === 'true') {
                        console.log('Ya se intentó redirigir en esta sesión, evitando bucle');
                        return;
                    }
                    
                    // Marcar que estamos verificando autenticación
                    window.isCheckingAuth = true;
                    
                    try {
                        console.log('🔍 Verificando autenticación existente para página de login...');
                        
                        // Obtener token directamente para evitar bucle con interceptor
                        const token = localStorage.getItem(AUTH_CONFIG.TOKEN_KEY);
                        
                        if (!token) {
                            console.log('❌ No hay token guardado, mostrando formulario de login');
                            window.isCheckingAuth = false;
                            return;
                        }
                        
                        // Hacer petición manual con token para verificar validez
                        const response = await fetch('/usuarios/current', {
                            method: 'GET',
                            credentials: 'include',
                            headers: {
                                'Cache-Control': 'no-cache',
                                'Authorization': `Bearer ${token}`
                            }
                        });
                        
                        if (response.ok) {
                            const userData = await response.json();
                            console.log('✅ Estado de autenticación:', userData);
                            
                            if (userData.autenticado) {
                                console.log('✅ Usuario ya autenticado, redirigiendo desde página de login...');
                                
                                // Marcar que ya intentamos redirigir
                                sessionStorage.setItem('login_redirect_attempted', 'true');
                                
                                showNotification('Ya tienes una sesión activa. Redirigiendo...', 'success');
                                
                                // Redirigir después de un breve retraso
                                setTimeout(() => {
                                    const urlParams = new URLSearchParams(window.location.search);
                                    const redirectUrl = urlParams.get('redirect') || '/admin';
                                    console.log('Redirigiendo usuario autenticado a:', redirectUrl);
                                    
                                    // Verificar si el interceptor está disponible
                                    if (typeof window.navigateWithAuth === 'function') {
                                        console.log('Usando navigateWithAuth del interceptor para usuario autenticado');
                                        // Limpiar la marca de redirección antes de redirigir
                                        sessionStorage.removeItem('login_redirect_attempted');
                                        window.navigateWithAuth(redirectUrl);
                                    } else {
                                        console.log('Interceptor no disponible, navegando con token manual para usuario autenticado');
                                        // Fallback: verificar token antes de navegar
                                        const token = localStorage.getItem('access_token');
                                        if (token) {
                                            fetch(redirectUrl, {
                                                method: 'GET',
                                                headers: {
                                                    'Authorization': `Bearer ${token}`,
                                                    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
                                                }
                                            })
                                            .then(response => {
                                                console.log('Respuesta de verificación para usuario autenticado:', response.status);
                                                sessionStorage.removeItem('login_redirect_attempted');
                                                window.location.href = redirectUrl;
                                            })
                                            .catch(error => {
                                                console.log('Error en verificación, navegando directamente:', error);
                                                sessionStorage.removeItem('login_redirect_attempted');
                                                window.location.href = redirectUrl;
                                            });
                                        } else {
                                            // Sin token, navegar directamente
                                            sessionStorage.removeItem('login_redirect_attempted');
                                            window.location.href = redirectUrl;
                                        }
                                    }
                                }, 1000);
                            }
                        } else {
                            console.log('❌ Token inválido o sesión expirada');
                            localStorage.removeItem(AUTH_CONFIG.TOKEN_KEY);
                            showNotification('Sesión expirada. Por favor, inicia sesión nuevamente.', 'warning');
                        }
                    } catch (error) {
                        console.log('❌ Error verificando autenticación o token inválido:', error);
                        // Si hay error, limpiar token por si acaso está corrupto
                        if (localStorage.getItem(AUTH_CONFIG.TOKEN_KEY)) {
                            console.log('Limpiando token potencialmente corrupto');
                            localStorage.removeItem(AUTH_CONFIG.TOKEN_KEY);
                        }
                        console.log('Mostrando formulario de login');
                    } finally {
                        // Limpiar la marca de verificación en curso
                        window.isCheckingAuth = false;
                    }
                }                // Form submission - NUEVO: Backend puro con redirección automática
                document.getElementById('form_common').addEventListener('submit', function(event) {
                    console.log('🚀 NUEVO SISTEMA: Formulario tradicional con redirección backend');
                    
                    // Extraer parámetro 'next' de la URL y establecerlo en el formulario
                    const urlParams = new URLSearchParams(window.location.search);
                    const nextParam = urlParams.get('next') || urlParams.get('redirect') || '/admin';
                    
                    document.getElementById('next').value = nextParam;
                    console.log('� Parámetro next establecido:', nextParam);
                    
                    const submitButton = document.getElementById('submit_button');
                    const originalText = submitButton.innerHTML;
                    
                    // Show loading state
                    submitButton.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Verificando...';
                    submitButton.disabled = true;
                    
                    console.log('📤 Enviando formulario tradicionalmente...');
                    console.log('🎯 Action:', this.action);
                    console.log('📋 Method:', this.method);
                    console.log('📊 Datos:', {
                        username: this.username.value,
                        password: this.password.value ? '***' : 'vacío',
                        next: this.next.value
                    });
                    
                    // Permitir que el formulario se envíe tradicionalmente
                    // El backend manejará la redirección automáticamente
                    // NO llamamos event.preventDefault() aquí
                    
                    // El formulario se enviará normalmente y el backend:
                    // 1. Validará las credenciales
                    // 2. Establecerá la cookie con el token
                    // 3. Redirigirá automáticamente a la URL especificada en 'next'
                });
                
                // Notification function con estilo mejorado como el panel de admin
                function showNotification(message, type) {
                    // Remove existing notifications
                    const existingNotifications = document.querySelectorAll('.notification');
                    existingNotifications.forEach(notification => notification.remove());
                    
                    // Create notification element
                    const notification = document.createElement('div');
                    notification.className = `notification fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 transition-all duration-500 transform translate-x-full flex items-center`;
                    
                    if (type === 'success') {
                        notification.classList.add('bg-green-100', 'text-green-800', 'border-l-4', 'border-green-500');
                        notification.innerHTML = `
                            <div class="flex-shrink-0 bg-green-500 rounded-full p-2 mr-3">
                                <i class="fas fa-check text-white"></i>
                            </div>
                            <div>
                                <p class="font-medium">¡Éxito!</p>
                                <p class="text-sm">${message}</p>
                            </div>
                        `;
                    } else {
                        notification.classList.add('bg-red-100', 'text-red-800', 'border-l-4', 'border-red-500');
                        notification.innerHTML = `
                            <div class="flex-shrink-0 bg-red-500 rounded-full p-2 mr-3">
                                <i class="fas fa-exclamation-triangle text-white"></i>
                            </div>
                            <div>
                                <p class="font-medium">Error</p>
                                <p class="text-sm">${message}</p>
                            </div>
                        `;
                    }
                    
                    // Add to DOM
                    document.body.appendChild(notification);
                    
                    // Animate in
                    setTimeout(() => {
                        notification.classList.remove('translate-x-full');
                        notification.classList.add('translate-x-0');
                    }, 10);
                    
                    // Auto remove after delay
                    setTimeout(() => {
                        notification.classList.remove('translate-x-0');
                        notification.classList.add('translate-x-full');
                        
                        setTimeout(() => {
                            notification.remove();
                        }, 500);
                    }, 5000);
                }
                
            });  // End of DOMContentLoaded
        }  // End of loginScriptLoaded check
    </script>

    <!-- BLOQUE: Captura de token tras login por redirección -->
    <script>
    // Captura el token de la URL tras login y lo guarda en localStorage
    (function() {
        // Solo ejecutar si hay query param 'token'
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            // Guardar el token en localStorage
            localStorage.setItem('access_token', token);
            console.log('🔐 Token JWT guardado en localStorage tras login:', token.substring(0, 20) + '...');
            // Limpiar el token de la URL para mayor seguridad
            urlParams.delete('token');
            const cleanUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '');
            window.history.replaceState({}, document.title, cleanUrl);
        }
    })();
    // Documentación:
    // - Tras login exitoso, el backend redirige a /admin?token=...
    // - Este script guarda el token y limpia la URL
    // - El resto del frontend usará el token desde localStorage para autenticación
    </script>
