<!DOCTYPE html>
<html>
<head>
    <title>Iniciar sesión</title>
    <link rel="stylesheet" type="text/css" href="/static/styles.css">
</head>
<body>
    <h1>Iniciar sesión</h1>
    <form id="form_common" action="http://localhost:8000/usuarios/login" method="post">
        <label for="username">Nombre de usuario:</label><br>
        <input type="text" id="username" name="username"><br>
        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" name="password"><br>
        <input type="submit" value="Iniciar sesión">
    </form>

    <script>
    document.getElementById('form_common').addEventListener('submit', function(event) {
        event.preventDefault();

        fetch('/usuarios/login', {
            method: 'POST',
            body: new FormData(event.target) // Envía los datos del formulario
        })
        .then(response => response.json())
        .then(data => {
            if (data.access_token) {
                localStorage.setItem('token', data.access_token); // Almacena el token en el almacenamiento local
                window.location.href = '/index'; // Redirige al usuario a '/index'
            } else {
                // Manejar el error de autenticación
            }
        });
    });
    </script>
</body>
</html>
