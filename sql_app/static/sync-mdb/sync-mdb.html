<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Conexión MDB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .card-header {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .log-container {
            background-color: #f8f9fa;
            border-radius: 5px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }
        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .log-success {
            color: #198754;
        }
        .log-error {
            color: #dc3545;
        }
        .log-info {
            color: #0d6efd;
        }
        .log-warning {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4">Prueba de Conexión MDB</h1>
        
        <div class="card">
            <div class="card-header">Configuración de conexión MDB</div>
            <div class="card-body">
                <form id="mdbForm">
                    <div class="mb-3">
                        <label for="mdbPath" class="form-label">Ruta del archivo MDB</label>
                        <input type="text" class="form-control" id="mdbPath" value="C:\APV\tecnolar.mdb" required>
                    </div>
                    <div class="mb-3">
                        <label for="ipAddress" class="form-label">Dirección IP (opcional)</label>
                        <input type="text" class="form-control" id="ipAddress" placeholder="Ej: 192.168.1.100">
                    </div>
                    <div class="mb-3">
                        <label for="port" class="form-label">Puerto (opcional)</label>
                        <input type="number" class="form-control" id="port" value="9933">
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="button" id="testConnectionBtn" class="btn btn-primary">
                            Probar Conexión
                        </button>
                        <button type="button" id="sendGenericArticleBtn" class="btn btn-success">
                            Enviar Artículo Genérico
                        </button>
                        <button type="button" id="syncArticulosBtn" class="btn btn-warning">
                            Sincronizar Artículos
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">Registro de Operaciones</div>
            <div class="card-body">
                <div id="logContainer" class="log-container">
                    <div class="log-entry log-info">Esperando operaciones...</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">Resultados</div>
            <div class="card-body">
                <pre id="resultContainer" class="p-3 bg-light rounded">Sin resultados aún</pre>
            </div>
        </div>
    </div>

    <script>
        // Función para añadir mensajes al log
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        // Función para mostrar resultados
        function showResults(data) {
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.textContent = JSON.stringify(data, null, 2);
        }
        
        // Función para obtener los parámetros del formulario
        function getParams() {
            const mdbPath = document.getElementById('mdbPath').value;
            const ipAddress = document.getElementById('ipAddress').value;
            const port = document.getElementById('port').value;
            
            let params = `mdb_path=${encodeURIComponent(mdbPath)}`;
            if (ipAddress) params += `&ip_address=${encodeURIComponent(ipAddress)}`;
            if (port) params += `&port=${encodeURIComponent(port)}`;
            
            return params;
        }
        
        // Evento para probar la conexión
        document.getElementById('testConnectionBtn').addEventListener('click', async () => {
            addLog('Probando conexión MDB...', 'info');
            
            try {
                const params = getParams();
                const response = await fetch(`/articulos/test-mdb?${params}`);
                const data = await response.json();
                
                if (data.success) {
                    addLog(`Conexión exitosa. Se encontraron ${data.tables_count} tablas.`, 'success');
                } else {
                    addLog(`Error en la conexión: ${data.errors.join(', ')}`, 'error');
                }
                
                showResults(data);
            } catch (error) {
                addLog(`Error al realizar la petición: ${error.message}`, 'error');
            }
        });
        
        // Evento para enviar artículo genérico
        document.getElementById('sendGenericArticleBtn').addEventListener('click', async () => {
            addLog('Enviando artículo genérico de prueba...', 'info');
            
            try {
                const params = getParams();
                const response = await fetch(`/articulos/test-generic-article?${params}`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    addLog(`Artículo genérico enviado correctamente a tabla: ${data.table_used}`, 'success');
                } else {
                    addLog(`Error al enviar artículo genérico: ${data.errors.join(', ')}`, 'error');
                }
                
                showResults(data);
            } catch (error) {
                addLog(`Error al realizar la petición: ${error.message}`, 'error');
            }
        });
        
        // Evento para sincronizar artículos
        document.getElementById('syncArticulosBtn').addEventListener('click', async () => {
            addLog('Sincronizando artículos con MDB...', 'info');
            
            try {
                const params = getParams();
                const response = await fetch(`/articulos/sync-mdb?${params}`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    addLog(`Sincronización exitosa. ${data.records_processed} registros procesados.`, 'success');
                } else if (data.error) {
                    addLog(`Error en la sincronización: ${data.error}`, 'error');
                } else if (data.test_result) {
                    addLog(`Prueba de conexión fallida: ${data.test_result.errors.join(', ')}`, 'error');
                }
                
                showResults(data);
            } catch (error) {
                addLog(`Error al realizar la petición: ${error.message}`, 'error');
            }
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
