<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Perfil de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
            <h1 class="text-2xl font-bold mb-6 text-center">Test de Perfil de Usuario</h1>
            
            <div class="space-y-4">
                <div class="bg-blue-50 p-4 rounded-lg">
                    <h2 class="font-semibold text-blue-800 mb-2">Instrucciones:</h2>
                    <ol class="text-sm text-blue-700 list-decimal list-inside space-y-1">
                        <li>Haz clic en "Ir a Login" para autenticarte</li>
                        <li>Usuario: <code class="bg-blue-100 px-2 py-1 rounded">juan</code></li>
                        <li>Contraseña: <code class="bg-blue-100 px-2 py-1 rounded">123456</code></li>
                        <li>Después del login, haz clic en "Test Perfil"</li>
                    </ol>
                </div>
                
                <div class="flex flex-col space-y-3">
                    <a href="/loginpage" 
                       class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded text-center transition-colors">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Ir a Login
                    </a>
                    
                    <button onclick="testPerfilWithToken()" 
                            class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition-colors">
                        <i class="fas fa-user-circle mr-2"></i>
                        Test Perfil (con token automático)
                    </button>
                    
                    <a href="/admin/perfil" 
                       class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded text-center transition-colors">
                        <i class="fas fa-external-link-alt mr-2"></i>
                        Perfil Directo (sin token)
                    </a>
                </div>
                
                <div id="status" class="mt-4 p-3 rounded-lg hidden">
                    <!-- Status messages will appear here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Incluir el script de manejo automático de tokens -->
    <script src="/static/js/auth_links.js"></script>
    
    <script>
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.className = `mt-4 p-3 rounded-lg ${type === 'error' ? 'bg-red-100 text-red-700 border border-red-300' : 'bg-blue-100 text-blue-700 border border-blue-300'}`;
            statusEl.textContent = message;
            statusEl.classList.remove('hidden');
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                statusEl.classList.add('hidden');
            }, 5000);
        }
        
        async function testPerfilWithToken() {
            try {
                showStatus('🔍 Buscando token de autenticación...', 'info');
                
                // Usar el sistema de auth_links para obtener el token
                const token = window.AuthLinks?.getCurrentToken();
                
                if (!token) {
                    showStatus('❌ No se encontró token. Por favor, haz login primero.', 'error');
                    return;
                }
                
                showStatus('✅ Token encontrado. Redirigiendo a perfil...', 'info');
                
                // Agregar token a la URL y navegar
                const perfilUrl = `/admin/perfil?token=${token}`;
                window.location.href = perfilUrl;
                
            } catch (error) {
                console.error('Error:', error);
                showStatus('❌ Error al procesar token: ' + error.message, 'error');
            }
        }
        
        // Verificar si hay token al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            const token = window.AuthLinks?.getCurrentToken();
            if (token) {
                showStatus('✅ Token de autenticación detectado. Listo para probar.', 'info');
            } else {
                showStatus('⚠️ No hay token activo. Por favor, haz login primero.', 'info');
            }
        });
    </script>
</body>
</html>
