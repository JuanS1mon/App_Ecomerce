version: '3.8'

services:
  # Aplicación principal
  app:
    build: .
    container_name: sql_app_production
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - WORKERS=4
      - LOG_LEVEL=info
    env_file:
      - .env
    volumes:
      # Solo logs y uploads, no código fuente
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - app_network
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Base de datos SQL Server (opcional, si usas Docker)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server_production
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_DB=${DB_NAME}
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
    networks:
      - app_network

  # Reverse proxy Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./static:/var/www/static:ro
    networks:
      - app_network
    depends_on:
      - app

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
