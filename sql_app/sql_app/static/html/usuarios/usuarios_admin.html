<!--usuarios_admin.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <!-- Sistema de componentes y navegación -->
    <script src="/static/js/components.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navbar - Se cargará dinámicamente -->
    <div id="navbar-container"></div>

    <!-- Contenido principal -->
    <main class="px-4 sm:px-6 lg:px-8 py-6 max-w-7xl mx-auto">        
        <!-- Contenido específico de la página -->
        <div class="w-full">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <h1 class="text-2xl font-bold text-gray-800">Gestión de Usuarios</h1>
                <button id="btnNuevoUsuario" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition-colors duration-300 w-full sm:w-auto">
                    <i class="fas fa-user-plus mr-2"></i>Nuevo Usuario
                </button>
            </div>

            <!-- Menú de navegación secundaria para gestión de usuarios/roles -->
            <div class="mb-6">
                <div class="bg-white rounded-lg shadow-md p-3">
                    <nav class="flex flex-wrap gap-2">
                        <a href="/usuarios_admin/" class="bg-blue-500 text-white px-4 py-2 rounded-md flex items-center text-sm font-medium">
                            <i class="fas fa-users mr-2"></i>
                            Usuarios
                        </a>
                        <a href="/usuarios_admin/roles" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-md flex items-center text-sm font-medium transition-colors duration-150">
                            <i class="fas fa-user-tag mr-2"></i>
                            Roles
                        </a>
                        <a href="/usuarios_admin/usuarios-roles" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-md flex items-center text-sm font-medium transition-colors duration-150">
                            <i class="fas fa-user-shield mr-2"></i>
                            Asignación de Roles
                        </a>
                        <a href="/usuarios_admin/permisos" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-md flex items-center text-sm font-medium transition-colors duration-150">
                            <i class="fas fa-lock mr-2"></i>
                            Permisos
                        </a>
                    </nav>
                </div>
            </div>
    
            <!-- Filtros y búsqueda -->
            <div class="bg-white p-4 rounded-lg shadow-md mb-6">
                <div class="flex flex-col lg:flex-row gap-4">
                    <div class="flex-grow">
                        <div class="relative">
                            <input type="text" id="searchUsuarios" placeholder="Buscar usuarios..." 
                                class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
                            <div class="absolute left-3 top-2.5 text-gray-400">
                                <i class="fas fa-search"></i>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <select id="filterRol" class="border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300">
                            <option value="">Todos los roles</option>
                            <option value="admin">Administrador</option>
                            <option value="editor">Editor</option>
                            <option value="usuario">Usuario estándar</option>
                        </select>
                        <select id="filterEstado" class="border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300">
                            <option value="">Todos los estados</option>
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                        <button id="btnAplicarFiltros" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors duration-300 w-full sm:w-auto">
                            Aplicar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabla de usuarios -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Usuario</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rol</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Último Acceso</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usuariosTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Aquí se cargarán los usuarios dinámicamente -->
                            <tr class="animate-pulse">
                                <td colspan="7" class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-center text-gray-400">Cargando usuarios...</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Paginación -->
                <div class="bg-gray-50 px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
                    <div class="flex-1 flex justify-between sm:hidden">
                        <button id="btnAnteriorMobile" class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            Anterior
                        </button>
                        <button id="btnSiguienteMobile" class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            Siguiente
                        </button>
                    </div>
                    <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                        <div>
                            <p class="text-sm text-gray-700">
                                Mostrando <span id="startRange" class="font-medium">1</span> a <span id="endRange" class="font-medium">10</span> de 
                                <span id="totalUsuarios" class="font-medium">--</span> usuarios
                            </p>
                        </div>
                        <div>
                            <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Paginación">
                                <button id="btnAnterior" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                    <span class="sr-only">Anterior</span>
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <div id="paginationNumbers" class="relative inline-flex items-center">
                                    <!-- Números de página aquí -->
                                </div>
                                <button id="btnSiguiente" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                    <span class="sr-only">Siguiente</span>
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- El resto del contenido permanece igual (modales, etc.) -->
        <!-- Modal para Nuevo/Editar Usuario -->
        <div id="modalUsuario" class="fixed inset-0 z-50 hidden overflow-y-auto">
            <div class="flex items-center justify-center min-h-screen">
                <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6">
                    <h2 id="modalTitulo" class="text-xl font-bold mb-4">Nuevo Usuario</h2>
                    <form id="formUsuario">
                        <div class="mb-4">
                            <label for="usuario" class="block text-sm font-medium text-gray-700">Usuario</label>
                            <input type="text" id="usuario" name="usuario" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="mb-4">
                            <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
                            <input type="text" id="nombre" name="nombre" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="mb-4">
                            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" id="email" name="email" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
                            <input type="password" id="password" name="password" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="flex justify-end">
                            <button type="button" id="btnCancelar" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md mr-2">Cancelar</button>
                            <button type="submit" id="btnGuardar" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal para Cambiar Contraseña -->
        <div id="modalCambiarPassword" class="fixed inset-0 z-50 hidden overflow-y-auto">
            <div class="flex items-center justify-center min-h-screen">
                <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6">
                    <h2 class="text-xl font-bold mb-4">Cambiar Contraseña</h2>
                    <form id="formCambiarPassword">
                        <div class="mb-4">
                            <label for="nuevaPassword" class="block text-sm font-medium text-gray-700">Nueva Contraseña</label>
                            <input type="password" id="nuevaPassword" name="nuevaPassword" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="flex justify-end">
                            <button type="button" id="btnCancelarPassword" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md mr-2">Cancelar</button>
                            <button type="submit" id="btnGuardarPassword" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal para Asignar Roles -->
        <div id="modalAsignarRoles" class="fixed inset-0 z-50 hidden overflow-y-auto">
            <div class="flex items-center justify-center min-h-screen">
                <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6">
                    <h2 class="text-xl font-bold mb-4">Asignar Roles</h2>
                    <form id="formAsignarRoles">
                        <div class="mb-4">
                            <label for="roles" class="block text-sm font-medium text-gray-700">Roles (separados por comas)</label>
                            <input type="text" id="roles" name="roles" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="flex justify-end">
                            <button type="button" id="btnCancelarRoles" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md mr-2">Cancelar</button>
                            <button type="submit" id="btnGuardarRoles" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const modal = document.getElementById('modalUsuario');
                const form = document.getElementById('formUsuario');
                const btnNuevoUsuario = document.getElementById('btnNuevoUsuario');
                const btnCancelar = document.getElementById('btnCancelar');

                btnNuevoUsuario.addEventListener('click', () => {
                    modal.classList.remove('hidden');
                });

                btnCancelar.addEventListener('click', () => {
                    modal.classList.add('hidden');
                });

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const data = {
                        usuario: form.usuario.value,
                        nombre: form.nombre.value,
                        email: form.email.value,
                        password: form.password.value
                    };

                    try {
                        const response = await fetch('/usuarios_admin/usuarios/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(data)
                        });

                        if (response.ok) {
                            alert('Usuario creado exitosamente');
                            modal.classList.add('hidden');
                            location.reload();
                        } else {
                            const error = await response.json();
                            alert(`Error: ${error.detail}`);
                        }
                    } catch (err) {
                        console.error('Error al crear usuario:', err);
                        alert('Error al crear usuario');
                    }
                });

                // Cambiar Contraseña
                const modalPassword = document.getElementById('modalCambiarPassword');
                const formPassword = document.getElementById('formCambiarPassword');
                const btnCancelarPassword = document.getElementById('btnCancelarPassword');

                btnCancelarPassword.addEventListener('click', () => {
                    modalPassword.classList.add('hidden');
                });

                formPassword.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const userId = formPassword.dataset.userId;
                    const data = {
                        nueva_password: formPassword.nuevaPassword.value
                    };

                    try {
                        const response = await fetch(`/usuarios_admin/usuarios/${userId}/password`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(data)
                        });

                        if (response.ok) {
                            alert('Contraseña actualizada exitosamente');
                            modalPassword.classList.add('hidden');
                        } else {
                            const error = await response.json();
                            alert(`Error: ${error.detail}`);
                        }
                    } catch (err) {
                        console.error('Error al cambiar contraseña:', err);
                        alert('Error al cambiar contraseña');
                    }
                });

                // Asignar Roles
                const modalRoles = document.getElementById('modalAsignarRoles');
                const formRoles = document.getElementById('formAsignarRoles');
                const btnCancelarRoles = document.getElementById('btnCancelarRoles');

                btnCancelarRoles.addEventListener('click', () => {
                    modalRoles.classList.add('hidden');
                });

                formRoles.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const userId = formRoles.dataset.userId;
                    const data = {
                        roles: formRoles.roles.value.split(',').map(role => role.trim())
                    };

                    try {
                        const response = await fetch(`/usuarios_admin/usuarios/${userId}/roles`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(data)
                        });

                        if (response.ok) {
                            alert('Roles asignados exitosamente');
                            modalRoles.classList.add('hidden');
                        } else {
                            const error = await response.json();
                            alert(`Error: ${error.detail}`);
                        }
                    } catch (err) {
                        console.error('Error al asignar roles:', err);
                        alert('Error al asignar roles');
                    }
                });
            });
        </script>

        <!-- Modal de confirmación para eliminar -->
        <div id="modalConfirmarEliminar" class="fixed inset-0 z-50 hidden overflow-y-auto">
            <!-- Contenido del modal sin cambios -->
        </div>

        <!-- Notificación de éxito -->
        <div id="notificacionExito" class="fixed right-4 top-4 bg-green-500 text-white px-6 py-3 rounded-md shadow-lg transform transition-all duration-500 translate-x-full opacity-0 flex items-center">
            <i class="fas fa-check-circle mr-2"></i>
            <span id="mensajeExito">Operación completada con éxito</span>
        </div>

        <!-- Notificación de error -->
        <div id="notificacionError" class="fixed right-4 top-4 bg-red-500 text-white px-6 py-3 rounded-md shadow-lg transform transition-all duration-500 translate-x-full opacity-0 flex items-center">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span id="mensajeError">Ha ocurrido un error</span>
        </div>
    </main>
    <!-- Script separado para la lógica -->
    <script src="/static/html/usuarios/js/usuarios_admin.js"></script>
</body>
    <!-- Footer - Se cargará dinámicamente -->
    <div id="footer-container"></div>
</html>
