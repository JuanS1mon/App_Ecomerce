<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f6f6f6; }
        .container { max-width: 400px; margin: 60px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 2em; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 1em; color: #444; }
        input[type="password"] { width: 100%; padding: 0.7em; margin-top: 0.3em; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; margin-top: 1.5em; padding: 0.8em; background: #0078d7; color: #fff; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
        button:disabled { background: #aaa; }
        .msg { margin-top: 1em; text-align: center; }
        .error { color: #c00; }
        .success { color: #080; }
    </style>
</head>
<body>
<div class="container">
    <h2>Restablecer contraseña</h2>
    <form id="resetForm">
        <input type="hidden" name="token" id="tokenInput">
        <label for="passwordInput">Nueva contraseña</label>
        <input type="password" name="new_password" id="passwordInput" minlength="6" required autocomplete="new-password">
        <button type="submit">Restablecer</button>
        <div class="msg" id="msg"></div>
    </form>
</div>
<script>
// Obtener token de la URL o sessionStorage
const urlParams = new URLSearchParams(window.location.search);
let token = urlParams.get('token');
if (token) {
    sessionStorage.setItem('reset_token', token);
} else {
    token = sessionStorage.getItem('reset_token') || '';
}
document.getElementById('tokenInput').value = token;

const form = document.getElementById('resetForm');
const msg = document.getElementById('msg');
form.addEventListener('submit', async function(e) {
    e.preventDefault();
    msg.textContent = '';
    // Siempre tomar el token del campo oculto (que ya fue rellenado)
    const token = document.getElementById('tokenInput').value;
    const new_password = document.getElementById('passwordInput').value;
    if (!token || !new_password) {
        msg.textContent = 'Faltan datos.';
        msg.className = 'msg error';
        return;
    }
    try {
        const response = await fetch(window.location.origin + '/reset-password-confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password })
        });
        const data = await response.json();
        if (response.ok) {
            msg.textContent = data.message || 'Contraseña restablecida.';
            msg.className = 'msg success';
            form.reset();
            sessionStorage.removeItem('reset_token'); // Limpia el token tras éxito
        } else {
            msg.textContent = data.detail || 'Error al restablecer contraseña.';
            msg.className = 'msg error';
        }
    } catch (err) {
        msg.textContent = 'Error de red o del servidor.';
        msg.className = 'msg error';
    }
});
</script>
</body>
</html>
