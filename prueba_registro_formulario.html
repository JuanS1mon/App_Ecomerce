<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro - Prueba</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #resultado {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h2>Formulario de Registro</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="form-group">
            <label for="usuario">Nombre de usuario:</label>
            <input type="text" id="usuario" name="usuario" required>
        </div>
        <div class="form-group">
            <label for="clave">Contraseña:</label>
            <input type="password" id="clave" name="clave" required>
            <small>Mínimo 8 caracteres, incluir mayúsculas, minúsculas y caracteres especiales</small>
        </div>
        <div class="form-group">
            <label for="mail">Correo electrónico:</label>
            <input type="email" id="mail" name="mail" required>
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono">
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" id="acepta_terminos" name="acepta_terminos" required>
                Acepto los términos y condiciones
            </label>
        </div>
        <button type="submit">Registrarse</button>
    </form>

    <div id="resultado"></div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Obtener los datos del formulario
            const formData = new FormData(this);
            
            // Preparar los datos para el envío como JSON
            const datosEnvio = {
                nombre: formData.get('nombre'),
                usuario: formData.get('usuario'),
                clave: formData.get('clave'),
                mail: formData.get('mail'),
                telefono: formData.get('telefono'),
                acepta_terminos: true // Valor explícito true como un booleano
            };
            
            // Enviar la solicitud
            fetch('http://localhost:8000/user/registro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datosEnvio)
            })
            .then(response => {
                const resultDiv = document.getElementById('resultado');
                resultDiv.style.display = 'block';
                
                if (response.ok) {
                    // Si la respuesta es exitosa
                    return response.json().then(data => {
                        resultDiv.className = 'success';
                        resultDiv.innerHTML = `<h3>Registro exitoso</h3>
                                              <p>${data.message}</p>
                                              <p>Usuario: ${data.usuario}</p>`;
                    });
                } else {
                    // Si hay un error en la respuesta
                    return response.json().then(error => {
                        resultDiv.className = 'error';
                        resultDiv.innerHTML = `<h3>Error ${response.status}</h3>
                                              <p>${error.detail || 'Error desconocido'}</p>`;
                        console.log('Error completo:', error);
                    });
                }
            })
            .catch(error => {
                const resultDiv = document.getElementById('resultado');
                resultDiv.style.display = 'block';
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<h3>Error de conexión</h3>
                                      <p>No se pudo conectar con el servidor: ${error.message}</p>`;
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
