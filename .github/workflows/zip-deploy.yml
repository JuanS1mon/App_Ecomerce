name: Deploy to Azure Web App (ZIP) - FastAPI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests (optional)
      run: |
        pytest -q || true

    - name: Create zip artifact
      run: |
        zip -r app.zip * -x ".git/*" -x "env/*" -x ".venv/*" -x ".github/*"

    - name: Check Publish Profile Secret
      run: |
        if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]; then
          echo "AZURE_WEBAPP_PUBLISH_PROFILE is not set in this repository. Add it under Settings > Secrets and variables > Actions.";
          exit 1;
        else
          echo "AZURE_WEBAPP_PUBLISH_PROFILE is set.";
        fi
      env:
        AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      env:
        AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      with:
        app-name: EcomerceApp
        package: app.zip
        publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
        # Ensure that AZURE_WEBAPP_PUBLISH_PROFILE is set in your repository secrets:
        # Go to your GitHub repository > Settings > Secrets and variables > Actions > New repository secret
        # Name: AZURE_WEBAPP_PUBLISH_PROFILE, Value: <paste your Azure publish profile XML here>

    - name: Tail logs
      run: |
        echo "Deployment finished; use az webapp log tail or check the portal to view logs"

    # No post-deploy check (pre-deploy kept above).
