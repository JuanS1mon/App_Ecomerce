name: Deploy to Azure Web App (ZIP) - FastAPI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests (optional)
      run: |
        pytest -q || true

    - name: Create zip artifact
      run: |
        zip -r app.zip * -x ".git/*" -x "env/*" -x ".venv/*" -x ".github/*"

    - name: Check Azure credentials
      run: |
        if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" -a -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
          echo "No deploy credentials found. Set AZURE_WEBAPP_PUBLISH_PROFILE or AZURE_CREDENTIALS in repository secrets.";
          exit 1;
        fi
        if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
          echo "AZURE_CREDENTIALS is set (Service Principal will be used).";
          echo "AZURE_USE_SP=true" >> $GITHUB_ENV
        else
          echo "AZURE_WEBAPP_PUBLISH_PROFILE is set (publish profile will be used).";
        fi

    - name: Login to Azure (Service Principal)
      uses: azure/login@v1
      if: ${{ secrets.AZURE_CREDENTIALS }}
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: EcomerceApp
        package: app.zip
        # Ensure that AZURE_WEBAPP_PUBLISH_PROFILE is set in your repository secrets:
        # Go to your GitHub repository > Settings > Secrets and variables > Actions > New repository secret
        # Name: AZURE_WEBAPP_PUBLISH_PROFILE, Value: <paste your Azure publish profile XML here>

    - name: Tail logs
      run: |
        echo "Deployment finished; use az webapp log tail or check the portal to view logs"

    # No post-deploy check (pre-deploy kept above).
