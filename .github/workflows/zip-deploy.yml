name: Deploy to Azure Web App - EcomerceApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.11 (for tooling only)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: EcomerceApp
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .
        # Ensure that AZURE_WEBAPP_PUBLISH_PROFILE is set in your repository secrets:
        # Go to your GitHub repository > Settings > Secrets and variables > Actions > New repository secret
        # Name: AZURE_WEBAPP_PUBLISH_PROFILE, Value: <paste your Azure publish profile XML here>

    - name: Tail logs
      run: |
        echo "Deployment finished; use az webapp log tail or check the portal to view logs"

    # No post-deploy check (pre-deploy kept above).
