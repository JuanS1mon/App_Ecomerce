version: '3.8'

services:
  # Base de datos SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver_microservices
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MyStrongPass123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - microservices_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P MyStrongPass123! -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Core Service - Admin, Security, Mail, Chat, Mensajes
  core-service:
    build: 
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_PATH: microservices/core-service
    container_name: core_service
    ports:
      - "8001:8000"
    environment:
      - SERVICE_NAME=core-service
      - DATABASE_URL=mssql+pyodbc://sa:MyStrongPass123!@sqlserver:1433/CoreDB?driver=ODBC+Driver+17+for+SQL+Server
      - PORT=8000
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - microservices_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/core/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Stock Service - Inventario y Gestión de Stock
  stock-service:
    build: 
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_PATH: microservices/stock-service
    container_name: stock_service
    ports:
      - "8002:8000"
    environment:
      - SERVICE_NAME=stock-service
      - DATABASE_URL=mssql+pyodbc://sa:MyStrongPass123!@sqlserver:1433/StockDB?driver=ODBC+Driver+17+for+SQL+Server
      - PORT=8000
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - microservices_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/stock/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Obras Service - Gestión de Proyectos y Obras
  obras-service:
    build: 
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_PATH: microservices/obras-service
    container_name: obras_service
    ports:
      - "8003:8000"
    environment:
      - SERVICE_NAME=obras-service
      - DATABASE_URL=mssql+pyodbc://sa:MyStrongPass123!@sqlserver:1433/ObrasDB?driver=ODBC+Driver+17+for+SQL+Server
      - PORT=8000
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - microservices_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/obras/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Tickets Service - Sistema de Soporte y Tickets
  tickets-service:
    build: 
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_PATH: microservices/tickets-service
    container_name: tickets_service
    ports:
      - "8004:8000"
    environment:
      - SERVICE_NAME=tickets-service
      - DATABASE_URL=mssql+pyodbc://sa:MyStrongPass123!@sqlserver:1433/TicketsDB?driver=ODBC+Driver+17+for+SQL+Server
      - PORT=8000
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - microservices_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/tickets/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NGINX API Gateway
  nginx-gateway:
    image: nginx:alpine
    container_name: nginx_api_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./microservices/nginx/api-gateway-complete.conf:/etc/nginx/nginx.conf:ro
      - ./microservices/nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./microservices/dashboard.html:/usr/share/nginx/html/dashboard.html:ro
    depends_on:
      - core-service
      - stock-service
      - obras-service
      - tickets-service
    networks:
      - microservices_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis para Cache y Sessions (opcional)
  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservices_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Monitoring con Prometheus (opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - microservices_network
    restart: unless-stopped

  # Grafana para Dashboards (opcional)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - microservices_network
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  microservices_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
