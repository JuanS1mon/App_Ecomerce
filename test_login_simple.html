<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login Simple</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Login Simple</h1>
        <form id="testForm">
            <input type="text" id="username" placeholder="Usuario" value="juan" required>
            <input type="password" id="password" placeholder="Contraseña" value="Juan904068" required>
            <button type="submit">Login</button>
        </form>
        
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '🔄 Enviando petición...';
            
            console.log('🚀 INICIANDO TEST LOGIN SIMPLE');
            console.log('📍 URL actual:', window.location.href);
            console.log('🎯 Enviando a: /login');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        username: username,
                        password: password
                    }),
                    credentials: 'include'
                });
                
                console.log('📬 Respuesta recibida:', {
                    status: response.status,
                    url: response.url,
                    ok: response.ok,
                    headers: Object.fromEntries(response.headers.entries())
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Datos JSON:', data);
                    
                    resultDiv.innerHTML = `
                        <h3>✅ Login Exitoso</h3>
                        <p><strong>Token:</strong> ${data.access_token ? data.access_token.substring(0, 50) + '...' : 'No encontrado'}</p>
                        <p><strong>Usuario:</strong> ${data.user_info ? data.user_info.username : 'No encontrado'}</p>
                        <p><strong>Status:</strong> ${response.status}</p>
                    `;
                } else {
                    const errorText = await response.text();
                    console.error('❌ Error en respuesta:', errorText);
                    
                    resultDiv.innerHTML = `
                        <h3>❌ Error ${response.status}</h3>
                        <p><strong>URL:</strong> ${response.url}</p>
                        <p><strong>Error:</strong> ${errorText.substring(0, 200)}${errorText.length > 200 ? '...' : ''}</p>
                    `;
                }
                
            } catch (error) {
                console.error('❌ Error de fetch:', error);
                resultDiv.innerHTML = `
                    <h3>❌ Error de Conexión</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
