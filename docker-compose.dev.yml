version: '3.8'

services:
  # ==========================================
  # SERVICIO DE APLICACIÓN FASTAPI (DESARROLLO)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sql_app_fastapi_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    volumes:
      # Montar código para desarrollo (hot reload)
      - ./sql_app:/app/sql_app
      - ./logs:/app/logs
      # Base de datos SQLite persistente
      - ./sql_app.db:/app/sql_app.db
    networks:
      - sql_app_dev

volumes:
  sql_data_dev:
    driver: local

networks:
  sql_app_dev:
    driver: bridge
