# ============================================================================
# API GATEWAY - NGINX CONFIGURATION COMPLETA
# ============================================================================
# Configuración completa de NGINX como API Gateway para todos los microservicios

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format extendido
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr response_time: $upstream_response_time '
                    'service: $service_name';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Configuración de performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=core:10m rate=20r/s;

    # ==========================================
    # UPSTREAM DEFINITIONS (MICROSERVICIOS)
    # ==========================================
    
    # Core Service (admin, security, mail, chat, mensajes)
    upstream core-service {
        server host.docker.internal:8001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Stock Service (inventario y stock)
    upstream stock-service {
        server host.docker.internal:8002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Obras Service (gestión de obras)
    upstream obras-service {
        server host.docker.internal:8003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Tickets Service (soporte y tickets)
    upstream tickets-service {
        server host.docker.internal:8004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ==========================================
    # MAIN SERVER CONFIGURATION
    # ==========================================
    server {
        listen 80;
        server_name localhost api.localhost;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Robots-Tag "noindex, nofollow";
        add_header X-API-Gateway "Microservices Gateway v1.0";

        # ==========================================
        # HEALTH CHECK GLOBAL
        # ==========================================
        location /health {
            access_log off;
            return 200 '{"status": "healthy", "gateway": "nginx", "timestamp": "$time_iso8601", "services": ["core", "stock", "obras", "tickets"]}';
            add_header Content-Type application/json;
        }

        # ==========================================
        # CORE SERVICE ROUTES
        # ==========================================
        
        # Panel de administración
        location /admin {
            set $service_name "core";
            limit_req zone=core burst=20 nodelay;
            proxy_pass http://core-service;
            include /etc/nginx/proxy_params;
        }

        # Autenticación y seguridad
        location /auth {
            set $service_name "core";
            limit_req zone=core burst=30 nodelay;
            proxy_pass http://core-service;
            include /etc/nginx/proxy_params;
        }

        # Sistema de correos
        location /mail {
            set $service_name "core";
            proxy_pass http://core-service;
            include /etc/nginx/proxy_params;
        }

        # Chat y comunicación (WebSocket support)
        location /chat {
            set $service_name "core";
            proxy_pass http://core-service;
            include /etc/nginx/proxy_params;
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Sistema de mensajes
        location /mensajes {
            set $service_name "core";
            proxy_pass http://core-service;
            include /etc/nginx/proxy_params;
        }

        # Core API directo
        location /core {
            set $service_name "core";
            limit_req zone=core burst=50 nodelay;
            proxy_pass http://core-service;
            include /etc/nginx/proxy_params;
        }

        # ==========================================
        # STOCK SERVICE ROUTES
        # ==========================================
        
        location /stock {
            set $service_name "stock";
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://stock-service;
            include /etc/nginx/proxy_params;
        }

        location /inventory {
            set $service_name "stock";
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://stock-service;
            include /etc/nginx/proxy_params;
        }

        location /articles {
            set $service_name "stock";
            limit_req zone=api burst=25 nodelay;
            proxy_pass http://stock-service;
            include /etc/nginx/proxy_params;
        }

        # ==========================================
        # OBRAS SERVICE ROUTES
        # ==========================================
        
        location /obras {
            set $service_name "obras";
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://obras-service;
            include /etc/nginx/proxy_params;
        }

        location /projects {
            set $service_name "obras";
            limit_req zone=api burst=15 nodelay;
            proxy_pass http://obras-service;
            include /etc/nginx/proxy_params;
        }

        location /tasks {
            set $service_name "obras";
            proxy_pass http://obras-service;
            include /etc/nginx/proxy_params;
        }

        # ==========================================
        # TICKETS SERVICE ROUTES
        # ==========================================
        
        location /tickets {
            set $service_name "tickets";
            limit_req zone=api burst=15 nodelay;
            proxy_pass http://tickets-service;
            include /etc/nginx/proxy_params;
        }

        location /support {
            set $service_name "tickets";
            proxy_pass http://tickets-service;
            include /etc/nginx/proxy_params;
        }

        # ==========================================
        # API DISCOVERY ENDPOINT
        # ==========================================
        location /api {
            return 200 '{
                "gateway": "Microservices API Gateway",
                "version": "1.0.0",
                "services": {
                    "core": {
                        "url": "/core",
                        "docs": "/core/docs",
                        "health": "/core/health",
                        "features": ["admin", "auth", "mail", "chat", "mensajes"]
                    },
                    "stock": {
                        "url": "/stock", 
                        "docs": "/stock/docs",
                        "health": "/stock/health",
                        "features": ["inventory", "articles", "stock_calculation"]
                    },
                    "obras": {
                        "url": "/obras",
                        "docs": "/obras/docs", 
                        "health": "/obras/health",
                        "features": ["projects", "tasks", "resources"]
                    },
                    "tickets": {
                        "url": "/tickets",
                        "docs": "/tickets/docs",
                        "health": "/tickets/health", 
                        "features": ["support", "ticket_management"]
                    }
                }
            }';
            add_header Content-Type application/json;
        }

        # ==========================================
        # STATIC FILES Y ASSETS
        # ==========================================
        location /static {
            alias /var/www/static;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ==========================================
        # DEFAULT ROUTE
        # ==========================================
        location / {
            return 200 '{
                "message": "Microservices API Gateway",
                "version": "1.0.0",
                "endpoints": {
                    "health": "/health",
                    "api_info": "/api",
                    "services": {
                        "core": "/core/docs",
                        "stock": "/stock/docs", 
                        "obras": "/obras/docs",
                        "tickets": "/tickets/docs"
                    }
                },
                "timestamp": "$time_iso8601"
            }';
            add_header Content-Type application/json;
        }

        # ==========================================
        # ERROR PAGES
        # ==========================================
        error_page 404 /404.json;
        error_page 500 502 503 504 /50x.json;
        
        location = /404.json {
            return 404 '{"error": "Not Found", "message": "Service or endpoint not found", "gateway": "nginx"}';
            add_header Content-Type application/json;
        }
        
        location = /50x.json {
            return 500 '{"error": "Internal Server Error", "message": "Gateway or upstream service error", "gateway": "nginx"}';
            add_header Content-Type application/json;
        }
    }

    # ==========================================
    # INCLUDE PROXY PARAMS
    # ==========================================
    # Este archivo debe ser creado separadamente
}
