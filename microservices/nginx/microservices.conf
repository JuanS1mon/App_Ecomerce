# ============================================================================
# NGINX CONFIGURATION FOR MICROSERVICES API GATEWAY
# ============================================================================
# Este archivo configura NGINX como API Gateway para enrutar peticiones
# a los diferentes microservicios según el path solicitado

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Configuración general
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ==========================================
    # UPSTREAM DEFINITIONS (SERVICIOS)
    # ==========================================
    
    # Core Service (admin, security, mail, chat, mensajes)
    upstream core-service {
        server core-service:8001 max_fails=3 fail_timeout=30s;
    }

    # Stock Service (inventario y stock)
    upstream stock-service {
        server stock-service:8002 max_fails=3 fail_timeout=30s;
    }

    # Obras Service (gestión de obras)
    upstream obras-service {
        server obras-service:8003 max_fails=3 fail_timeout=30s;
    }

    # ==========================================
    # MAIN SERVER CONFIGURATION
    # ==========================================
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # ==========================================
        # HEALTH CHECK ENDPOINT
        # ==========================================
        location /health {
            access_log off;
            return 200 "API Gateway is healthy\n";
            add_header Content-Type text/plain;
        }

        # ==========================================
        # CORE SERVICE ROUTES
        # ==========================================
        # Panel de administración
        location /admin {
            proxy_pass http://core-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Autenticación y seguridad
        location /auth {
            proxy_pass http://core-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sistema de correos
        location /mail {
            proxy_pass http://core-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chat y comunicación
        location /chat {
            proxy_pass http://core-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Para WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Sistema de mensajes
        location /mensajes {
            proxy_pass http://core-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Core API
        location /core {
            proxy_pass http://core-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # STOCK SERVICE ROUTES
        # ==========================================
        location /stock {
            proxy_pass http://stock-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # API de inventario
        location /inventory {
            proxy_pass http://stock-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API de artículos
        location /articles {
            proxy_pass http://stock-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # OBRAS SERVICE ROUTES
        # ==========================================
        location /obras {
            proxy_pass http://obras-service;
            proxy_set_header Host $host;
            proxy_Set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # API de proyectos
        location /projects {
            proxy_pass http://obras-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # STATIC FILES
        # ==========================================
        location /static {
            alias /var/www/static;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ==========================================
        # DEFAULT ROUTE (REDIRECT TO ADMIN)
        # ==========================================
        location / {
            return 301 /admin;
        }

        # ==========================================
        # ERROR PAGES
        # ==========================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            return 404 "Service not found\n";
            add_header Content-Type text/plain;
        }
        
        location = /50x.html {
            return 500 "Internal server error\n";
            add_header Content-Type text/plain;
        }
    }
}
