<!-- Navbar blanco estilo administrativo - Fijo en la parte superior -->
<nav class="bg-white shadow-md sticky top-0 z-50 border-b border-gray-200">
    <div class="container mx-auto px-4">
        <div class="flex justify-between h-16">
            <!-- Logo y breadcrumb -->
            <div class="flex items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="/index" class="flex items-center space-x-2 hover:opacity-80 transition-opacity">
                        <img src="/static/img/logo_mapache.gif" alt="Logo" class="h-10 w-auto">
                        <span class="text-gray-800 font-bold text-lg hidden md:block">SQL App Studio</span>
                    </a>
                </div>
                
                <!-- Breadcrumb dinámico -->
                <div class="hidden md:ml-6 md:flex md:items-center">
                    <div class="flex items-center text-sm text-gray-600 bg-gray-50 px-3 py-1.5 rounded-md border" id="breadcrumb-container">
                        <!-- Los elementos del breadcrumb se generarán dinámicamente -->
                    </div>
                </div>
            </div>
            
            <!-- Menú de navegación principal -->
            <div class="hidden md:flex md:items-center md:space-x-1">
                <a href="/index" class="text-gray-600 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                    <i class="fas fa-home mr-1"></i>Inicio
                </a>
                <a href="/admin" class="text-gray-600 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                    <i class="fas fa-tachometer-alt mr-1"></i>Dashboard
                </a>
                <a href="/analisis/admin" class="text-blue-600 bg-blue-50 border-b-2 border-blue-600 px-3 py-2 rounded-md text-sm font-medium">
                    <i class="fas fa-chart-line mr-1"></i>Análisis
                </a>
                <a href="/generar" class="text-gray-600 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                    <i class="fas fa-code mr-1"></i>Generar API
                </a>
                <a href="/migraciones/admin_migraciones" class="text-gray-600 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                    <i class="fas fa-database mr-1"></i>Migraciones
                </a>
            </div>
            
            <!-- Área derecha: docs y usuario -->
            <div class="flex items-center space-x-3">
                <!-- Enlace a documentación -->
                <a href="/docs" class="text-gray-600 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                    <i class="fas fa-book mr-1"></i>
                    <span class="hidden sm:inline">Docs</span>
                </a>
                
                <!-- Separador -->
                <div class="h-6 border-r border-gray-300"></div>
                
                <!-- Fecha actual -->
                <span class="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">
                    <i class="far fa-calendar-alt mr-1"></i>
                    <span id="current-date">29 Jun, 2025</span>
                </span>
                
                <!-- Menú de usuario -->
                <div class="relative">
                    <button id="perfil" class="flex items-center focus:outline-none hover:bg-gray-50 px-2.5 py-1.5 rounded-md transition-colors">
                        <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-blue-600 rounded-full flex items-center justify-center text-white shadow-sm" id="user-initial">
                            U
                        </div>
                        <span class="ml-2 mr-1 text-gray-700 text-sm hidden sm:block" id="user-display-name">Usuario</span>
                        <svg class="ml-1 w-4 h-4 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.586l3.71-4.354a.75.75 0 011.14.976l-4.25 5A.75.75 0 0110 13a.75.75 0 01-.6-.3l-4.25-5a.75.75 0 01.08-1.06z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    
                    <!-- Dropdown del usuario -->
                    <div id="menu-perfil" class="hidden absolute right-0 mt-2 w-52 bg-white rounded-lg shadow-xl z-50 border border-gray-200 overflow-hidden">
                        <div class="bg-gray-50 px-4 py-3 border-b border-gray-200">
                            <div class="text-sm font-medium text-gray-800" id="user-name">Usuario Actual</div>
                            <div class="text-xs text-gray-500 mt-0.5" id="user-email">usuario@ejemplo.com</div>
                        </div>
                        <div class="py-1">
                            <a href="/admin/perfil" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
                                <i class="fas fa-user-circle mr-3 text-gray-400"></i>
                                Tu Perfil
                            </a>
                            <a href="/admin/settings" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
                                <i class="fas fa-cog mr-3 text-gray-400"></i>
                                Configuración
                            </a>
                            <div class="border-t border-gray-100 my-1"></div>
                            <button onclick="logout()" class="w-full flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                                <i class="fas fa-sign-out-alt mr-3 text-red-400"></i>
                                Cerrar Sesión
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Scripts para funcionalidad del navbar blanco -->
<script>
(function() {
    // Función para actualizar la fecha actual
    function updateCurrentDate() {
        const dateElement = document.getElementById('current-date');
        if (dateElement) {
            const now = new Date();
            const options = { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric' 
            };
            dateElement.textContent = now.toLocaleDateString('es-ES', options);
        }
    }
    
    // Función para toggle del menú de usuario
    function setupUserMenu() {
        const perfilButton = document.getElementById('perfil');
        const menuPerfil = document.getElementById('menu-perfil');
        
        if (perfilButton && menuPerfil) {
            perfilButton.addEventListener('click', function(e) {
                e.stopPropagation();
                menuPerfil.classList.toggle('hidden');
            });
            
            // Cerrar menú al hacer clic fuera
            document.addEventListener('click', function(event) {
                if (!perfilButton.contains(event.target) && !menuPerfil.contains(event.target)) {
                    menuPerfil.classList.add('hidden');
                }
            });
        }
    }
    
    // Función para generar breadcrumb dinámico
    function generateBreadcrumb() {
        const breadcrumbContainer = document.getElementById('breadcrumb-container');
        if (!breadcrumbContainer) return;
        
        const path = window.location.pathname;
        const breadcrumbs = [];
        
        // Definir rutas y sus nombres amigables
        const routeNames = {
            '/': 'Inicio',
            '/index': 'Inicio',
            '/admin': 'Administración',
            '/analisis': 'Análisis',
            '/analisis/admin': 'Análisis de Datos',
            '/generar': 'Generar API',
            '/migraciones': 'Migraciones',
            '/migraciones/admin_migraciones': 'Gestión de Migraciones'
        };
        
        // Construir breadcrumb
        if (path === '/analisis/admin') {
            breadcrumbs.push(
                { text: 'Inicio', href: '/index', icon: 'fa-home' },
                { text: 'Administración', href: '/admin', icon: 'fa-tachometer-alt' },
                { text: 'Análisis de Datos', href: null, icon: 'fa-chart-line' }
            );
        } else {
            // Breadcrumb genérico para otras rutas
            const segments = path.split('/').filter(segment => segment);
            let currentPath = '';
            
            breadcrumbs.push({ text: 'Inicio', href: '/index', icon: 'fa-home' });
            
            segments.forEach((segment, index) => {
                currentPath += '/' + segment;
                const isLast = index === segments.length - 1;
                const name = routeNames[currentPath] || segment.charAt(0).toUpperCase() + segment.slice(1);
                
                breadcrumbs.push({
                    text: name,
                    href: isLast ? null : currentPath,
                    icon: null
                });
            });
        }
        
        // Renderizar breadcrumb
        breadcrumbContainer.innerHTML = breadcrumbs.map((crumb, index) => {
            const isLast = index === breadcrumbs.length - 1;
            const icon = crumb.icon ? `<i class="fas ${crumb.icon} mr-1"></i>` : '';
            
            if (isLast) {
                return `<span class="text-blue-600 font-medium">${icon}${crumb.text}</span>`;
            } else {
                return `
                    <a href="${crumb.href}" class="text-gray-500 hover:text-blue-600 transition-colors">
                        ${icon}${crumb.text}
                    </a>
                    <svg class="h-3 w-3 mx-2 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                    </svg>
                `;
            }
        }).join('');
    }
    
    // Función para actualizar información del usuario
    function updateUserInfo() {
        // Simular obtener datos del usuario (en producción vendría de una API)
        const userData = {
            name: 'Juan Administrador',
            email: 'juan@sqlappstudio.com',
            initial: 'J'
        };
        
        // Actualizar elementos del DOM
        const userInitial = document.getElementById('user-initial');
        const userDisplayName = document.getElementById('user-display-name');
        const userName = document.getElementById('user-name');
        const userEmail = document.getElementById('user-email');
        
        if (userInitial) userInitial.textContent = userData.initial;
        if (userDisplayName) userDisplayName.textContent = userData.name;
        if (userName) userName.textContent = userData.name;
        if (userEmail) userEmail.textContent = userData.email;
    }
    
    // Función de logout
    window.logout = function() {
        if (confirm('¿Estás seguro de que quieres cerrar sesión?')) {
            // En producción esto redirigiría a la ruta de logout
            window.location.href = '/logout';
        }
    };
    
    // Inicializar todo cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', function() {
        updateCurrentDate();
        setupUserMenu();
        generateBreadcrumb();
        updateUserInfo();
        
        // Actualizar fecha cada minuto
        setInterval(updateCurrentDate, 60000);
    });
})();
</script>
