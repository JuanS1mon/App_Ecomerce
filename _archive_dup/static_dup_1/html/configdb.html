<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Base de Datos | Panel de Administración</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Navbar - Se cargará dinámicamente -->
    <div id="navbar-container"></div>

    <!-- Contenido principal -->
    <main class="container py-4">
        <!-- Breadcrumb (migas de pan) -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb" id="breadcrumb-container">
                <!-- Se llenará dinámicamente por navigation.js -->
            </ol>
        </nav>
        
        <div class="row">
            <div class="col-12">
                <div class="card shadow mb-4">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-database me-2"></i>
                            Configuración de la Base de Datos
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- Alertas para mensajes -->
                        <div id="alertContainer"></div>
                        
                        <!-- Formulario de configuración -->
                        <form id="env-form" class="mt-3">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="DB_USER" class="form-label">
                                            <i class="fas fa-user me-1"></i> Usuario de Base de Datos
                                        </label>
                                        <input type="text" class="form-control" id="DB_USER" name="DB_USER" value="{{ env_values.DB_USER }}">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="DB_PASSWORD" class="form-label">
                                            <i class="fas fa-lock me-1"></i> Contraseña de Base de Datos
                                        </label>
                                        <input type="password" class="form-control" id="DB_PASSWORD" name="DB_PASSWORD" value="{{ env_values.DB_PASSWORD }}">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="DB_HOST" class="form-label">
                                            <i class="fas fa-server me-1"></i> Host de Base de Datos
                                        </label>
                                        <input type="text" class="form-control" id="DB_HOST" name="DB_HOST" value="{{ env_values.DB_HOST }}">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="DB_NAME" class="form-label">
                                            <i class="fas fa-database me-1"></i> Nombre de Base de Datos
                                        </label>
                                        <input type="text" class="form-control" id="DB_NAME" name="DB_NAME" value="{{ env_values.DB_NAME }}">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="DB_DRIVER" class="form-label">
                                            <i class="fas fa-cogs me-1"></i> Driver de Base de Datos
                                        </label>
                                        <input type="text" class="form-control" id="DB_DRIVER" name="DB_DRIVER" value="{{ env_values.DB_DRIVER }}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="POOL_SIZE" class="form-label">
                                            <i class="fas fa-layer-group me-1"></i> Tamaño del Pool
                                        </label>
                                        <input type="text" class="form-control" id="POOL_SIZE" name="POOL_SIZE" value="{{ env_values.POOL_SIZE }}">
                                        <div class="form-text">Número máximo de conexiones mantenidas en el pool</div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="MAX_OVERFLOW" class="form-label">
                                            <i class="fas fa-water me-1"></i> Máximo Overflow
                                        </label>
                                        <input type="text" class="form-control" id="MAX_OVERFLOW" name="MAX_OVERFLOW" value="{{ env_values.MAX_OVERFLOW }}">
                                        <div class="form-text">Conexiones adicionales permitidas</div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="POOL_TIMEOUT" class="form-label">
                                            <i class="fas fa-clock me-1"></i> Timeout del Pool
                                        </label>
                                        <input type="text" class="form-control" id="POOL_TIMEOUT" name="POOL_TIMEOUT" value="{{ env_values.POOL_TIMEOUT }}">
                                        <div class="form-text">Tiempo de espera para obtener una conexión (segundos)</div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="POOL_PRE_PING" class="form-label">
                                            <i class="fas fa-heartbeat me-1"></i> Pre-Ping
                                        </label>
                                        <select class="form-select" id="POOL_PRE_PING" name="POOL_PRE_PING">
                                            <option value="True" {% if env_values.POOL_PRE_PING == "True" %}selected{% endif %}>Activado</option>
                                            <option value="False" {% if env_values.POOL_PRE_PING == "False" %}selected{% endif %}>Desactivado</option>
                                        </select>
                                        <div class="form-text">Verificar conexión antes de usar</div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="POOL_RECYCLE" class="form-label">
                                            <i class="fas fa-recycle me-1"></i> Recycle del Pool
                                        </label>
                                        <input type="text" class="form-control" id="POOL_RECYCLE" name="POOL_RECYCLE" value="{{ env_values.POOL_RECYCLE }}">
                                        <div class="form-text">Tiempo en segundos antes de reciclar una conexión</div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2 col-6 mx-auto mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Guardar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer - Se cargará dinámicamente -->
    <div id="footer-container"></div>

    <!-- Bootstrap Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Sistema de componentes y navegación -->
    <script src="/static/js/components.js"></script>
    <script src="/static/js/navigation.js"></script>
    
    <!-- Script específico de la página -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Manejar el envío del formulario
            document.getElementById('env-form').addEventListener('submit', async function(event) {
                // Prevenir el comportamiento de envío por defecto
                event.preventDefault();
                
                // Usar el sistema de notificaciones en lugar de un div temporal
                window.Components.showNotification('Actualizando configuración...', 'info');
                
                let successCount = 0;
                let failCount = 0;
                
                // Obtener todos los campos de entrada del formulario (incluidos selects)
                const formElements = [
                    ...Array.from(this.getElementsByTagName('input')),
                    ...Array.from(this.getElementsByTagName('select'))
                ];
                
                // Para cada campo, hacer una solicitud PUT
                for (const element of formElements) {
                    // Ignorar el botón de envío
                    if (element.type === 'submit') {
                        continue;
                    }
                    
                    try {
                        // Hacer la solicitud PUT
                        const response = await fetch(`/configdb/env/${element.name}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                value: element.value,
                            }),
                        });
                        
                        if (response.ok) {
                            successCount++;
                        } else {
                            failCount++;
                            const errorData = await response.json();
                            console.error(`Error al actualizar ${element.name}:`, errorData);
                            window.Components.showNotification(
                                `Error al actualizar ${element.name}: ${errorData.detail || 'Error desconocido'}`, 
                                'error'
                            );
                        }
                    } catch (error) {
                        failCount++;
                        console.error(`Error en la solicitud para ${element.name}:`, error);
                    }
                }
                
                // Mostrar mensaje de resultado
                if (failCount === 0) {
                    window.Components.showNotification(
                        'Configuración actualizada correctamente', 
                        'success'
                    );
                } else {
                    window.Components.showNotification(
                        `Actualización parcial: ${successCount} variables actualizadas, ${failCount} con errores`, 
                        'warning'
                    );
                }
            });
        });
    </script>
</body>
</html>
