<!-- navbar.html -->
<nav class="bg-gray-800 text-white py-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
        <!-- Breadcrumb dinámico -->
        <div class="flex items-center space-x-2">
            <span class="text-gray-400">Ubicación:</span>
            <ul class="flex space-x-2">
                {% for segment in breadcrumb %}
                    <li>
                        <a href="{{ segment.url }}" class="hover:text-gray-300 {{ 'font-bold' if segment.active else '' }}">
                            {{ segment.name }}
                        </a>
                    </li>
                    {% if not loop.last %}
                        <li>/</li>
                    {% endif %}
                {% endfor %}
            </ul>
        </div>

        <!-- Opciones de usuario -->
        <div class="space-x-4 flex items-center">
            <span class="text-gray-300">Usuario: {{ user.nombre }}</span>
            <a href="/perfil" class="hover:text-gray-300 flex items-center">
                <i class="fas fa-user-circle mr-1"></i> Perfil
            </a>
            <a href="/logout" class="hover:text-gray-300 flex items-center">
                <i class="fas fa-sign-out-alt mr-1"></i> Cerrar sesión
            </a>
        </div>
    </div>
</nav>
