<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traslado de Obra - Sistema de Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header-title {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .artwork-info {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 4px solid #007bff;
        }
        .location-section {
            background-color: #fff;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .location-from {
            border-left: 4px solid #dc3545;
        }
        .location-to {
            border-left: 4px solid #28a745;
        }
        .btn-traslado {
            background: linear-gradient(45deg, #007bff, #0056b3);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-traslado:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.3);
        }
        .form-label {
            font-weight: 600;
            color: #495057;
        }
        .form-select, .form-control {
            border-radius: 8px;
            border: 2px solid #e9ecef;
            transition: border-color 0.3s ease;
        }
        .form-select:focus, .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        .alert {
            border-radius: 8px;
            border: none;
        }
        .loading {
            display: none;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="form-container">
            <h1 class="header-title">
                <i class="fas fa-exchange-alt text-primary"></i>
                Traslado de Obra
            </h1>

            <!-- Información de la obra seleccionada -->
            <div class="artwork-info" id="artworkInfo" style="display: none;">
                <h5><i class="fas fa-palette text-primary"></i> Información de la Obra</h5>
                <div class="row">
                    <div class="col-md-6">
                        <strong>Título:</strong> <span id="artworkTitle"></span>
                    </div>
                    <div class="col-md-6">
                        <strong>Código:</strong> <span id="artworkCode"></span>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-6">
                        <strong>Ubicación Actual:</strong> <span id="currentLocation"></span>
                    </div>
                    <div class="col-md-6">
                        <strong>Estado:</strong> <span id="artworkStatus"></span>
                    </div>
                </div>
            </div>

            <!-- Formulario de traslado -->
            <form id="trasladoForm">
                <div class="row">
                    <div class="col-12">
                        <div class="mb-3">
                            <label for="artwork_id" class="form-label">
                                <i class="fas fa-search text-primary"></i> Seleccionar Obra
                            </label>
                            <select class="form-select" id="artwork_id" name="artwork_id" required>
                                <option value="">Seleccione una obra...</option>
                                {% for artwork in artworks %}
                                <option value="{{ artwork.id }}" 
                                        data-title="{{ artwork.title or 'Sin título' }}" 
                                        data-code="{{ artwork.code or 'Sin código' }}"
                                        data-location="{{ artwork.current_location or 'Sin ubicación' }}"
                                        data-status="{{ artwork.status or 'Sin estado' }}">
                                    {{ artwork.code or 'Sin código' }} - {{ artwork.title or 'Sin título' }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="location-section location-from">
                            <label for="from_location_id" class="form-label">
                                <i class="fas fa-map-marker-alt text-danger"></i> Ubicación de Origen
                            </label>
                            <select class="form-select" id="from_location_id" name="from_location_id" required>
                                <option value="">Seleccione ubicación de origen...</option>
                                {% for location in locations %}
                                <option value="{{ location.id }}">{{ location.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="location-section location-to">
                            <label for="to_location_id" class="form-label">
                                <i class="fas fa-map-marker-alt text-success"></i> Ubicación de Destino
                            </label>
                            <select class="form-select" id="to_location_id" name="to_location_id" required>
                                <option value="">Seleccione ubicación de destino...</option>
                                {% for location in locations %}
                                <option value="{{ location.id }}">{{ location.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="notes" class="form-label">
                        <i class="fas fa-sticky-note text-primary"></i> Notas del Traslado
                    </label>
                    <textarea class="form-control" id="notes" name="notes" rows="3" 
                              placeholder="Escriba aquí cualquier observación sobre el traslado..."></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="moved_by" class="form-label">
                                <i class="fas fa-user text-primary"></i> Responsable del Traslado
                            </label>
                            <input type="text" class="form-control" id="moved_by" name="moved_by" 
                                   placeholder="Nombre del responsable">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="movement_date" class="form-label">
                                <i class="fas fa-calendar text-primary"></i> Fecha del Traslado
                            </label>
                            <input type="datetime-local" class="form-control" id="movement_date" name="movement_date" 
                                   value="{{ current_datetime }}">
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-traslado">
                        <i class="fas fa-exchange-alt"></i> Realizar Traslado
                        <span class="loading spinner-border spinner-border-sm ms-2" role="status"></span>
                    </button>
                    <a href="/movements/html" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> Volver a Movimientos
                    </a>
                </div>
            </form>

            <!-- Alerts -->
            <div id="alertContainer" class="mt-3"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const artworkSelect = document.getElementById('artwork_id');
            const artworkInfo = document.getElementById('artworkInfo');
            const trasladoForm = document.getElementById('trasladoForm');
            const alertContainer = document.getElementById('alertContainer');

            // Mostrar información de la obra seleccionada
            artworkSelect.addEventListener('change', function() {
                const selectedOption = this.options[this.selectedIndex];
                
                if (this.value) {
                    document.getElementById('artworkTitle').textContent = selectedOption.dataset.title;
                    document.getElementById('artworkCode').textContent = selectedOption.dataset.code;
                    document.getElementById('currentLocation').textContent = selectedOption.dataset.location;
                    document.getElementById('artworkStatus').textContent = selectedOption.dataset.status;
                    artworkInfo.style.display = 'block';
                } else {
                    artworkInfo.style.display = 'none';
                }
            });

            // Validar ubicaciones diferentes
            const fromLocation = document.getElementById('from_location_id');
            const toLocation = document.getElementById('to_location_id');

            function validateLocations() {
                if (fromLocation.value && toLocation.value && fromLocation.value === toLocation.value) {
                    showAlert('Las ubicaciones de origen y destino no pueden ser la misma.', 'warning');
                    return false;
                }
                return true;
            }

            fromLocation.addEventListener('change', validateLocations);
            toLocation.addEventListener('change', validateLocations);

            // Envío del formulario
            trasladoForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (!validateLocations()) {
                    return;
                }

                const loadingSpinner = document.querySelector('.loading');
                const submitBtn = document.querySelector('button[type="submit"]');
                
                loadingSpinner.style.display = 'inline-block';
                submitBtn.disabled = true;

                const formData = new FormData(this);
                const data = {
                    artwork_id: parseInt(formData.get('artwork_id')),
                    movement_type: 'TRASLADO',
                    from_location_id: parseInt(formData.get('from_location_id')),
                    to_location_id: parseInt(formData.get('to_location_id')),
                    notes: formData.get('notes'),
                    moved_by: formData.get('moved_by'),
                    movement_date: formData.get('movement_date')
                };

                try {
                    const response = await fetch('/movements/traslado', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showAlert('Traslado realizado exitosamente.', 'success');
                        setTimeout(() => {
                            window.location.href = '/movements/html';
                        }, 2000);
                    } else {
                        showAlert(`Error: ${result.detail || 'Error desconocido'}`, 'danger');
                    }
                } catch (error) {
                    showAlert('Error de conexión. Intente nuevamente.', 'danger');
                    console.error('Error:', error);
                } finally {
                    loadingSpinner.style.display = 'none';
                    submitBtn.disabled = false;
                }
            });

            function showAlert(message, type) {
                alertContainer.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
