<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="/static/js/components.js"></script>
    <style>
        /* Estética actualizada similar al panel de administración */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .form-input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            pointer-events: none;
        }
        
        .input-with-icon {
            padding-left: 40px !important;
        }
        
        .form-field {
            transition: all 0.3s ease;
        }
        
        .form-field:focus-within {
            transform: translateY(-2px);
        }
        
        .form-field:focus-within label {
            color: #667eea;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animated-form > div {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        .animated-form > div:nth-child(1) { animation-delay: 0.1s; }
        .animated-form > div:nth-child(2) { animation-delay: 0.2s; }
        
        .btn-submit {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .btn-submit:after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg, 
                rgba(255, 255, 255, 0) 10%, 
                rgba(255, 255, 255, 0.1) 30%, 
                rgba(255, 255, 255, 0.5) 50%, 
                rgba(255, 255, 255, 0.1) 70%, 
                rgba(255, 255, 255, 0) 90%
            );
            transform: rotate(45deg) translate(-100%, -100%);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: rotate(45deg) translate(-100%, -100%); }
            100% { transform: rotate(45deg) translate(100%, 100%); }
        }
        
        .card-shine {
            position: relative;
            overflow: hidden;
        }
        
        .card-shine:before {
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 100%
            );
            transform: skewX(-25deg);
            transition: all 0.75s;
        }
        
        .card-shine:hover:before {
            animation: shine-effect 1.5s;
        }
        
        @keyframes shine-effect {
            100% { left: 125%; }
        }
        
        /* Estilos adicionales según el panel de admin */
        .icon-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 3rem;
            width: 3rem;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar - Se cargará dinámicamente -->
    <div id="navbar-container"></div>

    <!-- Contenido principal -->
    <div class="container mx-auto p-8 flex-grow">
        <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md card-hover border border-gray-100 card-shine">
            <div class="text-center mb-8">
                <div class="icon-circle bg-indigo-100 text-indigo-600 mx-auto mb-4">
                    <i class="fas fa-key text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Recuperar Contraseña</h1>
                <p class="text-gray-500 mt-2">Ingresa tu correo electrónico para recibir instrucciones</p>
            </div>
            
            <form id="reset_password_form" class="space-y-5 animated-form">
                <div class="form-field relative">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" id="email" name="email" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                </div>
                
                <div>
                    <button id="submit_button" type="submit" class="btn-submit w-full flex justify-center items-center gradient-bg text-white py-2 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-300 font-medium text-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        <i class="fas fa-paper-plane mr-2"></i>
                        Enviar instrucciones
                    </button>
                </div>
                
                <!-- Mensaje de error -->
                <div id="message" class="text-center text-red-500 font-medium"></div>
                
                <div class="text-center mt-6">
                    <a href="/loginpage" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
                        <i class="fas fa-arrow-left mr-1"></i> Volver a iniciar sesión
                    </a>
                </div>
            </form>
        </div>
    </div>    <script>
        // Script para cargar el navbar
        document.addEventListener('DOMContentLoaded', () => {
            // Cargar componentes
            if (window.loadComponents) {
                loadComponents();
                // Actualizar la navegación después de cargar los componentes
                setTimeout(() => {
                    if (typeof updateNavigation === 'function') {
                        updateNavigation('/reset-password');
                    }
                }, 100);
            } else {
                console.error("La función loadComponents no está disponible");
            }

            const form = document.getElementById('reset_password_form');
            const submitButton = document.getElementById('submit_button');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Guarda el texto original del botón
                const originalText = submitButton.innerHTML;
                // Muestra un estado de carga
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Enviando...';
                submitButton.disabled = true;
                
                // Obtener los datos del formulario
                const formData = new FormData(form);
                const email = formData.get('email');                // Enviar solicitud al servidor
                fetch('/password-reset-request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        'email': email
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error al procesar la solicitud');
                    }
                    return response.json();
                })
                .then(data => {
                    // Restaurar el botón
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
                    
                    // Mostrar notificación de éxito
                    showNotification('Instrucciones enviadas. Por favor, revisa tu correo electrónico.', 'success');
                    form.reset();
                })
                .catch(error => {
                    console.error('Error:', error);
                    // Restaurar el botón
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
                    showNotification('Ha ocurrido un error. Inténtalo de nuevo.', 'error');
                    document.getElementById('message').textContent = 'Error al procesar la solicitud';
                });
            });
            
            // Función para mostrar notificaciones
            function showNotification(message, type) {
                // Remove existing notifications
                const existingNotifications = document.querySelectorAll('.notification');
                existingNotifications.forEach(notification => notification.remove());
                
                // Create notification element
                const notification = document.createElement('div');
                notification.className = `notification fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 transition-all duration-500 transform translate-x-full flex items-center`;
                
                if (type === 'success') {
                    notification.classList.add('bg-green-100', 'text-green-800', 'border-l-4', 'border-green-500');
                    notification.innerHTML = `
                        <div class="flex-shrink-0 bg-green-500 rounded-full p-2 mr-3">
                            <i class="fas fa-check text-white"></i>
                        </div>
                        <div>
                            <p class="font-medium">¡Éxito!</p>
                            <p class="text-sm">${message}</p>
                        </div>
                    `;
                } else {
                    notification.classList.add('bg-red-100', 'text-red-800', 'border-l-4', 'border-red-500');
                    notification.innerHTML = `
                        <div class="flex-shrink-0 bg-red-500 rounded-full p-2 mr-3">
                            <i class="fas fa-exclamation-triangle text-white"></i>
                        </div>
                        <div>
                            <p class="font-medium">Error</p>
                            <p class="text-sm">${message}</p>
                        </div>
                    `;
                }
                
                // Add to DOM
                document.body.appendChild(notification);
                
                // Animate in
                setTimeout(() => {
                    notification.classList.remove('translate-x-full');
                    notification.classList.add('translate-x-0');
                }, 10);
                
                // Auto remove after delay
                setTimeout(() => {
                    notification.classList.remove('translate-x-0');
                    notification.classList.add('translate-x-full');
                    
                    setTimeout(() => {
                        notification.remove();
                    }, 500);
                }, 5000);
            }
        });
    </script>
</body>
</html>
