<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 Servicio No Disponible</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="text-center">
        <h1 class="text-5xl font-bold text-purple-600 mb-4">503 Servicio No Disponible</h1>
        <p class="text-lg text-gray-600 mb-4">Lo sentimos, el servicio no está disponible en este momento.</p>
        <p class="text-md text-gray-500 mb-6">Es posible que el servidor esté en mantenimiento o sobrecargado temporalmente. Por favor, vuelve a intentarlo más tarde.</p>
        <a href="/index" class="bg-blue-500 text-white py-2 px-4 rounded-lg shadow-md hover:bg-blue-600 transition duration-300">Volver al Inicio</a>
    </div>
</body>
</html>
