<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- DESHABILITADO components.js que interfiere con login -->
    <!-- <script src="/static/js/components.js"></script> -->
    <style>
        /* Estética actualizada similar al panel de administración */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .form-input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            pointer-events: none;
        }
        
        .input-with-icon {
            padding-left: 40px !important;
        }
        
        .form-field {
            transition: all 0.3s ease;
        }
        
        .form-field:focus-within {
            transform: translateY(-2px);
        }
        
        .form-field:focus-within label {
            color: #667eea;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animated-form > div {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        .animated-form > div:nth-child(1) { animation-delay: 0.1s; }
        .animated-form > div:nth-child(2) { animation-delay: 0.2s; }
        .animated-form > div:nth-child(3) { animation-delay: 0.3s; }
        
        .btn-submit {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .btn-submit:after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg, 
                rgba(255, 255, 255, 0) 10%, 
                rgba(255, 255, 255, 0.1) 30%, 
                rgba(255, 255, 255, 0.5) 50%, 
                rgba(255, 255, 255, 0.1) 70%, 
                rgba(255, 255, 255, 0) 90%
            );
            transform: rotate(45deg) translate(-100%, -100%);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: rotate(45deg) translate(-100%, -100%); }
            100% { transform: rotate(45deg) translate(100%, 100%); }
        }
        
        .card-shine {
            position: relative;
            overflow: hidden;
        }
        
        .card-shine:before {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 100%
            );
            transform: skewX(-25deg);
            transition: all 0.75s;
        }
        
        .card-shine:hover:before {
            animation: shine-effect 1.5s;
        }
        
        @keyframes shine-effect {
            100% { left: 125%; }
        }
        
        /* Estilos adicionales según el panel de admin */
        .icon-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 3rem;
            width: 3rem;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar - Se cargará dinámicamente -->
    <div id="navbar-container"></div>


    <!-- Contenido principal -->
    <div class="container mx-auto p-8 flex-grow">
        <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md card-hover border border-gray-100 card-shine">
            <div class="text-center mb-8">
                <div class="icon-circle bg-indigo-100 text-indigo-600 mx-auto mb-4">
                    <i class="fas fa-lock text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Iniciar sesión</h1>
                <p class="text-gray-500 mt-2">Ingresa tus credenciales para continuar</p>
            </div>
            
            <form id="form_common" class="space-y-5 animated-form">
                <div class="form-field relative">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nombre de usuario</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" id="username" name="username" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                </div>
                
                <div class="form-field relative">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="password" name="password" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <button type="button" id="toggle-password" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember_me" name="remember_me" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                        <label for="remember_me" class="ml-2 block text-sm text-gray-700">
                            Recordarme
                        </label>
                    </div>                    <div class="text-sm">
                        <a href="/reset-password" class="font-medium text-indigo-600 hover:text-indigo-500">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                </div>
                
                <div>
                    <button id="submit_button" type="submit" class="btn-submit w-full flex justify-center items-center gradient-bg text-white py-2 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-300 font-medium text-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Iniciar sesión
                    </button>
                </div>
                
                <!-- Mensaje de error -->
                <div id="message" class="text-center text-red-500 font-medium"></div>
                
                <!-- Más opciones como en el panel de admin -->
                <div class="mt-6 grid grid-cols-1 gap-4">
                    <a href="/registerpage" class="flex items-center p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors group text-center justify-center">
                        <i class="fas fa-user-plus mr-2 text-indigo-500 group-hover:text-indigo-600"></i>
                        <span class="text-sm">¿No tienes cuenta? Regístrate ahora</span>
                    </a>
                </div>
            </form>
        </div>
        
        <!-- Información adicional similar al panel de admin -->
        <div class="mt-6 max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-4">
            <div class="flex items-center text-sm text-gray-600">
                <div class="flex-shrink-0 bg-blue-100 rounded-full p-2 mr-3">
                    <i class="fas fa-info-circle text-blue-500"></i>
                </div>
                <p>Si tienes problemas para iniciar sesión, contacta con el equipo de soporte.</p>
            </div>
        </div>
    </div>    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si el usuario ya está autenticado
            checkIfAlreadyAuthenticated();
            
            // Toggle password visibility
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    // Toggle icon
                    const iconClass = type === 'password' ? 'fa-eye' : 'fa-eye-slash';
                    this.querySelector('i').className = `fas ${iconClass}`;
                });
            }            // Función para verificar autenticación existente
            async function checkIfAlreadyAuthenticated() {
                // EVITAR BUCLE: Solo verificar autenticación si estamos en una página de login
                const currentPath = window.location.pathname;
                if (!currentPath.includes('login') && !currentPath.includes('register')) {
                    console.log('No estamos en página de login, saltando verificación de autenticación');
                    return;
                }
                
                // EVITAR BUCLE: No verificar si acabamos de hacer login
                if (sessionStorage.getItem('just_logged_in') === 'true') {
                    console.log('Acabamos de hacer login, saltando verificación para evitar bucle');
                    sessionStorage.removeItem('just_logged_in');
                    return;
                }
                
                try {
                    console.log('Verificando autenticación existente para página de login...');
                    const response = await fetch('/usuarios/current', {
                        method: 'GET',
                        credentials: 'include'
                    });
                    
                    if (response.ok) {
                        const userData = await response.json();
                        console.log('Estado de autenticación:', userData);
                        
                        if (userData.autenticado) {
                            console.log('Usuario ya autenticado, redirigiendo desde página de login...');
                            showNotification('Ya tienes una sesión activa. Redirigiendo...', 'success');
                            
                            // Redirigir después de un breve retraso
                            setTimeout(() => {
                                const urlParams = new URLSearchParams(window.location.search);
                                const redirectUrl = urlParams.get('redirect') || '/admin';
                                console.log('Redirigiendo a:', redirectUrl);
                                window.location.href = redirectUrl;
                            }, 1000);
                        }
                    }
                } catch (error) {
                    console.log('No hay sesión activa, mostrando formulario de login');
                }
            }// Form submission
            document.getElementById('form_common').addEventListener('submit', function(event) {
                event.preventDefault();
                
                console.log('🚀 INICIO DE DEBUGGING DETALLADO');
                console.log('📍 URL actual:', window.location.href);
                console.log('🌐 Origin:', window.location.origin);
                console.log('📋 Form element:', document.getElementById('form_common'));

                const submitButton = document.getElementById('submit_button');
                const originalText = submitButton.innerHTML;
                
                // Show loading state
                submitButton.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Verificando...';
                submitButton.disabled = true;

                let formData = new FormData(document.getElementById('form_common'));
                console.log('📊 Datos del formulario:', {
                    username: formData.get('username'),
                    password: formData.get('password') ? '***' : 'vacío'
                });

                const requestUrl = '/login';
                const fullUrl = window.location.origin + requestUrl;
                console.log('🎯 URL de petición:', requestUrl);
                console.log('🔗 URL completa:', fullUrl);
                console.log('📤 Método:', 'POST');
                console.log('📋 Content-Type:', 'application/x-www-form-urlencoded');                fetch(requestUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'username': formData.get('username'),
                        'password': formData.get('password')
                    }),
                    credentials: 'include'  // Asegúrate de enviar las cookies con la solicitud
                })
                .then(response => {
                    console.log('📬 RESPUESTA RECIBIDA:');
                    console.log('✅ Status:', response.status);
                    console.log('🔗 URL:', response.url);
                    console.log('📋 Headers:', Array.from(response.headers.entries()));
                    console.log('✅ OK?:', response.ok);
                    
                    if (!response.ok) {
                        if (response.status === 405) {
                            console.error('Error 405: Método no permitido. Verificar endpoint.');
                            throw new Error('Error de configuración del servidor (405)');
                        } else if (response.status === 401) {
                            throw new Error('Nombre de usuario o contraseña incorrectos');
                        } else {
                            throw new Error(`Error del servidor: ${response.status}`);
                        }
                    }
                    return response.json();
                }).then(data => {
                    console.log('Datos recibidos del servidor:', data);
                    
                    // Restore button state
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
                    
                    if (data.access_token) {
                        console.log('Token de acceso recibido:', data.access_token);
                        console.log('Datos del usuario:', data.user_info);
                        
                        // Mostrar notificación de éxito
                        showNotification('Inicio de sesión exitoso. Redirigiendo...', 'success');
                          // Almacenar el token en localStorage
                        localStorage.setItem('access_token', data.access_token);
                          // Verificar si hay una URL de redirección en los parámetros
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect') || '/admin';
                        
                        console.log('URL de redirección determinada:', redirectUrl);
                        console.log('Iniciando redirección inmediata...');
                        
                        // Evitar verificación de autenticación en la página destino
                        sessionStorage.setItem('just_logged_in', 'true');
                          // Redirigir inmediatamente para mejor UX
                        setTimeout(() => {
                            console.log('Ejecutando redirección a:', redirectUrl);
                            window.location.href = redirectUrl;
                        }, 300); // Tiempo reducido para redirección más rápida
                    } else {
                        console.log('No se recibió access_token en la respuesta');
                        console.log('Estructura completa de la respuesta:', data);
                        showNotification('Nombre de usuario o contraseña incorrectos', 'error');
                        document.getElementById('message').textContent = 'Nombre de usuario o contraseña incorrectos';
                    }
                })                .catch(error => {
                    console.error('Error completo:', error);
                    console.error('Stack trace:', error.stack);
                    // Restore button state
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
                    showNotification('Error de autenticación', 'error');
                    document.getElementById('message').textContent = 'Nombre de usuario o contraseña incorrectos';
                });
            });
            
            // Notification function con estilo mejorado como el panel de admin
            function showNotification(message, type) {
                // Remove existing notifications
                const existingNotifications = document.querySelectorAll('.notification');
                existingNotifications.forEach(notification => notification.remove());
                
                // Create notification element
                const notification = document.createElement('div');
                notification.className = `notification fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 transition-all duration-500 transform translate-x-full flex items-center`;
                
                if (type === 'success') {
                    notification.classList.add('bg-green-100', 'text-green-800', 'border-l-4', 'border-green-500');
                    notification.innerHTML = `
                        <div class="flex-shrink-0 bg-green-500 rounded-full p-2 mr-3">
                            <i class="fas fa-check text-white"></i>
                        </div>
                        <div>
                            <p class="font-medium">¡Éxito!</p>
                            <p class="text-sm">${message}</p>
                        </div>
                    `;
                } else {
                    notification.classList.add('bg-red-100', 'text-red-800', 'border-l-4', 'border-red-500');
                    notification.innerHTML = `
                        <div class="flex-shrink-0 bg-red-500 rounded-full p-2 mr-3">
                            <i class="fas fa-exclamation-triangle text-white"></i>
                        </div>
                        <div>
                            <p class="font-medium">Error</p>
                            <p class="text-sm">${message}</p>
                        </div>
                    `;
                }
                
                // Add to DOM
                document.body.appendChild(notification);
                
                // Animate in
                setTimeout(() => {
                    notification.classList.remove('translate-x-full');
                    notification.classList.add('translate-x-0');
                }, 10);
                
                // Auto remove after delay
                setTimeout(() => {
                    notification.classList.remove('translate-x-0');
                    notification.classList.add('translate-x-full');
                    
                    setTimeout(() => {
                        notification.remove();
                    }, 500);
                }, 5000);
            }
        });    </script>
    
    <!-- DESHABILITADO footer include que puede cargar scripts adicionales -->
    <!-- {% include 'footer.html' %} -->
</body>
</html>
