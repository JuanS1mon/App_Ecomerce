<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Gestión de Carga
  </title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
  <script type="text/javascript">
   // Aplicar el modo oscuro al cargar la página
                window.onload = function() {
                    document.documentElement.classList.add('dark');
                    fetchData();
                }

                async function fetchData() {
                    const response = await fetch('/Carga/');
                    const data = await response.json();
                    const tableBody = document.getElementById('data-table-body');
                    tableBody.innerHTML = '';
                    data.forEach(item => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="border px-4 py-2">${item.campot1}</td>
                            <td class="border px-4 py-2">${item.campot2}</td>
                            <td class="border px-4 py-2">${item.campot3}</td>
                            <td class="border px-4 py-2">${item.campot4}</td>
                            <td class="border px-4 py-2">
                                <button class="bg-blue-500 text-white px-2 py-1" onclick="editItem(${item.campot1})">Editar</button>
                                <button class="bg-red-500 text-white px-2 py-1" onclick="deleteItem(${item.campot1})">Eliminar</button>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                }

                async function addItem(event) {
                    event.preventDefault();
                    const formData = {
                        campot1: parseInt(document.getElementById('campot1').value),
                        campot2: document.getElementById('campot2').value,
                        campot3: parseFloat(document.getElementById('campot3').value),
                        campot4: document.getElementById('campot4').checked
                    };
                    await fetch('/Carga/', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(formData)
                    });
                    fetchData();
                    document.getElementById('data-form').reset();
                }

                function editItem(id) {
                    fetch(`/Carga/id/${id}`)
                        .then(response => response.json())
                        .then(data => {
                            document.getElementById('edit-campot1').value = data.campot1;
                            document.getElementById('edit-campot2').value = data.campot2;
                            document.getElementById('edit-campot3').value = data.campot3;
                            document.getElementById('edit-campot4').checked = data.campot4;
                            document.getElementById('edit-modal').classList.remove('hidden');
                        });
                }

                function closeEditModal() {
                    document.getElementById('edit-modal').classList.add('hidden');
                }

                async function updateItem(event) {
                    event.preventDefault();
                    const id = document.getElementById('edit-campot1').value;
                    const updatedData = {
                        campot2: document.getElementById('edit-campot2').value,
                        campot3: parseFloat(document.getElementById('edit-campot3').value),
                        campot4: document.getElementById('edit-campot4').checked
                    };
                    await fetch(`/Carga/id/${id}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(updatedData)
                    });
                    closeEditModal();
                    fetchData();
                }

                async function deleteItem(id) {
                    await fetch(`/Carga/id/${id}`, { method: 'DELETE' });
                    fetchData();
                }
  </script>
 </head>
 <body class="p-4 bg-gray-900 text-white">
  <!-- Barra de navegación -->
  <nav class="bg-gray-800 p-4 w-full z-10">
   <div class="container mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-4">
     <a href="">
      <img alt="Logo" class="h-8 w-auto" src="static/img/logo_mapache.gif"/>
     </a>
     <span class="text-gray-400">
      /
     </span>
     <a class="text-white hover:text-gray-300" href="#about">
      Sobre la App
     </a>
     <span class="text-gray-400">
      /
     </span>
     <a class="text-white hover:text-gray-300" href="#noticias">
      Noticias
     </a>
     <span class="text-gray-400">
      /
     </span>
     <a class="text-white hover:text-gray-300" href="#testimonials">
      Testimonios
     </a>
     <span class="text-gray-400">
      /
     </span>
     <a class="text-white hover:text-gray-300" href="#Contacto">
      Contacto
     </a>
    </div>
    <div class="collapse navbar-collapse" id="navbarNav">
     <ul class="flex space-x-4">
      <li class="nav-item">
       <a class="nav-link text-gray-300 hover:text-white" href="/admin/page">
        Administracion
       </a>
      </li>
      <li class="nav-item">
       <a class="nav-link text-gray-300 hover:text-white" href="/news">
        Noticias
       </a>
      </li>
      <li class="nav-item">
       <a class="nav-link text-gray-300 hover:text-white" href="/loginpage">
        Iniciar Sesión
       </a>
      </li>
     </ul>
    </div>
   </div>
  </nav>
  <div class="flex justify-between items-center mb-4">
   <h1 class="text-2xl">
    Gestión de Carga
   </h1>
  </div>
  <form class="mb-4" id="data-form" onsubmit="addItem(event)">
   <div class="flex flex-wrap -mx-2">
    <div class="w-full md:w-1/4 px-2 mb-4">
     <label class="block">
      NroSuceso:
     </label>
     <input class="w-full border px-2 py-1 bg-gray-800 text-white" id="NroSuceso" required="True" type="number"/>
     <button class="bg-green-500 text-white px-4 py-2" type="submit">
      Agregar
     </button>
    </div>
    <div class="w-full md:w-1/4 px-2 mb-4">
     <label class="block">
      Fecha:
     </label>
     <input class="w-full border px-2 py-1 bg-gray-800 text-white" id="Fecha" required="True" type="text"/>
     <button class="bg-green-500 text-white px-4 py-2" type="submit">
      Agregar
     </button>
    </div>
    <div class="w-full md:w-1/4 px-2 mb-4">
     <label class="block">
      Origen:
     </label>
     <input class="w-full border px-2 py-1 bg-gray-800 text-white" id="Origen" required="True" type="text"/>
     <button class="bg-green-500 text-white px-4 py-2" type="submit">
      Agregar
     </button>
    </div>
    <div class="w-full md:w-1/4 px-2 mb-4">
     <label class="block">
      Tipo:
     </label>
     <input class="w-full border px-2 py-1 bg-gray-800 text-white" id="Tipo" required="True" type="text"/>
     <button class="bg-green-500 text-white px-4 py-2" type="submit">
      Agregar
     </button>
    </div>
    <div class="w-full md:w-1/4 px-2 mb-4">
     <label class="block">
      Caratula:
     </label>
     <input class="w-full border px-2 py-1 bg-gray-800 text-white" id="Caratula" required="True" type="text"/>
     <button class="bg-green-500 text-white px-4 py-2" type="submit">
      Agregar
     </button>
    </div>
    <div class="w-full md:w-1/4 px-2 mb-4">
     <label class="block">
      Clasificacion:
     </label>
     <input class="w-full border px-2 py-1 bg-gray-800 text-white" id="Clasificacion" required="True" type="text"/>
     <button class="bg-green-500 text-white px-4 py-2" type="submit">
      Agregar
     </button>
    </div>
    <div class="w-full md:w-1/4 px-2 mb-4">
     <label class="block">
      Estado:
     </label>
     <input class="w-full border px-2 py-1 bg-gray-800 text-white" id="Estado" required="True" type="text"/>
     <button class="bg-green-500 text-white px-4 py-2" type="submit">
      Agregar
     </button>
    </div>
   </div>
  </form>
  <table class="table-auto w-full border-collapse">
   <thead>
    <tr>
     <th class="border px-4 py-2">
      NroSuceso
     </th>
     <th class="border px-4 py-2">
      Fecha
     </th>
     <th class="border px-4 py-2">
      Origen
     </th>
     <th class="border px-4 py-2">
      Tipo
     </th>
     <th class="border px-4 py-2">
      Caratula
     </th>
     <th class="border px-4 py-2">
      Clasificacion
     </th>
     <th class="border px-4 py-2">
      Estado
     </th>
     <th class="border px-4 py-2">
      Acciones
     </th>
    </tr>
   </thead>
   <tbody id="data-table-body">
    &lt;!-- Los datos se cargarán aquí --&gt;
   </tbody>
  </table>
  <div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden" id="edit-modal">
   <div class="bg-gray-800 p-4 rounded w-96">
    <h2 class="text-xl mb-4">
     Editar Carga
    </h2>
    <form id="edit-form" onsubmit="updateItem(event)">
     <input id="edit-campot1" type="hidden"/>
     <div class="mb-2">
      <label>
       Fecha:
      </label>
      <input class="border px-2 py-1 w-full bg-gray-800 text-white" id="edit-Fecha" type="text"/>
     </div>
     <div class="mb-2">
      <label>
       Origen:
      </label>
      <input class="border px-2 py-1 w-full bg-gray-800 text-white" id="edit-Origen" type="text"/>
     </div>
     <div class="mb-2">
      <label>
       Tipo:
      </label>
      <input class="border px-2 py-1 w-full bg-gray-800 text-white" id="edit-Tipo" type="text"/>
     </div>
     <div class="mb-2">
      <label>
       Caratula:
      </label>
      <input class="border px-2 py-1 w-full bg-gray-800 text-white" id="edit-Caratula" type="text"/>
     </div>
     <div class="mb-2">
      <label>
       Clasificacion:
      </label>
      <input class="border px-2 py-1 w-full bg-gray-800 text-white" id="edit-Clasificacion" type="text"/>
     </div>
     <div class="mb-2">
      <label>
       Estado:
      </label>
      <input class="border px-2 py-1 w-full bg-gray-800 text-white" id="edit-Estado" type="text"/>
     </div>
     <div class="flex justify-end">
      <button class="mr-2 px-4 py-2" onclick="closeEditModal()" type="button" value="Cancelar">
      </button>
      <button class="bg-blue-500 text-white px-4 py-2" type="submit" value="Guardar">
      </button>
     </div>
    </form>
   </div>
  </div>
 </body>
</html>
