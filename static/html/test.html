
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>
        Gestión de Test
    </title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Aplicar el modo oscuro al cargar la página
        window.onload = function() {
            document.documentElement.classList.add('dark');
            fetchData();
        }

        async function fetchData() {
            const response = await fetch('/test/');
            const data = await response.json();
            const tableBody = document.getElementById('data-table-body');
            tableBody.innerHTML = '';
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="border px-4 py-2">${item.campot1}</td>
                    <td class="border px-4 py-2">${item.campot2}</td>
                    <td class="border px-4 py-2">${item.campot3}</td>
                    <td class="border px-4 py-2">${item.campot4}</td>
                    <td class="border px-4 py-2">
                        <button class="bg-blue-500 text-white px-2 py-1" onclick="editItem(${item.campot1})">Editar</button>
                        <button class="bg-red-500 text-white px-2 py-1" onclick="deleteItem(${item.campot1})">Eliminar</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function addItem(event) {
            event.preventDefault();
            const formData = {
                campot1: parseInt(document.getElementById('campot1').value),
                campot2: document.getElementById('campot2').value,
                campot3: parseFloat(document.getElementById('campot3').value),
                campot4: document.getElementById('campot4').checked
            };
            await fetch('/test/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(formData)
            });
            fetchData();
            document.getElementById('data-form').reset();
        }

        function editItem(id) {
            fetch(`/test/id/${id}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('edit-campot1').value = data.campot1;
                    document.getElementById('edit-campot2').value = data.campot2;
                    document.getElementById('edit-campot3').value = data.campot3;
                    document.getElementById('edit-campot4').checked = data.campot4;
                    document.getElementById('edit-modal').classList.remove('hidden');
                });
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function updateItem(event) {
            event.preventDefault();
            const id = document.getElementById('edit-campot1').value;
            const updatedData = {
                campot2: document.getElementById('edit-campot2').value,
                campot3: parseFloat(document.getElementById('edit-campot3').value),
                campot4: document.getElementById('edit-campot4').checked
            };
            await fetch(`/test/id/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(updatedData)
            });
            closeEditModal();
            fetchData();
        }

        async function deleteItem(id) {
            await fetch(`/test/id/${id}`, { method: 'DELETE' });
            fetchData();
        }

        // Manejar el cambio de selección de tabla
        document.getElementById("table-select").addEventListener("change", async function() {
            const tableName = this.value;

            // Obtener las columnas de la tabla seleccionada
            const columnsResponse = await fetch(`/analisis/columnas`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ table_name: tableName })
            });
            const columnsData = await columnsResponse.json();

            // Poblar el select de columnas (solo int y bigint)
            const columnSelect = document.getElementById("column-select");
            columnSelect.innerHTML = '<option value="" disabled selected>Selecciona una columna...</option>';
            columnsData.columns
                .filter(column => ['INTEGER', 'BIGINT'].includes(column.type.toUpperCase()))
                .forEach(column => {
                    columnSelect.innerHTML += `<option value="${column.name}">${column.name}</option>`;
                });

            // Poblar el select de campos de fecha (date, datetime, smalldatetime)
            const dateFieldSelect = document.getElementById("date_field");
            dateFieldSelect.innerHTML = '<option value="" disabled selected>Selecciona un campo de fecha...</option>';
            columnsData.columns
                .filter(column => ['DATE', 'DATETIME', 'SMALLDATETIME'].includes(column.type.toUpperCase()))
                .forEach(column => {
                    dateFieldSelect.innerHTML += `<option value="${column.name}">${column.name}</option>`;
                });

            // Poblar el select de campos adicionales (todos los tipos)
            const additionalFieldsSelects = document.querySelectorAll('select[name="additional_fields[]"]');
            additionalFieldsSelects.forEach(select => {
                select.innerHTML = '<option value="" disabled selected>Selecciona un campo...</option>';
                columnsData.columns.forEach(column => {
                    select.innerHTML += `<option value="${column.name}">${column.name}</option>`;
                });
            });
        });

        // Función para agregar un campo adicional
        function addField() {
            const container = document.getElementById('additional-fields');
            const field = document.createElement('div');
            field.className = 'mb-4 flex items-center';
            field.innerHTML = `
                <div class="flex-1">
                    <label for="additional_field" class="block text-gray-700 font-bold mb-2">Campo Adicional:</label>
                    <select name="additional_fields[]" class="block w-full px-4 py-2 border border-gray-300 rounded-md">
                        <option value="" disabled selected>Selecciona un campo...</option>
                    </select>
                </div>
                <button type="button" onclick="removeField(this)" class="ml-4 bg-red-500 text-white px-4 py-2 rounded-md self-end">Eliminar</button>
            `;
            container.appendChild(field);

            // Llenar el nuevo select con las columnas
            const tableName = document.getElementById("table-select").value;
            if (tableName) {
                fetch(`/analisis/columnas`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ table_name: tableName })
                })
                .then(response => response.json())
                .then(columnsData => {
                    const select = field.querySelector('select[name="additional_fields[]"]');
                    select.innerHTML = '<option value="" disabled selected>Selecciona un campo...</option>';
                    columnsData.columns.forEach(column => {
                        select.innerHTML += `<option value="${column.name}">${column.name}</option>`;
                    });
                });
            }
        }

        // Función para eliminar un campo adicional
        function removeField(button) {
            const field = button.parentElement;
            field.remove();
        }
    </script>
</head>
<body class="p-4 bg-gray-900 text-white">
    <!-- Barra de navegación -->
    <nav class="bg-gray-800 p-4 w-full z-10">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="">
                    <img src="static/img/logo_mapache.gif" alt="Logo" class="h-8 w-auto">
                </a>
                <span class="text-gray-400">/</span>
                <a href="#about" class="text-white hover:text-gray-300">Sobre la App</a>
                <span class="text-gray-400">/</span>
                <a href="#noticias" class="text-white hover:text-gray-300">Noticias</a>
                <span class="text-gray-400">/</span>
                <a href="#testimonials" class="text-white hover:text-gray-300">Testimonios</a>
                <span class="text-gray-400">/</span>
                <a href="#Contacto" class="text-white hover:text-gray-300">Contacto</a>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="flex space-x-4">
                    <li class="nav-item">
                        <a class="nav-link text-gray-300 hover:text-white" href="/admin/page">Administración</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-gray-300 hover:text-white" href="/news">Noticias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-gray-300 hover:text-white" href="/loginpage">Iniciar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="flex justify-between items-center mb-4">
        <h1 class="text-2xl">Gestión de Test</h1>
    </div>
    <form id="data-form" class="mb-4" onsubmit="addItem(event)">
        <div class="flex flex-wrap -mx-2">
            <div class="w-full md:w-1/4 px-2 mb-4">
                <label class="block">campot1:</label>
                <input id="campot1" type="number" class="w-full border px-2 py-1 bg-gray-800 text-white" required>
            </div>
            <div class="w-full md:w-1/4 px-2 mb-4">
                <label class="block">campot2:</label>
                <input id="campot2" type="text" class="w-full border px-2 py-1 bg-gray-800 text-white" required>
            </div>
            <div class="w-full md:w-1/4 px-2 mb-4">
                <label class="block">campot3:</label>
                <input id="campot3" type="number" step="any" class="w-full border px-2 py-1 bg-gray-800 text-white" required>
            </div>
            <div class="w-full md:w-1/4 px-2 mb-4 flex items-center">
                <label class="mr-2">campot4:</label>
                <input id="campot4" type="checkbox" class="w-4 h-4">
            </div>
            <div class="w-full md:w-1/4 px-2 mb-4">
                <button type="button" class="bg-blue-500 text-white px-4 py-2 rounded-md" onclick="addField()">
                    Agregar Campo Adicional
                </button>
            </div>
        </div>
        <div id="additional-fields">
        </div>
        <div>
            <button type="submit" class="bg-green-500 text-white px-4 py-2">Agregar</button>
        </div>
    </form>
    <table class="table-auto w-full border-collapse">
        <thead>
            <tr>
                <th class="border px-4 py-2">campot1</th>
                <th class="border px-4 py-2">campot2</th>
                <th class="border px-4 py-2">campot3</th>
                <th class="border px-4 py-2">campot4</th>
                <th class="border px-4 py-2">Acciones</th>
            </tr>
        </thead>
        <tbody id="data-table-body">
            <!-- Los datos se cargarán aquí -->
        </tbody>
    </table>
    <!-- Modal para editar -->
    <div id="edit-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-gray-800 p-4 rounded w-96">
            <h2 class="text-xl mb-4">Editar Test</h2>
            <form id="edit-form" onsubmit="updateItem(event)">
                <input type="hidden" id="edit-campot1">
                <div class="mb-2">
                    <label>campot2:</label>
                    <input id="edit-campot2" type="text" class="border px-2 py-1 w-full bg-gray-800 text-white" required>
                </div>
                <div class="mb-2">
                    <label>campot3:</label>
                    <input id="edit-campot3" type="number" step="any" class="border px-2 py-1 w-full bg-gray-800 text-white" required>
                </div>
                <div class="mb-2 flex items-center">
                    <label class="mr-2">campot4:</label>
                    <input id="edit-campot4" type="checkbox" class="w-4 h-4">
                </div>
                <div class="flex justify-end">
                    <button type="button" class="mr-2 px-4 py-2 bg-gray-500 text-white rounded" onclick="closeEditModal()">Cancelar</button>
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
