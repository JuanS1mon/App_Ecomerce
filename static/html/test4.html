<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <title>
   Gestión de Test4
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
  <script>
   window.onload = function() {
    document.documentElement.classList.add('dark');
    fetchData();
};

async function fetchData() {
    const response = await fetch('/test4/');
    const data = await response.json();
    const tableBody = document.getElementById('data-table-body');
    tableBody.innerHTML = '';
    data.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="border px-4 py-2">${item.codigo}</td><td class="border px-4 py-2">${item.nombre}</td><td class="border px-4 py-2">${item.numero}</td><td class="border px-4 py-2">${item.veri}</td>
            <td class="border px-4 py-2">
                <button class="bg-blue-500 text-white px-2 py-1" onclick="editItem(${item.codigo})">Editar</button>
                <button class="bg-red-500 text-white px-2 py-1" onclick="deleteItem(${item.codigo})">Eliminar</button>
            </td>
        `;
        tableBody.appendChild(row);
    });
}

async function addItem(event) {
    event.preventDefault();
    const formData = {
        codigo: parseInt(document.getElementById('codigo').value),
        fecha: document.getElementById('fecha').value,
        nombre: document.getElementById('nombre').value
    };
    try {
      const respuesta = await fetch('/test4/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(formData)
      });
      if (!respuesta.ok) {
        throw new Error("Error al crear test4");
      }
      console.log("Registro creado:", await respuesta.json());
      document.getElementById('data-form').reset();
      fetchData();
    } catch (error) {
      console.error(error);
    }
}

function editItem(id) {
    fetch(`/test4/id/${id}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('edit-codigo').value = data.codigo;
document.getElementById('edit-nombre').value = data.nombre;
document.getElementById('edit-numero').value = data.numero;
document.getElementById('edit-veri').checked = data.veri;
            document.getElementById('edit-modal').classList.remove('hidden');
        });
}

function closeEditModal() {
    document.getElementById('edit-modal').classList.add('hidden');
}

async function updateItem(event) {
    event.preventDefault();
    const id = document.getElementById('edit-codigo').value;
    const updatedData = {
        nombre: document.getElementById('edit-nombre').value, numero: parseInt(document.getElementById('edit-numero').value), veri: document.getElementById('edit-veri').checked
    };
    await fetch(`/test4/id/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(updatedData)
    });
    closeEditModal();
    fetchData();
}

async function deleteItem(id) {
    await fetch(`/test4/id/${id}`, { method: 'DELETE' });
    fetchData();
}
  </script>
 </head>
 <body class="p-4 bg-gray-900 text-white">
  <div class="flex justify-between items-center mb-4">
   <h1 class="text-2xl">
    Gestión de Test4
   </h1>
  </div>
  <form class="mb-4" id="data-form" onsubmit="addItem(event)">
   <div class="flex flex-wrap -mx-2">
    <div class="w-full md:w-1/4 px-2 mb-4">
     <label class="block">
      codigo:
     </label>
     <input class="w-full border px-2 py-1 bg-gray-800 text-white" id="codigo" required="required" type="number"/>
    </div>
    <div class="w-full md:w-1/4 px-2 mb-4">
     <label class="block">
      nombre:
     </label>
     <input class="w-full border px-2 py-1 bg-gray-800 text-white" id="nombre" type="text"/>
    </div>
    <div class="w-full md:w-1/4 px-2 mb-4">
     <label class="block">
      numero:
     </label>
     <input class="w-full border px-2 py-1 bg-gray-800 text-white" id="numero" required="required" type="number"/>
    </div>
    <div class="w-full md:w-1/4 px-2 mb-4">
     <div class="flex items-center">
      <label class="mr-2">
       veri:
      </label>
      <input class="w-4 h-4" id="veri" type="checkbox"/>
     </div>
    </div>
   </div>
  </form>
  <button class="bg-green-500 text-white px-4 py-2" type="submit">
   Agregar
  </button>
  <table class="table-auto w-full border-collapse">
   <thead>
    <tr>
     <th class="border px-4 py-2">
      codigo
     </th>
     <th class="border px-4 py-2">
      nombre
     </th>
     <th class="border px-4 py-2">
      numero
     </th>
     <th class="border px-4 py-2">
      veri
     </th>
     <th class="border px-4 py-2">
      Acciones
     </th>
    </tr>
   </thead>
   <tbody id="data-table-body">
    &lt;!-- Los datos se cargarán aquí --&gt;
   </tbody>
  </table>
  <div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden" id="edit-modal">
   <div class="bg-gray-800 p-4 rounded w-96">
    <h2 class="text-xl mb-4">
     Editar Test4
    </h2>
    <form id="edit-form" onsubmit="updateItem(event)">
     <input id="edit-codigo" type="hidden"/>
     <div class="mb-2">
      <label>
       nombre:
      </label>
      <input class="border px-2 py-1 w-full bg-gray-800 text-white" id="edit-nombre" type="text"/>
     </div>
     <div class="mb-2">
      <label>
       numero:
      </label>
      <input class="border px-2 py-1 w-full bg-gray-800 text-white" id="edit-numero" type="number"/>
     </div>
     <div class="mb-2">
      <div class="flex items-center">
       <label class="mr-2">
        veri:
       </label>
       <input class="w-4 h-4" id="edit-veri" type="checkbox"/>
      </div>
     </div>
     <div class="flex justify-end">
      <button class="mr-2 px-4 py-2" onclick="closeEditModal()" type="button">
       Cancelar
      </button>
      <button class="bg-blue-500 text-white px-4 py-2" type="submit">
       Guardar
      </button>
     </div>
    </form>
   </div>
  </div>
 </body>
</html>
