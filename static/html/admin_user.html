<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil de Usuario</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <!-- Barra de navegación -->
  <nav class="bg-gray-800 p-4 relative z-30">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <a href="">
          <img src="../static/img/logo_mapache.gif" alt="Logo" class="h-8 w-auto">
        </a>
        <a href="/index" class="text-white text-lg font-semibold hover:text-gray-300">Inicio</a>
        <span class="text-gray-400">/</span>
        <span class="text-white text-lg font-semibold">Admin</span>
      </div>
      <div class="flex items-center space-x-4 relative">
        <a href="/docs" class="text-white hover:text-gray-300">Documentación</a>
        <a href="/generar" class="text-white hover:text-gray-300">Generar API</a>
        <a href="/migraciones/page" class="text-white hover:text-gray-300">Migraciones</a>
        <div class="relative">
          <button id="perfil" class="flex items-center focus:outline-none">
            <div class="w-8 h-8 bg-gray-500 rounded-full flex items-center justify-center text-white">
              {{ user.nombre[0]|upper }}
            </div>
            <svg class="ml-2 w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.586l3.71-4.354a.75.75 0 011.14.976l-4.25 5A.75.75 0 0110 13a.75.75 0 01-.6-.3l-4.25-5a.75.75 0 01.08-1.06z" clip-rule="evenodd" />
            </svg>
          </button>
          <div id="menu-perfil" class="hidden absolute right-0 mt-2 w-48 bg-gray-800 rounded-md shadow-lg z-50">
            <a href="/perfil" class="block px-4 py-2 text-sm text-white hover:bg-gray-700">Perfil de usuario</a>
            <form action="/logout" method="post">
              <button type="submit" class="w-full text-left px-4 py-2 text-sm text-white hover:bg-gray-700">Logout</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Contenido de la página -->
  <div class="container mx-auto my-10 p-5 bg-white rounded shadow max-w-lg">
    <h1 class="text-2xl font-bold mb-5 text-center">Perfil de Usuario</h1>
    
    <div class="flex flex-col items-center space-y-4 mb-5">
      <h2 class="text-xl font-semibold">{{ user.usuario }}</h2>
      <img src="{{ user.profile_image_url }}" alt="Imagen de Perfil" class="w-24 h-24 rounded-full object-cover">
      <div class="text-center">
      <p class="text-gray-600">{{ user.mail }}</p>
      </div>
    </div>
    <form action="/admin/perfil" method="post" class="space-y-4">
      <!-- Nombre -->
      <div>
        <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
        <input type="text" name="nombre" id="nombre" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" value="{{ user.nombre }}">
      </div>
      <!-- Teléfono -->
      <div>
        <label for="telefono" class="block text-sm font-medium text-gray-700">Teléfono</label>
        <input type="text" name="telefono" id="telefono" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" value="{{ user.telefono }}">
      </div>
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" name="email" id="email" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" value="{{ user.mail }}">
      </div>
      <!-- Dirección -->
      <div>
        <label for="direccion" class="block text-sm font-medium text-gray-700">Dirección</label>
        <input type="text" name="direccion" id="direccion" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" value="{{ user.direccion }}">
      </div>
      <!-- Fecha de Nacimiento -->
      <div>
        <label for="fecha_nacimiento" class="block text-sm font-medium text-gray-700">Fecha de Nacimiento</label>
        <input type="date" name="fecha_nacimiento" id="fecha_nacimiento" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" value="{{ user.fecha_nacimiento }}">
      </div>
      <!-- Cambiar Contraseña -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Nueva Contraseña</label>
        <input type="password" name="password" id="password" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
      </div>
      <!-- Confirmar Contraseña -->
      <div>
        <label for="confirm_password" class="block text-sm font-medium text-gray-700">Confirmar Contraseña</label>
        <input type="password" name="confirm_password" id="confirm_password" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
      </div>
      <!-- Botón de Envío -->
      <div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Actualizar Perfil</button>
      </div>
    </form>
  </div>
  {% include 'footer.html' %}
  <script>
    const perfilBtn = document.getElementById('perfil');
    const perfilMenu = document.getElementById('menu-perfil');

    perfilBtn.addEventListener('click', function(event) {
      event.preventDefault();
      perfilMenu.classList.toggle('hidden');
    });

    window.addEventListener('click', function(event) {
      if (!perfilBtn.contains(event.target) && !perfilMenu.contains(event.target)) {
        perfilMenu.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
