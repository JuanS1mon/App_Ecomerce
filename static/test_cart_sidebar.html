<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Carrito Sidebar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold mb-4">Prueba del Carrito Sidebar</h1>

        <button id="cart-button" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center" onclick="toggleCart()">
            <i class="fas fa-shopping-cart mr-2"></i>
            Carrito
            <span class="ml-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center" id="cart-count">0</span>
        </button>

        <div class="mt-8">
            <h2 class="text-lg font-semibold mb-4">Funciones de prueba:</h2>
            <button onclick="debugCartDetailed()" class="bg-gray-600 text-white px-4 py-2 rounded mr-2">Debug Carrito</button>
            <button onclick="cartInfo()" class="bg-green-600 text-white px-4 py-2 rounded mr-2">Info Carrito</button>
        </div>
    </div>

    <!-- Sidebar del Carrito -->
    <div class="cart-sidebar fixed top-0 right-0 h-full w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50" id="cart-sidebar">
        <div class="flex flex-col h-full">
            <!-- Header del carrito -->
            <div class="bg-blue-600 text-white p-4 flex justify-between items-center">
                <h2 class="text-lg font-semibold flex items-center">
                    <i class="fas fa-shopping-cart mr-2"></i>
                    Mi Carrito
                </h2>
                <button class="text-white hover:text-blue-200 transition-colors" onclick="toggleCart()">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Contenido del carrito -->
            <div class="flex-1 overflow-y-auto p-4" id="cart-items">
                <div class="text-center text-gray-500 py-8" id="empty-cart">
                    <i class="fas fa-shopping-cart text-4xl mb-4"></i>
                    <p>Tu carrito está vacío</p>
                </div>
            </div>

            <!-- Footer del carrito -->
            <div class="border-t bg-gray-50 p-4" id="cart-footer" style="display: none;">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-lg font-semibold">Total:</span>
                    <span class="text-lg font-bold text-blue-600" id="cart-total">$0</span>
                </div>
                <button class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors font-semibold" onclick="window.location.href='/ecomerce/checkout'">
                    <i class="fas fa-credit-card mr-2"></i>
                    Proceder al Pago
                </button>
            </div>
        </div>
    </div>

    <!-- Overlay para cerrar el carrito -->
    <div class="cart-overlay fixed inset-0 bg-black bg-opacity-50 z-40 hidden" id="cart-overlay" onclick="toggleCart()"></div>

    <!-- Scripts -->
    <script src="/static/ecomerce/carrito.js"></script>
    <script>
        // Inicializar carrito cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM cargado, inicializando carrito...');
            if (window.cart && typeof window.cart.initCart === 'function') {
                window.cart.initCart();
            }
        });
    </script>
</body>
</html>
