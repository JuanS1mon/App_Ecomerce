<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Nueva Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="/static/js/components.js"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .form-input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            pointer-events: none;
        }
        
        .input-with-icon {
            padding-left: 40px !important;
        }
        
        .form-field {
            transition: all 0.3s ease;
        }
        
        .form-field:focus-within {
            transform: translateY(-2px);
        }
        
        .form-field:focus-within label {
            color: #667eea;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animated-form > div {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        .animated-form > div:nth-child(1) { animation-delay: 0.1s; }
        .animated-form > div:nth-child(2) { animation-delay: 0.2s; }
        .animated-form > div:nth-child(3) { animation-delay: 0.3s; }
        
        .password-strength {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .strength-weak { background-color: #ef4444; width: 25%; }
        .strength-medium { background-color: #f59e0b; width: 50%; }
        .strength-strong { background-color: #10b981; width: 75%; }
        .strength-very-strong { background-color: #059669; width: 100%; }
        
        .icon-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 3rem;
            width: 3rem;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar - Se cargará dinámicamente -->
    <div id="navbar-container"></div>

    <!-- Contenido principal -->
    <div class="container mx-auto p-8 flex-grow">
        <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md card-hover border border-gray-100">
            <div class="text-center mb-8">
                <div class="icon-circle bg-green-100 text-green-600 mx-auto mb-4">
                    <i class="fas fa-lock text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Nueva Contraseña</h1>
                <p class="text-gray-500 mt-2">Ingresa tu nueva contraseña para completar el proceso</p>
            </div>
            
            <!-- Mensaje de error del token -->
            <div id="token-error" class="hidden mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                <span id="token-error-message">El enlace ha expirado o es inválido. Solicita un nuevo enlace de recuperación.</span>
                <div class="mt-2">
                    <a href="/reset-password" class="text-red-600 hover:text-red-800 underline">
                        Solicitar nuevo enlace
                    </a>
                </div>
            </div>
            
            <form id="confirm_reset_form" class="space-y-5 animated-form">
                <div class="form-field relative">
                    <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-key"></i>
                        </span>
                        <input type="password" id="new_password" name="new_password" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required minlength="3">
                        <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600" onclick="togglePassword('new_password')">
                            <i class="fas fa-eye" id="new_password_icon"></i>
                        </button>
                    </div>
                    <!-- Indicador de fortaleza de contraseña -->
                    <div class="mt-2">
                        <div class="bg-gray-200 rounded-full h-1">
                            <div id="password-strength" class="password-strength bg-gray-300"></div>
                        </div>
                        <p id="password-strength-text" class="text-xs text-gray-500 mt-1">Ingresa una contraseña</p>
                    </div>
                </div>
                
                <div class="form-field relative">
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-check-double"></i>
                        </span>
                        <input type="password" id="confirm_password" name="confirm_password" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600" onclick="togglePassword('confirm_password')">
                            <i class="fas fa-eye" id="confirm_password_icon"></i>
                        </button>
                    </div>
                    <p id="password-match-text" class="text-xs mt-1 hidden"></p>
                </div>
                
                <div>
                    <button id="submit_button" type="submit" class="w-full flex justify-center items-center gradient-bg text-white py-2 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-300 font-medium text-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        <i class="fas fa-save mr-2"></i>
                        Cambiar Contraseña
                    </button>
                </div>
                
                <!-- Mensaje de error -->
                <div id="message" class="text-center text-red-500 font-medium"></div>
                
                <div class="text-center mt-6">
                    <a href="/loginpage" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
                        <i class="fas fa-arrow-left mr-1"></i> Volver a iniciar sesión
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Obtener token de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.addEventListener('DOMContentLoaded', () => {
            // Cargar componentes
            if (window.loadComponents) {
                loadComponents();
                setTimeout(() => {
                    if (typeof updateNavigation === 'function') {
                        updateNavigation('/confirm-password-reset');
                    }
                }, 100);
            }

            // Verificar si hay token
            if (!token) {
                document.getElementById('token-error').classList.remove('hidden');
                document.getElementById('confirm_reset_form').style.display = 'none';
                return;
            }

            const form = document.getElementById('confirm_reset_form');
            const submitButton = document.getElementById('submit_button');
            const newPasswordInput = document.getElementById('new_password');
            const confirmPasswordInput = document.getElementById('confirm_password');
            
            // Validación de fortaleza de contraseña
            newPasswordInput.addEventListener('input', function() {
                checkPasswordStrength(this.value);
                checkPasswordMatch();
            });

            confirmPasswordInput.addEventListener('input', checkPasswordMatch);
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                // Validaciones
                if (newPassword.length < 3) {
                    showError('La contraseña debe tener al menos 3 caracteres');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showError('Las contraseñas no coinciden');
                    return;
                }
                
                // Guarda el texto original del botón
                const originalText = submitButton.innerHTML;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Cambiando...';
                submitButton.disabled = true;
                
                // Enviar solicitud al servidor
                fetch('/confirm-password-reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => Promise.reject(err));
                    }
                    return response.json();
                })
                .then(data => {
                    // Contraseña cambiada exitosamente
                    showNotification('¡Contraseña cambiada exitosamente! Serás redirigido al login.', 'success');
                    
                    // Redirigir al login después de 3 segundos
                    setTimeout(() => {
                        window.location.href = '/loginpage';
                    }, 3000);
                })
                .catch(error => {
                    console.error('Error:', error);
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
                    
                    const errorMessage = error.detail || error.message || 'Error al cambiar la contraseña';
                    
                    if (errorMessage.includes('token') || errorMessage.includes('expirado') || errorMessage.includes('inválido')) {
                        document.getElementById('token-error').classList.remove('hidden');
                        document.getElementById('confirm_reset_form').style.display = 'none';
                    } else {
                        showError(errorMessage);
                    }
                });
            });
        });

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + '_icon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('password-strength');
            const strengthText = document.getElementById('password-strength-text');
            
            let strength = 0;
            let message = '';
            
            if (password.length >= 3) strength++;
            if (password.length >= 6) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            strengthBar.className = 'password-strength';
            
            switch(strength) {
                case 0:
                case 1:
                    strengthBar.classList.add('strength-weak');
                    message = 'Contraseña débil';
                    break;
                case 2:
                    strengthBar.classList.add('strength-medium');
                    message = 'Contraseña media';
                    break;
                case 3:
                case 4:
                    strengthBar.classList.add('strength-strong');
                    message = 'Contraseña fuerte';
                    break;
                case 5:
                    strengthBar.classList.add('strength-very-strong');
                    message = 'Contraseña muy fuerte';
                    break;
            }
            
            strengthText.textContent = message;
        }

        function checkPasswordMatch() {
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const matchText = document.getElementById('password-match-text');
            
            if (confirmPassword.length > 0) {
                if (newPassword === confirmPassword) {
                    matchText.textContent = '✓ Las contraseñas coinciden';
                    matchText.className = 'text-xs mt-1 text-green-600';
                    matchText.classList.remove('hidden');
                } else {
                    matchText.textContent = '✗ Las contraseñas no coinciden';
                    matchText.className = 'text-xs mt-1 text-red-600';
                    matchText.classList.remove('hidden');
                }
            } else {
                matchText.classList.add('hidden');
            }
        }

        function showError(message) {
            document.getElementById('message').textContent = message;
        }

        function showNotification(message, type) {
            const existingNotifications = document.querySelectorAll('.notification');
            existingNotifications.forEach(notification => notification.remove());
            
            const notification = document.createElement('div');
            notification.className = `notification fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 transition-all duration-500 transform translate-x-full flex items-center`;
            
            if (type === 'success') {
                notification.classList.add('bg-green-100', 'text-green-800', 'border-l-4', 'border-green-500');
                notification.innerHTML = `
                    <div class="flex-shrink-0 bg-green-500 rounded-full p-2 mr-3">
                        <i class="fas fa-check text-white"></i>
                    </div>
                    <div>
                        <p class="font-medium">¡Éxito!</p>
                        <p class="text-sm">${message}</p>
                    </div>
                `;
            } else {
                notification.classList.add('bg-red-100', 'text-red-800', 'border-l-4', 'border-red-500');
                notification.innerHTML = `
                    <div class="flex-shrink-0 bg-red-500 rounded-full p-2 mr-3">
                        <i class="fas fa-exclamation-triangle text-white"></i>
                    </div>
                    <div>
                        <p class="font-medium">Error</p>
                        <p class="text-sm">${message}</p>
                    </div>
                `;
            }
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.remove('translate-x-full');
                notification.classList.add('translate-x-0');
            }, 10);
            
            setTimeout(() => {
                notification.classList.remove('translate-x-0');
                notification.classList.add('translate-x-full');
                
                setTimeout(() => {
                    notification.remove();
                }, 500);
            }, 5000);
        }
    </script>
</body>
</html>
