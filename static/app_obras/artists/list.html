<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Artistas - Sistema de Obras de Arte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="fas fa-palette"></i> Listado de Artistas</h1>
                    <a href="/app_obras/artists/html/create" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Nuevo Artista
                    </a>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre Completo</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for artist in artists %}
                                    <tr>
                                        <td>{{ artist.id }}</td>
                                        <td>{{ artist.full_name }}</td>
                                        <td>
                                            <a href="/app_obras/artists/html/edit/{{ artist.id }}" class="btn btn-sm btn-outline-primary">
                                                <i class="fas fa-edit"></i> Editar
                                            </a>
                                            <button class="btn btn-sm btn-outline-danger" onclick="deleteArtist({{ artist.id }})">
                                                <i class="fas fa-trash"></i> Eliminar
                                            </button>
                                        </td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function deleteArtist(id) {
            if (confirm('¿Está seguro de que desea eliminar este artista?')) {
                try {
                    const response = await fetch(`/app_obras/artists/id/${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Error al eliminar el artista');
                    }
                } catch (error) {
                    alert('Error al eliminar el artista');
                }
            }
        }
    </script>
</body>
</html>
