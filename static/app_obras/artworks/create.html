<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Obra de Arte - Sistema de Obras de Arte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-plus"></i> Crear Nueva Obra de Arte</h3>
                    </div>
                    <div class="card-body">
                        <form id="artworkForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="inventory_code" class="form-label">Código de Inventario *</label>
                                        <input type="text" class="form-control" id="inventory_code" name="inventory_code" required placeholder="CP.2020.001">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="title" class="form-label">Título *</label>
                                        <input type="text" class="form-control" id="title" name="title" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="nickname" class="form-label">Nombre Cariñoso</label>
                                        <input type="text" class="form-control" id="nickname" name="nickname">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="creation_year" class="form-label">Año de Creación *</label>
                                        <input type="number" class="form-control" id="creation_year" name="creation_year" required min="1900" max="2030">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="technique" class="form-label">Técnica *</label>
                                        <input type="text" class="form-control" id="technique" name="technique" required placeholder="Óleo sobre tela">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="materials" class="form-label">Materiales *</label>
                                        <input type="text" class="form-control" id="materials" name="materials" required placeholder="Tela, óleo, barniz">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="dimensions" class="form-label">Dimensiones *</label>
                                        <input type="text" class="form-control" id="dimensions" name="dimensions" required placeholder="40x50cm">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="photo_credit" class="form-label">Crédito Fotográfico</label>
                                        <input type="text" class="form-control" id="photo_credit" name="photo_credit">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="thumbnail_url" class="form-label">URL de Imagen</label>
                                        <input type="url" class="form-control" id="thumbnail_url" name="thumbnail_url">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="technical_sheet_url" class="form-label">URL Ficha Técnica</label>
                                        <input type="url" class="form-control" id="technical_sheet_url" name="technical_sheet_url">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="internal_notes" class="form-label">Notas Internas</label>
                                <textarea class="form-control" id="internal_notes" name="internal_notes" rows="3"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="is_available" name="is_available" checked>
                                        <label class="form-check-label" for="is_available">
                                            Disponible
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="is_sold" name="is_sold">
                                        <label class="form-check-label" for="is_sold">
                                            Vendida
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="is_secondary_market" name="is_secondary_market">
                                        <label class="form-check-label" for="is_secondary_market">
                                            Mercado Secundario
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a href="/app_obras/artworks/html/" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Volver
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Guardar Obra
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('artworkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                inventory_code: document.getElementById('inventory_code').value,
                title: document.getElementById('title').value,
                nickname: document.getElementById('nickname').value || null,
                creation_year: parseInt(document.getElementById('creation_year').value),
                technique: document.getElementById('technique').value,
                materials: document.getElementById('materials').value,
                dimensions: document.getElementById('dimensions').value,
                photo_credit: document.getElementById('photo_credit').value || null,
                thumbnail_url: document.getElementById('thumbnail_url').value || null,
                technical_sheet_url: document.getElementById('technical_sheet_url').value || null,
                internal_notes: document.getElementById('internal_notes').value || null,
                is_available: document.getElementById('is_available').checked,
                is_sold: document.getElementById('is_sold').checked,
                is_secondary_market: document.getElementById('is_secondary_market').checked,
                artist_id: 1, // Temporal - necesitarás agregar un select para artistas
                state_id: 1   // Temporal - necesitarás agregar un select para estados
            };

            try {
                const response = await fetch('/app_obras/artworks/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    window.location.href = '/app_obras/artworks/html/';
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.detail);
                }
            } catch (error) {
                alert('Error al crear la obra de arte');
            }
        });
    </script>
</body>
</html>
