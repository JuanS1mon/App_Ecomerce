<!-- templates/news.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    {% include 'head.html' %}
    <div class="container">
        <h1 class="mt-5">Noticias</h1>
        <div class="mb-3">
            <a href="/create_blog" class="btn btn-primary">Crear Nuevo Blog</a>
        </div>
        <ul class="list-group">
            {% for post in blog_posts %}
            <li class="list-group-item">
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
                <small>Creado en: {{ post.created_at }}</small>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
