<!-- templates/news.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Barra de navegación -->
    <nav class="bg-gray-800 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="/index" class="text-white text-lg font-semibold hover:text-gray-300">Inicio</a>
                <span class="text-gray-400">/</span>
                <span class="text-white text-lg font-semibold">Noticias</span>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 mt-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Noticias</h1>
            <a href="/create_blog" class="bg-blue-500 text-white py-2 px-4 rounded-lg shadow-md hover:bg-blue-600 transition duration-300">Crear Nuevo Blog</a>
        </div>
        <div class="space-y-6">
            {% for post in blog_posts|sort(attribute='created_at', reverse=True) %}
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-2">{{ post.title }}</h2>
                <p class="text-gray-700 mb-4">{{ post.content }}</p>
                <small class="text-gray-500">Creado en: {{ post.created_at }}</small>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
