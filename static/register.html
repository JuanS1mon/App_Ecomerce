<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="/static/js/components.js"></script>
    <style>
        /* Estética actualizada similar al panel de administración */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .form-input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            pointer-events: none;
        }
        
        .input-with-icon {
            padding-left: 40px !important;
        }
        
        .form-field {
            transition: all 0.3s ease;
        }
        
        .form-field:focus-within {
            transform: translateY(-2px);
        }
        
        .form-field:focus-within label {
            color: #667eea;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animated-form > div {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        .animated-form > div:nth-child(1) { animation-delay: 0.1s; }
        .animated-form > div:nth-child(2) { animation-delay: 0.2s; }
        .animated-form > div:nth-child(3) { animation-delay: 0.3s; }
        .animated-form > div:nth-child(4) { animation-delay: 0.4s; }
        .animated-form > div:nth-child(5) { animation-delay: 0.5s; }
        .animated-form > div:nth-child(6) { animation-delay: 0.6s; }
        .animated-form > div:nth-child(7) { animation-delay: 0.7s; }
        
        .btn-submit {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .btn-submit:after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg, 
                rgba(255, 255, 255, 0) 10%, 
                rgba(255, 255, 255, 0.1) 30%, 
                rgba(255, 255, 255, 0.5) 50%, 
                rgba(255, 255, 255, 0.1) 70%, 
                rgba(255, 255, 255, 0) 90%
            );
            transform: rotate(45deg) translate(-100%, -100%);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: rotate(45deg) translate(-100%, -100%); }
            100% { transform: rotate(45deg) translate(100%, 100%); }
        }
        
        .card-shine {
            position: relative;
            overflow: hidden;
        }
        
        .card-shine:before {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 100%
            );
            transform: skewX(-25deg);
            transition: all 0.75s;
        }
        
        .card-shine:hover:before {
            animation: shine-effect 1.5s;
        }
        
        @keyframes shine-effect {
            100% { left: 125%; }
        }
        
        /* Estilos adicionales según el panel de admin */
        .icon-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 3rem;
            width: 3rem;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar - Se cargará dinámicamente -->
    <div id="navbar-container"></div>

    <!-- Contenido principal -->
    <div class="container mx-auto p-8 flex-grow">
        <div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-md card-hover border border-gray-100">
            <div class="text-center mb-8">
                <div class="icon-circle bg-indigo-100 text-indigo-600 mx-auto mb-4">
                    <i class="fas fa-user-plus text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Crear una cuenta</h1>
                <p class="text-gray-500 mt-2">Completa el formulario para registrarte</p>
            </div>
            
            <form id="register_form" class="space-y-5 animated-form">
                <div class="form-field relative">
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" id="nombre" name="nombre" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                </div>
                
                <div class="form-field relative">
                    <label for="usuario" class="block text-sm font-medium text-gray-700 mb-1">Nombre de usuario</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-at"></i>
                        </span>
                        <input type="text" id="usuario" name="usuario" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                </div>
                
                <div class="form-field relative">
                    <label for="clave" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="clave" name="clave" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <button type="button" id="toggle-password" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Mínimo 8 caracteres con letras y números</p>
                </div>
                
                <div class="form-field relative">
                    <label for="mail" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                    <div class="relative">
                        <span class="form-input-icon">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" id="mail" name="mail" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    </div>
                </div>
                
                <div class="form-field relative">
                    <label for="telefono" class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                    <div class="flex space-x-2">
                        <div class="relative w-1/3">
                            <select id="codigo_pais" name="codigo_pais" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-white">
                                <option value="+54">+54 (AR)</option>
                                <option value="+591">+591 (BO)</option>
                                <option value="+55">+55 (BR)</option>
                                <option value="+56">+56 (CL)</option>
                                <option value="+57">+57 (CO)</option>
                                <option value="+506">+506 (CR)</option>
                                <option value="+53">+53 (CU)</option>
                                <option value="+593">+593 (EC)</option>
                                <option value="+503">+503 (SV)</option>
                                <option value="+502">+502 (GT)</option>
                                <option value="+504">+504 (HN)</option>
                                <option value="+52">+52 (MX)</option>
                                <option value="+505">+505 (NI)</option>
                                <option value="+507">+507 (PA)</option>
                                <option value="+595">+595 (PY)</option>
                                <option value="+51">+51 (PE)</option>
                                <option value="+1">+1 (DO)</option>
                                <option value="+598">+598 (UY)</option>
                                <option value="+58">+58 (VE)</option>
                            </select>
                        </div>
                        <div class="relative w-2/3">
                            <span class="form-input-icon">
                                <i class="fas fa-phone"></i>
                            </span>
                            <input type="text" id="telefono" name="telefono" class="input-with-icon mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Número sin 0 ni 15">
                        </div>
                    </div>
                </div>
                
                <div class="mt-8">
                    <button type="submit" class="btn-submit w-full flex justify-center items-center gradient-bg text-white py-2 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-300 font-medium text-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        <i class="fas fa-user-plus mr-2"></i>
                        Crear cuenta
                    </button>
                </div>
                
                <!-- Más opciones como en el panel de admin -->
                <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <a href="/loginpage" class="flex items-center p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors group text-center justify-center">
                        <i class="fas fa-sign-in-alt mr-2 text-indigo-500 group-hover:text-indigo-600"></i>
                        <span class="text-sm">Iniciar sesión</span>
                    </a>
                    <a href="/ayuda" class="flex items-center p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors group text-center justify-center">
                        <i class="fas fa-question-circle mr-2 text-blue-500 group-hover:text-blue-600"></i>
                        <span class="text-sm">Ayuda y soporte</span>
                    </a>
                </div>
            </form>
        </div>
        
        <!-- Información adicional similar al panel de admin -->
        <div class="mt-6 max-w-lg mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-4">
            <div class="flex items-center text-sm text-gray-600">
                <div class="flex-shrink-0 bg-blue-100 rounded-full p-2 mr-3">
                    <i class="fas fa-shield-alt text-blue-500"></i>
                </div>
                <p>Tus datos están seguros y protegidos según nuestra política de privacidad.</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle password visibility
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('clave');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    // Toggle icon
                    const iconClass = type === 'password' ? 'fa-eye' : 'fa-eye-slash';
                    this.querySelector('i').className = `fas ${iconClass}`;
                });
            }
            
            // Form submission
            document.getElementById('register_form').addEventListener('submit', function(event) {
                event.preventDefault();

                const submitButton = this.querySelector('button[type="submit"]');
                const originalText = submitButton.innerHTML;
                
                // Show loading state
                submitButton.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Procesando...';
                submitButton.disabled = true;

                let formData = new FormData(document.getElementById('register_form'));
                let codigoPais = formData.get('codigo_pais');
                let telefono = formData.get('telefono');
                let telefonoCompleto = codigoPais + telefono;

                fetch('/user/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        'nombre': formData.get('nombre'),
                        'usuario': formData.get('usuario'),
                        'clave': formData.get('clave'),
                        'mail': formData.get('mail'),
                        'telefono': telefonoCompleto,
                        'activo': true  // Añadir el campo activo
                    })
                })
                .then(response => response.json())
                .then(data => {
                    // Restore button state
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
                    
                    if (data.detail) {
                        showNotification(data.detail, 'error');
                    } else {
                        showNotification('Registro exitoso. Por favor, revise su correo electrónico para activar su cuenta.', 'success');
                        setTimeout(() => {
                            window.location.href = '/loginpage';
                        }, 2000);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
                    showNotification('Error en el registro', 'error');
                });
            });
            
            // Notification function con estilo mejorado como el panel de admin
            function showNotification(message, type) {
                // Remove existing notifications
                const existingNotifications = document.querySelectorAll('.notification');
                existingNotifications.forEach(notification => notification.remove());
                
                // Create notification element
                const notification = document.createElement('div');
                notification.className = `notification fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 transition-all duration-500 transform translate-x-full flex items-center`;
                
                if (type === 'success') {
                    notification.classList.add('bg-green-100', 'text-green-800', 'border-l-4', 'border-green-500');
                    notification.innerHTML = `
                        <div class="flex-shrink-0 bg-green-500 rounded-full p-2 mr-3">
                            <i class="fas fa-check text-white"></i>
                        </div>
                        <div>
                            <p class="font-medium">¡Éxito!</p>
                            <p class="text-sm">${message}</p>
                        </div>
                    `;
                } else {
                    notification.classList.add('bg-red-100', 'text-red-800', 'border-l-4', 'border-red-500');
                    notification.innerHTML = `
                        <div class="flex-shrink-0 bg-red-500 rounded-full p-2 mr-3">
                            <i class="fas fa-exclamation-triangle text-white"></i>
                        </div>
                        <div>
                            <p class="font-medium">Error</p>
                            <p class="text-sm">${message}</p>
                        </div>
                    `;
                }
                
                // Add to DOM
                document.body.appendChild(notification);
                
                // Animate in
                setTimeout(() => {
                    notification.classList.remove('translate-x-full');
                    notification.classList.add('translate-x-0');
                }, 10);
                
                // Auto remove after delay
                setTimeout(() => {
                    notification.classList.remove('translate-x-0');
                    notification.classList.add('translate-x-full');
                    
                    setTimeout(() => {
                        notification.remove();
                    }, 500);
                }, 5000);
            }
        });
    </script>
    
    {% include 'footer.html' %}
</body>
</html>
