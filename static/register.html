<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Barra de navegación -->
    <nav class="bg-gray-800 p-4 z-30 relative">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="/index" class="text-white text-lg font-semibold hover:text-gray-300">Inicio</a>
                <span class="text-gray-400">/</span>
                <span class="text-white text-lg font-semibold">Registro</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/loginpage" class="text-white hover:text-gray-300">Iniciar Sesión</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mx-auto p-8">
        <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold mb-4 text-center">Registro de Usuario</h1>
            <form id="register_form" class="space-y-4">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="usuario" class="block text-sm font-medium text-gray-700">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="clave" class="block text-sm font-medium text-gray-700">Contraseña:</label>
                    <input type="password" id="clave" name="clave" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="mail" class="block text-sm font-medium text-gray-700">Correo Electrónico:</label>
                    <input type="email" id="mail" name="mail" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="codigo_pais" class="block text-sm font-medium text-gray-700">Código de País:</label>
                    <select id="codigo_pais" name="codigo_pais" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="+54">+54 (Argentina)</option>
                        <option value="+591">+591 (Bolivia)</option>
                        <option value="+55">+55 (Brasil)</option>
                        <option value="+56">+56 (Chile)</option>
                        <option value="+57">+57 (Colombia)</option>
                        <option value="+506">+506 (Costa Rica)</option>
                        <option value="+53">+53 (Cuba)</option>
                        <option value="+593">+593 (Ecuador)</option>
                        <option value="+503">+503 (El Salvador)</option>
                        <option value="+502">+502 (Guatemala)</option>
                        <option value="+504">+504 (Honduras)</option>
                        <option value="+52">+52 (México)</option>
                        <option value="+505">+505 (Nicaragua)</option>
                        <option value="+507">+507 (Panamá)</option>
                        <option value="+595">+595 (Paraguay)</option>
                        <option value="+51">+51 (Perú)</option>
                        <option value="+1">+1 (República Dominicana)</option>
                        <option value="+598">+598 (Uruguay)</option>
                        <option value="+58">+58 (Venezuela)</option>
                    </select>
                </div>
                <div>
                    <label for="telefono" class="block text-sm font-medium text-gray-700">Teléfono:</label>
                    <input type="text" id="telefono" name="telefono" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="text-center">
                    <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded-lg shadow-md hover:bg-blue-600 transition duration-300">Registrarse</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('register_form').addEventListener('submit', function(event) {
            event.preventDefault();

            let formData = new FormData(document.getElementById('register_form'));
            let codigoPais = formData.get('codigo_pais');
            let telefono = formData.get('telefono');
            let telefonoCompleto = codigoPais + telefono;

            fetch('/user/registro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    'nombre': formData.get('nombre'),
                    'usuario': formData.get('usuario'),
                    'clave': formData.get('clave'),
                    'mail': formData.get('mail'),
                    'telefono': telefonoCompleto,
                    'activo': true  // Añadir el campo activo
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.detail) {
                    alert(data.detail);
                } else {
                    alert('Registro exitoso. Por favor, revise su correo electrónico para activar su cuenta.');
                    window.location.href = '/loginpage';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error en el registro');
            });
        });
    </script>
</body>
</html>
