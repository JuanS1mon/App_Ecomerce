<!-- templates/create_blog.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nuevo Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <!-- Incluir la barra de navegación -->
    {% include 'head.html' %}
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mt-5">Crear Nuevo Blog</h1>
        <form action="/create_blog" method="post" class="bg-white p-6 rounded shadow-md mt-4">
            <div class="mb-4">
                <label for="title" class="block text-gray-700">Título</label>
                <input type="text" class="form-control w-full p-2 border border-gray-300 rounded mt-1" id="title" name="title" required>
            </div>
            <div class="mb-4">
                <label for="content" class="block text-gray-700">Contenido</label>
                <textarea class="form-control w-full p-2 border border-gray-300 rounded mt-1" id="content" name="content" rows="5" maxlength="250" required></textarea>
                <small class="text-gray-500">Máximo 250 caracteres.</small>
            </div>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Crear</button>
        </form>
    </div>
</body>
</html>
